<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Payment Successful</title>

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
}

.container {
  max-width: 650px;
  margin: 70px auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 35px;
  border-radius: 16px;
  text-align: center;
  box-shadow:
    0 10px 35px rgba(0,0,0,.08);
}

.icon {
  font-size: 65px;
}

h1 {
  color: #16803c;
}

.info {
  text-align: left;
  margin-top: 25px;
}

.row {
  padding: 12px 0;
  border-bottom: 1px solid #eee;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 25px;
  border: none;
  border-radius: 8px;
  background: #16803c;
  color: white;
  font-size: 17px;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
}

#loading {
  color: #666;
}

#error {
  color: #c00;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="icon">
✓
</div>

<h1>
Payment Successful
</h1>

<p id="loading">
Verifying payment...
</p>

<div
  id="content"
  style="display:none">

<div class="info">

<div class="row">
<strong>Transaction ID:</strong>
<span id="txnid"></span>
</div>

<div class="row">
<strong>Product:</strong>
<span id="product"></span>
</div>

<div class="row">
<strong>Amount:</strong>
₹<span id="amount"></span>
</div>

<div class="row">
<strong>Name:</strong>
<span id="name"></span>
</div>

<div class="row">
<strong>Email:</strong>
<span id="email"></span>
</div>

</div>


<button
  id="downloadButton"
  onclick="downloadBook()">

Download eBook

</button>

</div>

<div id="error"></div>

</div>

</div>


<script>

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec";


const params =
  new URLSearchParams(
    window.location.search
  );


const txnid =
  params.get("txnid");


let orderData = null;


if (!txnid) {

  document.getElementById(
    "loading"
  ).style.display = "none";

  document.getElementById(
    "error"
  ).textContent =
    "Transaction ID missing.";

} else {

  checkPayment();
}


/*
 * Poll because PayU callback and
 * browser redirect can happen at
 * slightly different times.
 */
function checkPayment() {

  fetch(
    APPS_SCRIPT_URL +
    "?options=payment-status&txnid=" +
    encodeURIComponent(txnid)
  )

  .then(function(response) {

    return response.json();

  })

  .then(function(data) {

    if (!data.success) {

      retry();

      return;
    }


    if (
      String(data.status)
        .toUpperCase() ===
      "SUCCESS"
    ) {

      orderData = data;

      showSuccess();

      return;
    }


    if (
      String(data.status)
        .toUpperCase() ===
      "FAILED"
    ) {

      window.location.href =
        "./failed.html?txnid=" +
        encodeURIComponent(txnid);

      return;
    }


    retry();

  })

  .catch(function() {

    retry();

  });

}


function retry() {

  setTimeout(
    checkPayment,
    2500
  );

}


function showSuccess() {

  document.getElementById(
    "loading"
  ).style.display = "none";


  document.getElementById(
    "content"
  ).style.display = "block";


  document.getElementById(
    "txnid"
  ).textContent =
    orderData.txnid;


  document.getElementById(
    "product"
  ).textContent =
    orderData.product;


  document.getElementById(
    "amount"
  ).textContent =
    Number(orderData.amount)
      .toFixed(2);


  document.getElementById(
    "name"
  ).textContent =
    orderData.name;


  document.getElementById(
    "email"
  ).textContent =
    orderData.email;

}


function downloadBook() {

  const button =
    document.getElementById(
      "downloadButton"
    );


  button.disabled = true;

  button.textContent =
    "Preparing Download...";


  fetch(
    APPS_SCRIPT_URL +
    "?options=download&txnid=" +
    encodeURIComponent(txnid)
  )

  .then(function(response) {

    return response.json();

  })

  .then(function(data) {

    if (!data.success) {

      throw new Error(
        data.message ||
        "Download unavailable"
      );

    }


    window.location.href =
      data.url;

  })

  .catch(function(error) {

    document.getElementById(
      "error"
    ).textContent =
      error.message;


    button.disabled = false;

    button.textContent =
      "Download eBook";

  });

}

</script>

</body>

</html>
