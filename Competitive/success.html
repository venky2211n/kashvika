<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>
Payment Successful
</title>

<style>

body {

  margin: 0;

  font-family:
    Arial,
    sans-serif;

  background:
    #f5f7fb;

}

.card {

  max-width:
    650px;

  margin:
    60px auto;

  padding:
    30px;

  background:
    white;

  border-radius:
    15px;

  box-shadow:
    0 10px 35px
    rgba(0,0,0,.08);

}

.success {

  font-size:
    60px;

  text-align:
    center;

}

h1 {

  text-align:
    center;

}

.row {

  padding:
    13px 0;

  border-bottom:
    1px solid #eee;

}

.download {

  display:
    block;

  margin-top:
    25px;

  padding:
    14px;

  background:
    #1463ff;

  color:
    white;

  text-align:
    center;

  text-decoration:
    none;

  border-radius:
    8px;

}

.home {

  display:
    block;

  margin-top:
    12px;

  padding:
    14px;

  background:
    #eee;

  color:
    #222;

  text-align:
    center;

  text-decoration:
    none;

  border-radius:
    8px;

}

#status {

  text-align:
    center;

  margin-top:
    20px;

}

</style>

</head>

<body>


<div class="card">


<div class="success">
✓
</div>


<h1>
Payment Successful
</h1>


<div id="details">
Loading order...
</div>


<div id="downloadArea">
</div>


<div id="status">
</div>


<a
  class="home"
  href="/Competitive/"
>
Back to Store
</a>


</div>


<script>


/****************************************************
 * CONFIG
 ****************************************************/

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzpOrhZAxH6BmxJndRwKkK-5_fcvvMg9dx-Hj2c2YeRd1gopBDLUKpjXSVZ5MXOUrBtcg/exec";


/****************************************************
 * PARAMETERS
 ****************************************************/

const params =
  new URLSearchParams(
    window.location.search
  );


const txnid =
  params.get("txnid");


/****************************************************
 * LOAD ORDER
 ****************************************************/

if (!txnid) {

  document.getElementById(
    "details"
  ).textContent =
    "Transaction ID missing.";

} else {

  loadOrder();

}


/****************************************************
 * JSONP STATUS
 ****************************************************/

function loadOrder() {

  const callback =
    "statusCallback_" +
    Date.now();


  window[callback] =
    function(result) {

      try {

        if (
          !result.success ||
          !result.order
        ) {

          throw new Error(
            result.error ||
            "Order not found"
          );

        }


        const order =
          result.order;


        document.getElementById(
          "details"
        ).innerHTML = `

          <div class="row">
            <b>Transaction ID:</b>
            ${escapeHtml(order.txnid)}
          </div>

          <div class="row">
            <b>Product:</b>
            ${escapeHtml(order.product)}
          </div>

          <div class="row">
            <b>Amount:</b>
            ₹${Number(order.amount).toFixed(2)}
          </div>

          <div class="row">
            <b>Name:</b>
            ${escapeHtml(order.name)}
          </div>

          <div class="row">
            <b>Email:</b>
            ${escapeHtml(order.email)}
          </div>

          <div class="row">
            <b>Status:</b>
            ${escapeHtml(order.status)}
          </div>

        `;


        /*
         * Download only if SUCCESS
         */
        if (
          order.status ===
          "SUCCESS"
        ) {

          if (
            order.fileId
          ) {

            const downloadUrl =
              "https://drive.google.com/uc?" +
              "export=download&id=" +
              encodeURIComponent(
                order.fileId
              );


            document.getElementById(
              "downloadArea"
            ).innerHTML = `

              <a
                class="download"
                href="${downloadUrl}"
                target="_blank"
                rel="noopener"
              >
                Download eBook
              </a>

            `;

          }

        }


      } catch (err) {

        document.getElementById(
          "details"
        ).textContent =
          err.message;

      } finally {

        delete window[callback];

        script.remove();

      }

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    APPS_SCRIPT_URL +
    "?options=payment-status" +
    "&txnid=" +
    encodeURIComponent(txnid) +
    "&callback=" +
    encodeURIComponent(callback);


  script.onerror =
    function() {

      document.getElementById(
        "status"
      ).textContent =
        "Unable to load payment details.";

      delete window[callback];

      script.remove();

    };


  document.body.appendChild(
    script
  );

}


/****************************************************
 * ESCAPE
 ****************************************************/

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>

</html>
