<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>4Payment Successful</title>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f7f4;
}

.container{
  max-width:650px;
  margin:60px auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:15px;
  padding:35px;
  text-align:center;
  box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.success{
  font-size:60px;
}

h1{
  color:#15803d;
}

.info{
  text-align:left;
  margin-top:25px;
}

.row{
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

button,
a{
  display:inline-block;
  margin-top:25px;
  padding:14px 25px;
  border-radius:8px;
  text-decoration:none;
  border:0;
  cursor:pointer;
}

.download{
  background:#15803d;
  color:white;
}

.home{
  background:#2563eb;
  color:white;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="success">
✓
</div>

<h1>Payment Successful</h1>

<p>
Thank you for your purchase.
</p>

<div id="order">
Loading order...
</div>

</div>

</div>


<script>

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyRyStnq5DC16u4coWEPeGPOOBk8lJvmUctwxawDr9ZJIHPcmZ1132rrCsMO9l79A4x_A/exec";


const params =
new URLSearchParams(
window.location.search
);


const txnid =
params.get("txnid");







      

if (!txnid){

  document.getElementById("order")
    .innerHTML =
      "<p>Transaction ID missing.</p>";

}else{

  loadOrder();
}


function loadOrder(){

  const callbackName =
    "orderCallback_" +
    Date.now();


  window[callbackName] =
  function(response){

    try{

      if (!response.success){

        throw new Error(
          response.message ||
          "Order not found"
        );
      }


      const order =
        response.order;


      if (
        order.status !==
        "SUCCESS"
      ){

        document.getElementById("order")
          .innerHTML =
            "<p>Payment is still being verified.</p>";

        return;
      }


      /*
       * Download URL
       *
       * Apps Script has already stored
       * the Drive File ID in column K.
       */


      const downloadUrl =
        "https://drive.google.com/uc?export=download&id=" +
        encodeURIComponent(order.fileId);


      document.getElementById("order")
        .innerHTML = `

<div class="info">

<div class="row">
<span>Transaction</span>
<strong>
${escapeHtml(order.txnid)}
</strong>
</div>

<div class="row">
<span>Product</span>
<strong>
${escapeHtml(order.product)}
</strong>
</div>

<div class="row">
<span>Amount</span>
<strong>
₹${Number(order.amount).toFixed(2)}
</strong>
</div>

<div class="row">
<span>Name</span>
<strong>
${escapeHtml(order.name)}
</strong>
</div>

<div class="row">
<span>Email</span>
<strong>
${escapeHtml(order.email)}
</strong>
</div>

</div>

<a
 class="download"
 href="${downloadUrl}"
 target="_blank"
>
Download eBook
</a>

<br>

<a
 class="home"
 href="/Competitive-Exams/"
>
Back to Store
</a>

`;

    }catch(error){

      document.getElementById("order")
        .innerHTML =
          "<p>" +
          escapeHtml(error.message) +
          "</p>";
    }


    delete window[callbackName];

    document
      .getElementById(callbackName)
      ?.remove();
  };


  const script =
    document.createElement("script");


  script.id =
    callbackName;


  script.src =
    APPS_SCRIPT_URL +
    "?action=order" +
    "&txnid=" +
    encodeURIComponent(txnid) +
    "&callback=" +
    callbackName;


  document.body.appendChild(script);
}


function escapeHtml(value){

  return String(value || "")

  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

</script>

</body>
</html>
