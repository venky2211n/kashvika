
<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>
Payment Failed
</title>

<style>

body {

  margin: 0;

  font-family:
    Arial,
    sans-serif;

  background:
    #f5f7fb;

}

.card {

  max-width:
    600px;

  margin:
    70px auto;

  padding:
    35px;

  background:
    white;

  border-radius:
    15px;

  text-align:
    center;

  box-shadow:
    0 10px 35px
    rgba(0,0,0,.08);

}

.icon {

  font-size:
    60px;

}

a {

  display:
    block;

  margin-top:
    25px;

  padding:
    14px;

  background:
    #1463ff;

  color:
    white;

  text-decoration:
    none;

  border-radius:
    8px;

}

</style>

</head>

<body>


<div class="card">


<div class="icon">
✕
</div>


<h1>
Payment Failed
</h1>


<p>
Your payment was not completed.
</p>


<p id="txn">
</p>


<a
  href="/Competitive/"
>
Return to Store
</a>


</div>


<script>


const params =
  new URLSearchParams(
    window.location.search
  );


const txnid =
  params.get("txnid");


if (txnid) {

  document.getElementById(
    "txn"
  ).textContent =
    "Transaction ID: " +
    txnid;

}

</script>

</body>

</html>
