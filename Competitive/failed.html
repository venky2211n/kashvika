<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Payment Failed</title>

<style>

body {
  margin: 0;
  font-family: Arial;
  background: #f5f7fb;
}

.container {
  max-width: 600px;
  margin: 80px auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 40px;
  border-radius: 15px;
  text-align: center;
  box-shadow:
    0 10px 30px rgba(0,0,0,.08);
}

.icon {
  font-size: 60px;
}

h1 {
  color: #c62828;
}

button {
  margin-top: 25px;
  padding: 14px 25px;
  border: none;
  border-radius: 8px;
  background: #111827;
  color: white;
  cursor: pointer;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="icon">
✕
</div>

<h1>
Payment Failed
</h1>

<p>
We could not complete your payment.
</p>

<p>
Transaction ID:
</p>

<strong id="txnid">
</strong>

<br>

<button
  onclick="window.location.href='./index.html'">

Back to Store

</button>

</div>

</div>


<script>

const params =
  new URLSearchParams(
    window.location.search
  );


document.getElementById(
  "txnid"
).textContent =
  params.get("txnid") ||
  "Not available";

</script>

</body>

</html>
