<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Checkout</title>

<style>

body {
  font-family: Arial;
  background: #f5f7fb;
}

.container {
  max-width: 600px;
  margin: 50px auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 15px;
}

input {
  width: 100%;
  padding: 13px;
  margin: 8px 0 15px;
  box-sizing: border-box;
}

button {
  width: 100%;
  padding: 14px;
  background: #111827;
  color: white;
  border: 0;
  border-radius: 8px;
}

#error {
  color: red;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h2 id="title">
Loading book...
</h2>

<p>
₹<span id="price"></span>
</p>

<div id="error"></div>

<input
  id="name"
  placeholder="Full Name">

<input
  id="email"
  type="email"
  placeholder="Email">

<input
  id="phone"
  maxlength="10"
  placeholder="Phone">

<button
  onclick="pay()"
  id="payButton">

Proceed to Pay

</button>

</div>

</div>


<script>

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxgH6uIkyWWL3oV9m-jLCUoAHeHZMRIHOpFSNSjY_LVqlY_rfP2Yqei6I_8R8c_6-XasA/exec";


const params =
  new URLSearchParams(
    window.location.search
  );


const bookId =
  params.get("id");


let book = null;


/*
 * Load book
 */
fetch(
  APPS_SCRIPT_URL +
  "?options=book-json&id=" +
  encodeURIComponent(bookId)
)

.then(function(response) {

  return response.json();

})

.then(function(data) {

  if (!data.success) {

    throw new Error(
      "Book not found"
    );
  }


  book = data;


  document.getElementById(
    "title"
  ).textContent =
    book.title;


  document.getElementById(
    "price"
  ).textContent =
    Number(book.price)
      .toFixed(2);

})

.catch(function(error) {

  document.getElementById(
    "error"
  ).textContent =
    error.message;

});


function pay() {

  const name =
    document.getElementById(
      "name"
    ).value.trim();


  const email =
    document.getElementById(
      "email"
    ).value.trim();


  const phone =
    document.getElementById(
      "phone"
    ).value.trim();


  const error =
    document.getElementById(
      "error"
    );


  if (!name) {

    error.textContent =
      "Enter your name.";

    return;
  }


  if (!email) {

    error.textContent =
      "Enter your email.";

    return;
  }


  if (!/^[0-9]{10}$/.test(phone)) {

    error.textContent =
      "Enter a valid 10 digit phone.";

    return;
  }


  const button =
    document.getElementById(
      "payButton"
    );


  button.disabled = true;

  button.textContent =
    "Preparing Payment...";


  /*
   * IMPORTANT
   *
   * The secret PayU salt remains
   * inside Apps Script.
   */
  fetch(
    APPS_SCRIPT_URL +
    "?options=create-payment",
    {

      method: "POST",

      headers: {
        "Content-Type":
          "application/json"
      },

      body: JSON.stringify({

        bookId: bookId,

        name: name,

        email: email,

        phone: phone

      })

    }
  )

  .then(function(response) {

    return response.json();

  })

  .then(function(result) {

    if (!result.success) {

      throw new Error(
        result.message ||
        "Payment creation failed"
      );

    }


    /*
     * Create PayU form.
     */
    const form =
      document.createElement(
        "form"
      );


    form.method = "POST";

    form.action =
      result.payuUrl;


    add(
      form,
      "key",
      result.key
    );


    add(
      form,
      "txnid",
      result.txnid
    );


    add(
      form,
      "amount",
      result.amount
    );


    add(
      form,
      "productinfo",
      result.productinfo
    );


    add(
      form,
      "firstname",
      result.firstname
    );


    add(
      form,
      "email",
      result.email
    );


    add(
      form,
      "phone",
      result.phone
    );


    add(
      form,
      "surl",
      result.surl
    );


    add(
      form,
      "furl",
      result.furl
    );


    add(
      form,
      "hash",
      result.hash
    );


    add(form, "udf1", "");
    add(form, "udf2", "");
    add(form, "udf3", "");
    add(form, "udf4", "");
    add(form, "udf5", "");


    document.body.appendChild(form);

    form.submit();

  })

  .catch(function(error) {

    error.textContent =
      error.message;

    button.disabled = false;

    button.textContent =
      "Proceed to Pay";

  });

}


function add(
  form,
  name,
  value
) {

  const input =
    document.createElement(
      "input"
    );

  input.type = "hidden";

  input.name = name;

  input.value = value;

  form.appendChild(input);
}

</script>

</body>

</html>
