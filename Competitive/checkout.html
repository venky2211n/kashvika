
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>love u Checkout</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #222;
}

.container {
  max-width: 850px;
  margin: 40px auto;
  padding: 20px;
}

.checkout-box {
  background: #fff;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

h1 {
  text-align: center;
  margin-bottom: 30px;
}

.book-section {
  display: flex;
  gap: 25px;
  padding-bottom: 25px;
  margin-bottom: 25px;
  border-bottom: 1px solid #ddd;
}

.book-image {
  width: 180px;
  height: 240px;
  object-fit: cover;
  border-radius: 8px;
  background: #eee;
}

.book-info {
  flex: 1;
}

.book-title {
  font-size: 25px;
  font-weight: bold;
  margin-bottom: 12px;
}

.book-description {
  color: #666;
  line-height: 1.6;
  margin-bottom: 15px;
}

.category {
  display: inline-block;
  padding: 6px 12px;
  background: #eef2ff;
  color: #3949ab;
  border-radius: 20px;
  font-size: 13px;
  margin-bottom: 15px;
}

.price {
  font-size: 25px;
  font-weight: bold;
  color: #198754;
}

.form-group {
  margin-bottom: 18px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 7px;
}

input {
  width: 100%;
  padding: 13px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 7px;
}

input:focus {
  outline: none;
  border-color: #3949ab;
}

#payButton {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 8px;
  background: #198754;
  color: #fff;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

#payButton:hover:not(:disabled) {
  background: #157347;
}

#payButton:disabled {
  background: #999;
  cursor: not-allowed;
}

#message {
  text-align: center;
  margin-top: 20px;
  min-height: 25px;
}

.loading {
  color: #555;
}

.success {
  color: #198754;
}

.error {
  color: #dc3545;
}

.back {
  display: block;
  text-align: center;
  margin-top: 20px;
  text-decoration: none;
  color: #3949ab;
}

@media(max-width:650px) {

  .container {
    margin: 10px auto;
    padding: 10px;
  }

  .checkout-box {
    padding: 20px;
  }

  .book-section {
    flex-direction: column;
    text-align: center;
  }

  .book-image {
    margin: auto;
    width: 150px;
    height: 200px;
  }

}

</style>
</head>

<body>

<div class="container">

  <div class="checkout-box">

    <h1>Checkout</h1>

    <!-- BOOK -->

    <div class="book-section">

      <img
        id="bookImage"
        class="book-image"
        src=""
        alt="Book">

      <div class="book-info">

        <div
          id="bookTitle"
          class="book-title">
          Loading book...
        </div>

        <div
          id="bookCategory"
          class="category">
          Loading...
        </div>

        <div
          id="bookDescription"
          class="book-description">
          Please wait...
        </div>

        <div
          id="bookPrice"
          class="price">
          ₹0.00
        </div>

      </div>

    </div>


    <!-- CHECKOUT FORM -->

    <form id="checkoutForm">

      <div class="form-group">

        <label for="name">
          Full Name
        </label>

        <input
          type="text"
          id="name"
          required
          placeholder="Enter your name">

      </div>


      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          type="email"
          id="email"
          required
          placeholder="Enter your email">

      </div>


      <div class="form-group">

        <label for="phone">
          Phone
        </label>

        <input
          type="tel"
          id="phone"
          required
          placeholder="Enter your phone number">

      </div>


      <button
        type="submit"
        id="payButton"
        disabled>

        Loading...

      </button>

    </form>


    <div id="message"></div>


    <a
      href="./index.html"
      class="back">

      ← Back to Books

    </a>

  </div>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzAkSJIKHHUt1fUE762fdrKeRArwRlrVuyn7Qyz1Nls_SC9dBANG6Fp5JK_9ZNXeH4b9g/exec";


const CUSTOM_DOMAIN =
"https://kashvika.website/Competitive";


/* =====================================================
   VARIABLES
===================================================== */

let currentBook = null;

let paymentWindow = null;

let pollingTimer = null;

let pollingStarted = false;

let paymentStarted = false;


/* =====================================================
   GET BOOK ID
===================================================== */

const params =
new URLSearchParams(
  window.location.search
);

const bookId =
params.get("id");


/* =====================================================
   ELEMENTS
===================================================== */

const bookImage =
document.getElementById("bookImage");

const bookTitle =
document.getElementById("bookTitle");

const bookCategory =
document.getElementById("bookCategory");

const bookDescription =
document.getElementById("bookDescription");

const bookPrice =
document.getElementById("bookPrice");

const checkoutForm =
document.getElementById("checkoutForm");

const payButton =
document.getElementById("payButton");

const message =
document.getElementById("message");


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  type = ""
) {

  message.textContent = text;

  message.className = type;

}


/* =====================================================
   JSONP
===================================================== */

function callAppsScript(
  params,
  callback
) {

  const callbackName =
    "jsonp_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  params.callback =
    callbackName;


  const script =
    document.createElement("script");


  const query =
    new URLSearchParams(
      params
    ).toString();


  let completed = false;


  function cleanup() {

    if (completed) {
      return;
    }

    completed = true;


    try {
      delete window[callbackName];
    } catch (e) {
    }


    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

  }


  window[callbackName] =
    function(data) {

      cleanup();

      callback(data);

    };


  script.onerror =
    function() {

      cleanup();

      callback({
        success: false,
        error:
          "Unable to connect to Apps Script."
      });

    };


  script.src =
    APPS_SCRIPT_URL +
    "?" +
    query;


  document.body.appendChild(
    script
  );

}


/* =====================================================
   LOAD BOOK
===================================================== */

function loadBook() {

  if (!bookId) {

    bookTitle.textContent =
      "Book ID missing";

    payButton.disabled =
      true;

    payButton.textContent =
      "Book Not Found";

    return;
  }


  showMessage(
    "Loading book...",
    "loading"
  );


  callAppsScript(
    {
      options: "book-data",
      id: bookId
    },

    function(result) {

      console.log(
        "BOOK:",
        result
      );


      if (
        !result ||
        !result.success ||
        !result.book
      ) {

        bookTitle.textContent =
          "Book not found";

        payButton.disabled =
          true;

        payButton.textContent =
          "Unable to Continue";

        showMessage(
          result?.error ||
          "Unable to load book.",
          "error"
        );

        return;
      }


      currentBook =
        result.book;


      bookTitle.textContent =
        currentBook.title;


      bookCategory.textContent =
        currentBook.category ||
        "eBook";


      bookDescription.textContent =
        currentBook.description ||
        "";


      const amount =
        Number(
          currentBook.price || 0
        );


      bookPrice.textContent =
        "₹" +
        amount.toFixed(2);


      if (
        currentBook.imageUrl
      ) {

        bookImage.src =
          currentBook.imageUrl;

      }


      /*
         ENABLE PAY BUTTON
      */

      payButton.disabled =
        false;


      payButton.textContent =
        "Proceed to Pay ₹" +
        amount.toFixed(2);


      showMessage("");

    }
  );

}


/* =====================================================
   FORM SUBMIT
===================================================== */

checkoutForm.addEventListener(
  "submit",
  function(event) {

    event.preventDefault();

    startPayment();

  }
);


/* =====================================================
   START PAYMENT
===================================================== */

function startPayment() {

  if (paymentStarted) {
    return;
  }


  if (!currentBook) {

    showMessage(
      "Book is still loading.",
      "error"
    );

    return;
  }


  const name =
    document
      .getElementById("name")
      .value
      .trim();


  const email =
    document
      .getElementById("email")
      .value
      .trim();


  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  if (!name ||
      !email ||
      !phone) {

    showMessage(
      "Please enter all customer details.",
      "error"
    );

    return;
  }


  paymentStarted =
    true;


  payButton.disabled =
    true;


  payButton.textContent =
    "Preparing Payment...";


  showMessage(
    "Opening PayU payment window...",
    "loading"
  );


  /*
     IMPORTANT

     Popup MUST be opened here,
     directly inside the click event.

     This avoids popup blocker.
  */

  paymentWindow =
    window.open(
      "",
      "PayUPaymentWindow",
      "width=520,height=760,left=200,top=50,scrollbars=yes,resizable=yes"
    );


  if (!paymentWindow) {

    paymentStarted =
      false;


    payButton.disabled =
      false;


    payButton.textContent =
      "Proceed to Pay ₹" +
      Number(
        currentBook.price
      ).toFixed(2);


    showMessage(
      "Popup blocked. Please allow popups for this website.",
      "error"
    );

    return;
  }


  /*
     Show temporary page
     inside popup
  */

  try {

    paymentWindow.document.open();

    paymentWindow.document.write(`
      <!DOCTYPE html>
      <html>
      <head>
        <title>PayU Payment</title>
      </head>

      <body style="
        font-family:Arial;
        text-align:center;
        padding:50px;
      ">

        <h2>Preparing Payment...</h2>

        <p>
          Please wait while we connect to PayU.
        </p>

      </body>
      </html>
    `);

    paymentWindow.document.close();

  } catch (e) {

    console.log(e);

  }


  /*
     CREATE PAYMENT
  */

  callAppsScript(
    {
      options:
        "create-payment",

      id:
        currentBook.bookId,

      name:
        name,

      email:
        email,

      phone:
        phone

    },

    function(result) {

      console.log(
        "CREATE PAYMENT:",
        result
      );


      if (
        !result ||
        !result.success
      ) {

        closePaymentWindow();


        paymentStarted =
          false;


        payButton.disabled =
          false;


        payButton.textContent =
          "Proceed to Pay ₹" +
          Number(
            currentBook.price
          ).toFixed(2);


        showMessage(
          result?.error ||
          "Unable to create payment.",
          "error"
        );

        return;
      }


      /*
         PAYMENT CREATED

         Now submit the PayU form
         inside popup.
      */

      submitPayU(
        result.paymentUrl,
        result.paymentData
      );


      /*
         START POLLING
      */

      if (result.txnid) {

        startPolling(
          result.txnid
        );

      }

    }
  );

}


/* =====================================================
   SUBMIT PAYU FORM INSIDE POPUP
===================================================== */

function submitPayU(
  paymentUrl,
  paymentData
) {

  if (
    !paymentWindow ||
    paymentWindow.closed
  ) {

    showMessage(
      "Payment window was closed.",
      "error"
    );

    paymentStarted =
      false;

    payButton.disabled =
      false;

    return;
  }


  try {

    const form =
      paymentWindow.document
        .createElement("form");


    form.method =
      "POST";


    form.action =
      paymentUrl;


    form.style.display =
      "none";


    Object.keys(
      paymentData || {}
    ).forEach(
      function(key) {

        const input =
          paymentWindow.document
            .createElement("input");


        input.type =
          "hidden";


        input.name =
          key;


        input.value =
          paymentData[key];


        form.appendChild(
          input
        );

      }
    );


    paymentWindow.document.body
      .appendChild(form);


    /*
       This loads the actual PayU
       hosted checkout into popup.
    */

    form.submit();


  } catch (error) {

    console.error(
      "PayU ERROR:",
      error
    );


    closePaymentWindow();


    paymentStarted =
      false;


    payButton.disabled =
      false;


    showMessage(
      "Unable to open PayU.",
      "error"
    );

  }

}


/* =====================================================
   START POLLING
===================================================== */

function startPolling(
  txnid
) {

  if (pollingStarted) {
    return;
  }


  pollingStarted =
    true;


  let attempts = 0;


  showMessage(
    "Waiting for payment confirmation...",
    "loading"
  );


  /*
     Check immediately
  */

  checkPaymentStatus(
    txnid
  );


  /*
     Then every 3 seconds
  */

  pollingTimer =
    setInterval(
      function() {

        attempts++;


        console.log(
          "Polling:",
          attempts,
          txnid
        );


        checkPaymentStatus(
          txnid
        );


        /*
           200 × 3 seconds
           = 10 minutes
        */

        if (
          attempts >= 200
        ) {

          stopPolling();


          showMessage(
            "Payment verification timed out. Please contact support.",
            "error"
          );

        }

      },
      3000
    );

}


/* =====================================================
   CHECK PAYMENT STATUS
===================================================== */

function checkPaymentStatus(
  txnid
) {

  callAppsScript(
    {
      options:
        "payment-status",

      txnid:
        txnid

    },

    function(result) {

      console.log(
        "STATUS RESPONSE:",
        result
      );


      if (
        !result ||
        !result.success
      ) {

        return;
      }


      const order =
        result.order;


      if (!order) {
        return;
      }


      const status =
        String(
          order.status || ""
        ).toUpperCase();


      console.log(
        "ORDER STATUS:",
        status
      );


      /*
         SUCCESS
      */

      if (
        status === "SUCCESS"
      ) {

        paymentSuccess(
          txnid
        );

        return;
      }


      /*
         FAILED
      */

      if (
        status === "FAILED"
      ) {

        paymentFailed(
          txnid
        );

        return;
      }


      /*
         PENDING

         Do nothing.

         Poll again after 3 seconds.
      */

      showMessage(
        "Payment processing...",
        "loading"
      );

    }
  );

}


/* =====================================================
   SUCCESS
===================================================== */

function paymentSuccess(
  txnid
) {

  console.log(
    "PAYMENT SUCCESS:",
    txnid
  );


  stopPolling();


  showMessage(
    "Payment successful. Closing payment window...",
    "success"
  );


  /*
     CLOSE PAYU POPUP
  */

  closePaymentWindow();


  /*
     REDIRECT MAIN WINDOW
  */

  setTimeout(
    function() {

      window.location.href =
        CUSTOM_DOMAIN +
        "/success.html?txnid=" +
        encodeURIComponent(
          txnid
        );

    },
    800
  );

}


/* =====================================================
   FAILED
===================================================== */

function paymentFailed(
  txnid
) {

  console.log(
    "PAYMENT FAILED:",
    txnid
  );


  stopPolling();


  showMessage(
    "Payment failed. Closing payment window...",
    "error"
  );


  /*
     CLOSE PAYU POPUP
  */

  closePaymentWindow();


  /*
     REDIRECT MAIN WINDOW
  */

  setTimeout(
    function() {

      window.location.href =
        CUSTOM_DOMAIN +
        "/failed.html?txnid=" +
        encodeURIComponent(
          txnid
        );

    },
    800
  );

}


/* =====================================================
   CLOSE PAYU WINDOW
===================================================== */

function closePaymentWindow() {

  if (
    paymentWindow &&
    !paymentWindow.closed
  ) {

    try {

      paymentWindow.close();

    } catch (e) {

      console.log(
        "Unable to close popup:",
        e
      );

    }

  }


  paymentWindow =
    null;

}


/* =====================================================
   STOP POLLING
===================================================== */

function stopPolling() {

  if (pollingTimer) {

    clearInterval(
      pollingTimer
    );

  }


  pollingTimer =
    null;


  pollingStarted =
    false;

}


/* =====================================================
   PAGE LOAD
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    console.log(
      "Checkout loaded"
    );


    console.log(
      "Book ID:",
      bookId
    );


    loadBook();

  }
);

</script>

</body>
</html>
