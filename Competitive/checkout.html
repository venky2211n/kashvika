<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Checkout</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
}

.container {
  max-width: 650px;
  margin: 50px auto;
  padding: 20px;
}

.card {
  background: #fff;
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,.08);
}

h1 {
  margin-top: 0;
}

.book-title {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 10px;
}

.price {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 25px;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 13px;
  margin-top: 7px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 25px;
  border: 0;
  border-radius: 8px;
  background: #111827;
  color: white;
  font-size: 17px;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
}

#error {
  color: #d00000;
  margin-top: 15px;
}

#loading {
  color: #666;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div id="loading">
Loading book...
</div>

<div id="checkout" style="display:none">

<div class="book-title"
     id="bookTitle">
</div>

<div class="price">
₹<span id="bookPrice"></span>
</div>


<form
  id="paymentForm"
  method="POST"
  action="https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec">

<input
  type="hidden"
  name="options"
  value="create-payment">


<input
  type="hidden"
  name="bookId"
  id="bookId">


<label>
Full Name
</label>

<input
  type="text"
  name="name"
  id="name"
  required
  placeholder="Enter your full name">


<label>
Email
</label>

<input
  type="email"
  name="email"
  id="email"
  required
  placeholder="Enter your email">


<label>
Phone
</label>

<input
  type="tel"
  name="phone"
  id="phone"
  maxlength="10"
  pattern="[0-9]{10}"
  required
  placeholder="10 digit mobile number">


<button
  type="submit"
  id="payButton">

Proceed to Pay

</button>

</form>

<div id="error"></div>

</div>

</div>

</div>


<script>

/*
 * Get book ID from:
 *
 * checkout.html?id=102
 */

const params =
  new URLSearchParams(
    window.location.search
  );

const bookId =
  params.get("id");


/*
 * IMPORTANT:
 *
 * Put your Apps Script deployment URL here.
 */
const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxgH6uIkyWWL3oV9m-jLCUoAHeHZMRIHOpFSNSjY_LVqlY_rfP2Yqei6I_8R8c_6-XasA/exec";


/*
 * --------------------------------------------------
 * BOOK DATA
 *
 * Put your books here.
 *
 * This removes the cross-origin fetch completely.
 * --------------------------------------------------
 */

const books = {

  "101": {
    title: "Digital Marketing Guide",
    price: 199
  },

  "102": {
    title: "Personal Finance Mastery",
    price: 299
  }

};


/*
 * Check ID
 */

if (!bookId) {

  showError(
    "Book ID is missing."
  );

} else if (!books[bookId]) {

  showError(
    "Book not found."
  );

} else {

  const book =
    books[bookId];


  document.getElementById(
    "bookTitle"
  ).textContent =
    book.title;


  document.getElementById(
    "bookPrice"
  ).textContent =
    Number(book.price).toFixed(2);


  document.getElementById(
    "bookId"
  ).value =
    bookId;


  /*
   * Change form action dynamically.
   */
  document.getElementById(
    "paymentForm"
  ).action =
    APPS_SCRIPT_URL;


  document.getElementById(
    "loading"
  ).style.display =
    "none";


  document.getElementById(
    "checkout"
  ).style.display =
    "block";
}


/*
 * Form submit
 */

document.getElementById(
  "paymentForm"
).addEventListener(
  "submit",
  function() {

    const button =
      document.getElementById(
        "payButton"
      );


    button.disabled = true;

    button.textContent =
      "Preparing Payment...";

  }
);


function showError(message) {

  document.getElementById(
    "loading"
  ).style.display =
    "none";


  document.getElementById(
    "error"
  ).textContent =
    message;
}

</script>

</body>

</html>
