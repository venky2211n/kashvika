<body>


<h1>Checkout</h1>


<div class="checkout-container">


  <!-- =========================================
       BOOK DETAILS
  ========================================== -->

  <div class="card">

    <div
      id="bookInfo"
      class="loading"
    >
      Fetching book details...
    </div>

  </div>



  <!-- =========================================
       CUSTOMER DETAILS
  ========================================== -->

  <div class="card">

    <h2>Customer Details</h2>


    <form id="checkoutForm">


      <label for="name">
        Name
      </label>

      <input
        type="text"
        id="name"
        placeholder="Enter your name"
        required
      >


      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >


      <label for="phone">
        Phone
      </label>

      <input
        type="tel"
        id="phone"
        placeholder="Enter your phone number"
        required
      >



      <button
        type="button"
        id="payButton"
        onclick="startPayment()"
        disabled
      >
        Loading...
      </button>


    </form>


    <div id="message"></div>


  </div>

</div>



<script>

/* =====================================================
   CONFIGURATION
===================================================== */


/*
 * IMPORTANT:
 *
 * This must be the SAME Apps Script deployment
 * that returned your book JSON successfully.
 */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzAkSJIKHHUt1fUE762fdrKeRArwRlrVuyn7Qyz1Nls_SC9dBANG6Fp5JK_9ZNXeH4b9g/exec";


/*
 * Custom domain
 */

const CUSTOM_DOMAIN =
  "https://kashvika.website/Competitive";



/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentBook = null;

let paymentWindow = null;

let pollingTimer = null;

let pollingStarted = false;

let paymentFinished = false;



/* =====================================================
   GET BOOK ID
===================================================== */

const urlParams =
  new URLSearchParams(
    window.location.search
  );


const bookId =
  urlParams.get("id");



/* =====================================================
   JSONP
===================================================== */

function callAppsScript(params, callback) {


  const callbackName =

    "jsonp_" +

    Date.now() +

    "_" +

    Math.floor(
      Math.random() * 100000
    );


  params.callback =
    callbackName;



  const script =
    document.createElement("script");


  const query =
    new URLSearchParams(
      params
    ).toString();



  let completed = false;



  window[callbackName] =
    function(data) {

      if (completed) {
        return;
      }

      completed = true;


      try {

        callback(data);

      }

      finally {

        try {
          delete window[callbackName];
        }
        catch(e) {
          window[callbackName] =
            undefined;
        }


        if (script.parentNode) {

          script.parentNode
            .removeChild(script);

        }

      }

    };



  script.src =
    APPS_SCRIPT_URL +
    "?" +
    query;



  script.onerror =
    function() {

      if (completed) {
        return;
      }

      completed = true;


      try {
        delete window[callbackName];
      }
      catch(e) {
        window[callbackName] =
          undefined;
      }


      if (script.parentNode) {

        script.parentNode
          .removeChild(script);

      }


      callback({

        success: false,

        error:
          "Failed to connect to payment server"

      });

    };



  document
    .body
    .appendChild(script);

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(value || "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/* =====================================================
   LOAD BOOK
===================================================== */

function loadBook() {


  const bookInfo =
    document.getElementById(
      "bookInfo"
    );


  const payButton =
    document.getElementById(
      "payButton"
    );



  if (!bookId) {

    bookInfo.innerHTML =
      '<div class="error">' +
      'Book ID is missing.' +
      '</div>';

    return;

  }



  bookInfo.innerHTML =
    '<div class="loading">' +
    'Fetching book details...' +
    '</div>';



  const callbackName =

    "bookCallback_" +

    Date.now();



  window[callbackName] =
    function(result) {


      console.log(
        "BOOK RESPONSE:",
        result
      );



      if (
        !result ||
        result.success !== true
      ) {

        bookInfo.innerHTML =

          '<div class="error">' +

          (
            result &&
            result.error

              ? escapeHtml(
                  result.error
                )

              : "Book not found"
          ) +

          '</div>';


        return;

      }



      if (!result.book) {

        bookInfo.innerHTML =

          '<div class="error">' +

          'Book data is empty.' +

          '</div>';


        return;

      }



      currentBook =
        result.book;



      /* =========================================
         DISPLAY BOOK
      ========================================== */

      let html = "";



      if (
        currentBook.imageUrl
      ) {

        html += `

          <img

            src="${escapeHtml(
              currentBook.imageUrl
            )}"

            class="book-image"

            alt="${escapeHtml(
              currentBook.title
            )}"

            onerror="
              this.style.display='none'
            "

          >

        `;

      }



      html += `

        <div class="book-title">

          ${escapeHtml(
            currentBook.title
          )}

        </div>

      `;



      if (
        currentBook.category
      ) {

        html += `

          <div class="category">

            <span>

              ${escapeHtml(
                currentBook.category
              )}

            </span>

          </div>

        `;

      }



      html += `

        <div class="book-description">

          ${escapeHtml(
            currentBook.description || ""
          )}

        </div>


        <div class="price">

          ₹${Number(
            currentBook.price || 0
          ).toFixed(2)}

        </div>

      `;



      bookInfo.innerHTML =
        html;



      /* =========================================
         ENABLE PAYMENT BUTTON
      ========================================== */

      payButton.disabled =
        false;


      payButton.innerText =
        "Proceed to Pay ₹" +

        Number(
          currentBook.price || 0
        ).toFixed(2);



      try {

        delete window[callbackName];

      }

      catch(e) {

        window[callbackName] =
          undefined;

      }

    };



  /* =========================================
     JSONP REQUEST
  ========================================== */

  const script =
    document.createElement(
      "script"
    );


  const requestUrl =

    APPS_SCRIPT_URL +

    "?options=book-data" +

    "&id=" +

    encodeURIComponent(
      bookId
    ) +

    "&callback=" +

    encodeURIComponent(
      callbackName
    ) +

    "&_=" +

    Date.now();



  console.log(
    "BOOK REQUEST:",
    requestUrl
  );



  script.src =
    requestUrl;



  script.onerror =
    function() {

      bookInfo.innerHTML =

        '<div class="error">' +

        'Failed to fetch book details.' +

        '<br><br>' +

        'Please try again.' +

        '</div>';



      payButton.disabled =
        true;

    };



  document
    .body
    .appendChild(script);

}



/* =====================================================
   START PAYMENT
===================================================== */

function startPayment() {


  const bookId =
    new URLSearchParams(
      window.location.search
    ).get("id");



  const name =
    document
      .getElementById("name")
      .value
      .trim();



  const email =
    document
      .getElementById("email")
      .value
      .trim();



  const phone =
    document
      .getElementById("phone")
      .value
      .trim();



  const message =
    document.getElementById(
      "message"
    );



  if (!bookId) {

    message.innerText =
      "Book ID is missing.";

    return;

  }



  if (
    !name ||
    !email ||
    !phone
  ) {

    message.innerText =
      "Please enter name, email and phone.";

    return;

  }



  if (!currentBook) {

    message.innerText =
      "Book details are still loading.";

    return;

  }



  /*
   * Open popup immediately
   * from user's click.
   */

  paymentWindow =
    window.open(
      "",
      "PayUPaymentWindow",
      "width=520,height=760,scrollbars=yes,resizable=yes"
    );



  if (!paymentWindow) {

    message.innerText =
      "Please allow popups for this website.";

    return;

  }



  /* =========================================
     POPUP LOADING SCREEN
  ========================================== */

  paymentWindow.document.open();


  paymentWindow.document.write(`

    <!DOCTYPE html>

    <html>

    <head>

      <title>PayU Payment</title>

    </head>

    <body
      style="
        font-family:Arial;
        text-align:center;
        padding:40px;
      "
    >

      <h2>
        Preparing payment...
      </h2>

      <p>
        Please wait...
      </p>

    </body>

    </html>

  `);


  paymentWindow.document.close();



  message.innerText =
    "Preparing payment...";



  /* =========================================
     CREATE PAYMENT
  ========================================== */

  callAppsScript({

    options:
      "create-payment",

    id:
      bookId,

    name:
      name,

    email:
      email,

    phone:
      phone

  }, function(result) {


    console.log(
      "CREATE PAYMENT:",
      result
    );



    if (
      !result ||
      result.success !== true
    ) {


      if (
        paymentWindow &&
        !paymentWindow.closed
      ) {

        paymentWindow.close();

      }


      message.innerText =
        result &&
        result.error

          ? result.error

          : "Unable to create payment.";


      return;

    }



    /* =========================================
       SEND PAYMENT TO PAYU
    ========================================== */

    submitToPayU(

      result.paymentUrl,

      result.paymentData

    );



    message.innerText =
      "Payment window opened. Complete your payment.";



    /* =========================================
       START POLLING
    ========================================== */

    startPaymentPolling(
      result.txnid
    );

  });

}



/* =====================================================
   SUBMIT FORM TO PAYU
===================================================== */

function submitToPayU(
  paymentUrl,
  paymentData
) {


  if (
    !paymentWindow ||
    paymentWindow.closed
  ) {

    return;

  }



  const form =
    paymentWindow.document
      .createElement("form");



  form.method =
    "POST";


  form.action =
    paymentUrl;


  form.style.display =
    "none";



  Object.keys(
    paymentData
  ).forEach(
    function(key) {


      const input =
        paymentWindow.document
          .createElement("input");


      input.type =
        "hidden";


      input.name =
        key;


      input.value =
        paymentData[key];


      form.appendChild(
        input
      );

    }
  );



  paymentWindow.document
    .body
    .appendChild(
      form
    );



  form.submit();

}



/* =====================================================
   START POLLING
===================================================== */

function startPaymentPolling(
  txnid
) {


  if (pollingStarted) {

    return;

  }



  pollingStarted =
    true;



  let attempts = 0;



  /*
   * Check immediately
   */

  checkPaymentStatus(
    txnid
  );



  /*
   * Then every 3 seconds
   */

  pollingTimer =
    setInterval(
      function() {


        attempts++;


        checkPaymentStatus(
          txnid
        );



        /*
         * 10 minutes
         *
         * 600 / 3 = 200
         */

        if (
          attempts >= 200
        ) {


          clearInterval(
            pollingTimer
          );


          pollingTimer =
            null;


          pollingStarted =
            false;


          document
            .getElementById(
              "message"
            )
            .innerText =
              "Payment verification timed out. Please check your payment status.";

        }


      },
      3000
    );

}



/* =====================================================
   CHECK PAYMENT STATUS
===================================================== */

function checkPaymentStatus(
  txnid
) {


  if (paymentFinished) {

    return;

  }



  callAppsScript({

    options:
      "payment-status",

    txnid:
      txnid

  }, function(result) {


    console.log(
      "PAYMENT STATUS:",
      result
    );



    if (
      !result ||
      result.success !== true
    ) {

      return;

    }



    const order =
      result.order;



    if (!order) {

      return;

    }



    const status =
      String(
        order.status || ""
      ).toUpperCase();



    console.log(
      "ORDER STATUS:",
      status
    );



    /* =========================================
       SUCCESS
    ========================================== */

    if (
      status === "SUCCESS"
    ) {

      paymentCompleted(
        txnid
      );

      return;

    }



    /* =========================================
       FAILED
    ========================================== */

    if (
      status === "FAILED"
    ) {

      paymentFailed(
        txnid
      );

      return;

    }



    /*
     * PENDING
     *
     * Continue polling.
     */

    document
      .getElementById(
        "message"
      )
      .innerText =
        "Payment processing...";

  });

}



/* =====================================================
   PAYMENT SUCCESS
===================================================== */

function paymentCompleted(
  txnid
) {


  if (paymentFinished) {

    return;

  }


  paymentFinished =
    true;



  /* =========================================
     STOP POLLING
  ========================================== */

  if (pollingTimer) {

    clearInterval(
      pollingTimer
    );

    pollingTimer =
      null;

  }


  pollingStarted =
    false;



  /* =========================================
     CLOSE PAYU WINDOW
  ========================================== */

  if (
    paymentWindow &&
    !paymentWindow.closed
  ) {

    paymentWindow.close();

  }



  /* =========================================
     REDIRECT
  ========================================== */

  window.location.href =

    CUSTOM_DOMAIN +

    "/success.html?txnid=" +

    encodeURIComponent(
      txnid
    );

}



/* =====================================================
   PAYMENT FAILED
===================================================== */

function paymentFailed(
  txnid
) {


  if (paymentFinished) {

    return;

  }


  paymentFinished =
    true;



  /* =========================================
     STOP POLLING
  ========================================== */

  if (pollingTimer) {

    clearInterval(
      pollingTimer
    );

    pollingTimer =
      null;

  }


  pollingStarted =
    false;



  /* =========================================
     CLOSE PAYU WINDOW
  ========================================== */

  if (
    paymentWindow &&
    !paymentWindow.closed
  ) {

    paymentWindow.close();

  }



  /* =========================================
     REDIRECT FAILED PAGE
  ========================================== */

  window.location.href =

    CUSTOM_DOMAIN +

    "/failed.html?txnid=" +

    encodeURIComponent(
      txnid
    );

}



/* =====================================================
   LOAD BOOK WHEN PAGE OPENS
===================================================== */

loadBook();

</script>


</body>
</html>
