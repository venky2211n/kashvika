<script>

/* =====================================================
   CONFIG
===================================================== */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzAkSJIKHHUt1fUE762fdrKeRArwRlrVuyn7Qyz1Nls_SC9dBANG6Fp5JK_9ZNXeH4b9g/exec";


const CUSTOM_DOMAIN =
"https://kashvika.website/Competitive";


/*
   PayU payment maximum waiting time.

   10 minutes.
*/

const PAYMENT_TIMEOUT =
10 * 60 * 1000;


/*
   Poll every 3 seconds.
*/

const POLL_INTERVAL =
3000;


/*
   Check popup every second.
*/

const POPUP_CHECK_INTERVAL =
1000;


/*
   After popup closes, allow PayU callback
   approximately 30 seconds to arrive.
*/

const POPUP_FINAL_CHECKS =
10;


/* =====================================================
   VARIABLES
===================================================== */

let currentBook = null;

let paymentWindow = null;

let pollingTimer = null;

let popupTimer = null;

let timeoutTimer = null;

let finalCheckTimer = null;

let pollingStarted = false;

let paymentStarted = false;

let paymentFinished = false;

let activeTxnid = null;

let popupWasClosed = false;

let finalChecks = 0;


/* =====================================================
   URL
===================================================== */

const urlParams =
new URLSearchParams(
  window.location.search
);

const bookId =
urlParams.get("id");


/* =====================================================
   ELEMENTS
===================================================== */

const bookImage =
document.getElementById("bookImage");

const bookTitle =
document.getElementById("bookTitle");

const bookCategory =
document.getElementById("bookCategory");

const bookDescription =
document.getElementById("bookDescription");

const bookPrice =
document.getElementById("bookPrice");

const checkoutForm =
document.getElementById("checkoutForm");

const payButton =
document.getElementById("payButton");

const message =
document.getElementById("message");

const loadingOverlay =
document.getElementById("loadingOverlay");

const loadingTitle =
document.getElementById("loadingTitle");

const loadingSubtitle =
document.getElementById("loadingSubtitle");


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  type = ""
) {

  message.textContent =
    text;

  message.className =
    type;

}


/* =====================================================
   SHOW LOADING
===================================================== */

function showLoading(
  title,
  subtitle
) {

  loadingTitle.textContent =
    title || "Please wait...";

  loadingSubtitle.textContent =
    subtitle || "";

  loadingOverlay.style.display =
    "flex";

}


/* =====================================================
   HIDE LOADING
===================================================== */

function hideLoading() {

  loadingOverlay.style.display =
    "none";

}


/* =====================================================
   JSONP
===================================================== */

function callAppsScript(
  params,
  callback
) {

  const callbackName =
    "jsonp_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  params.callback =
    callbackName;


  const script =
    document.createElement("script");


  const query =
    new URLSearchParams(
      params
    ).toString();


  let completed = false;


  function cleanup() {

    if (completed) {
      return;
    }

    completed = true;


    try {

      delete window[
        callbackName
      ];

    } catch (e) {
    }


    if (script.parentNode) {

      script.parentNode
        .removeChild(script);

    }

  }


  window[callbackName] =
    function(data) {

      cleanup();

      callback(data);

    };


  script.onerror =
    function() {

      cleanup();

      callback({
        success: false,
        error:
          "Unable to connect to Apps Script."
      });

    };


  script.src =
    APPS_SCRIPT_URL +
    "?" +
    query;


  document.body.appendChild(
    script
  );

}


/* =====================================================
   LOAD BOOK
===================================================== */

function loadBook() {

  if (!bookId) {

    bookTitle.textContent =
      "Book ID missing";

    payButton.disabled =
      true;

    payButton.textContent =
      "Book Not Found";

    showMessage(
      "Book ID is missing.",
      "error"
    );

    return;
  }


  showMessage(
    "Loading book...",
    "loading-text"
  );


  callAppsScript(
    {
      options:
        "book-data",

      id:
        bookId

    },

    function(result) {

      console.log(
        "BOOK RESPONSE:",
        result
      );


      if (
        !result ||
        !result.success ||
        !result.book
      ) {

        bookTitle.textContent =
          "Book not found";

        payButton.disabled =
          true;

        payButton.textContent =
          "Unable to Continue";


        showMessage(
          result?.error ||
          "Unable to load book.",
          "error"
        );

        return;
      }


      currentBook =
        result.book;


      bookTitle.textContent =
        currentBook.title ||
        "eBook";


      bookCategory.textContent =
        currentBook.category ||
        "eBook";


      bookDescription.textContent =
        currentBook.description ||
        "";


      const amount =
        Number(
          currentBook.price || 0
        );


      bookPrice.textContent =
        "₹" +
        amount.toFixed(2);


      if (
        currentBook.imageUrl
      ) {

        bookImage.src =
          currentBook.imageUrl;

      }


      /*
         ENABLE BUTTON
      */

      payButton.disabled =
        false;


      payButton.textContent =
        "Proceed to Pay ₹" +
        amount.toFixed(2);


      showMessage("");

    }
  );

}


/* =====================================================
   FORM
===================================================== */

checkoutForm.addEventListener(
  "submit",
  function(event) {

    event.preventDefault();

    startPayment();

  }
);


/* =====================================================
   START PAYMENT
===================================================== */

function startPayment() {

  if (paymentStarted) {
    return;
  }


  if (!currentBook) {

    showMessage(
      "Book is still loading.",
      "error"
    );

    return;
  }


  const name =
    document
      .getElementById("name")
      .value
      .trim();


  const email =
    document
      .getElementById("email")
      .value
      .trim();


  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  if (!name ||
      !email ||
      !phone) {

    showMessage(
      "Please enter all customer details.",
      "error"
    );

    return;
  }


  paymentStarted =
    true;

  paymentFinished =
    false;

  popupWasClosed =
    false;


  payButton.disabled =
    true;

  payButton.textContent =
    "Preparing Payment...";


  showMessage(
    "Preparing payment...",
    "loading-text"
  );


  /*
     OPEN POPUP IMMEDIATELY.

     Must happen directly from the
     submit/click event.
  */

  paymentWindow =
    window.open(
      "",
      "PayUPaymentWindow",
      "width=520,height=760,left=200,top=50,scrollbars=yes,resizable=yes"
    );


  if (!paymentWindow) {

    resetPayment();

    showMessage(
      "Popup blocked. Please allow popups for this website.",
      "error"
    );

    return;
  }


  /*
     Temporary popup loading page.
  */

  try {

    paymentWindow.document.open();

    paymentWindow.document.write(`
      <!DOCTYPE html>

      <html>

      <head>

        <title>PayU Payment</title>

        <style>

          body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
          }

          .spinner {
            width: 45px;
            height: 45px;

            border: 5px solid #ddd;
            border-top-color: #198754;

            border-radius: 50%;

            animation: spin .8s linear infinite;

            margin: 0 auto 20px;
          }

          @keyframes spin {
            to {
              transform: rotate(360deg);
            }
          }

        </style>

      </head>

      <body>

        <div class="spinner"></div>

        <h2>Preparing Payment...</h2>

        <p>Please wait...</p>

      </body>

      </html>
    `);

    paymentWindow.document.close();

  } catch (e) {

    console.log(e);

  }


  /*
     Monitor popup.
  */

  startPopupMonitor();


  /*
     CREATE PAYMENT.
  */

  callAppsScript(
    {
      options:
        "create-payment",

      id:
        currentBook.bookId,

      name:
        name,

      email:
        email,

      phone:
        phone

    },

    function(result) {

      console.log(
        "CREATE PAYMENT RESPONSE:",
        result
      );


      if (
        !result ||
        !result.success
      ) {

        closePaymentWindow();

        resetPayment();

        showMessage(
          result?.error ||
          "Unable to create payment.",
          "error"
        );

        return;
      }


      if (
        !result.txnid ||
        !result.paymentUrl ||
        !result.paymentData
      ) {

        closePaymentWindow();

        resetPayment();

        showMessage(
          "Invalid payment response.",
          "error"
        );

        return;
      }


      activeTxnid =
        result.txnid;


      /*
         Submit PayU.
      */

      submitPayU(
        result.paymentUrl,
        result.paymentData
      );


      /*
         Start polling.
      */

      startPolling(
        result.txnid
      );


      /*
         Start timeout.
      */

      startPaymentTimeout();

    }
  );

}


/* =====================================================
   SUBMIT PAYU
===================================================== */

function submitPayU(
  paymentUrl,
  paymentData
) {

  if (
    !paymentWindow ||
    paymentWindow.closed
  ) {

    handlePopupClosed();

    return;
  }


  try {

    const form =
      paymentWindow.document
        .createElement("form");


    form.method =
      "POST";


    form.action =
      paymentUrl;


    form.style.display =
      "none";


    Object.keys(
      paymentData || {}
    ).forEach(
      function(key) {

        const input =
          paymentWindow.document
            .createElement("input");


        input.type =
          "hidden";


        input.name =
          key;


        input.value =
          paymentData[key];


        form.appendChild(
          input
        );

      }
    );


    paymentWindow.document.body
      .appendChild(form);


    form.submit();


  } catch (error) {

    console.error(
      "PayU submit error:",
      error
    );


    closePaymentWindow();

    resetPayment();


    showMessage(
      "Unable to open PayU payment page.",
      "error"
    );

  }

}


/* =====================================================
   POPUP MONITOR
===================================================== */

function startPopupMonitor() {

  stopPopupMonitor();


  popupTimer =
    setInterval(
      function() {

        if (paymentFinished) {

          stopPopupMonitor();

          return;
        }


        if (
          paymentWindow &&
          paymentWindow.closed
        ) {

          console.log(
            "PayU popup closed"
          );


          stopPopupMonitor();


          handlePopupClosed();

        }

      },
      POPUP_CHECK_INTERVAL
    );

}


/* =====================================================
   POPUP CLOSED
===================================================== */

function handlePopupClosed() {

  if (paymentFinished) {
    return;
  }


  if (popupWasClosed) {
    return;
  }


  popupWasClosed =
    true;


  showMessage(
    "Payment window closed. Checking payment status...",
    "loading-text"
  );


  /*
     DO NOT immediately mark FAILED.

     PayU callback may still be arriving.
  */

  finalChecks = 0;


  runFinalChecks();

}


/* =====================================================
   FINAL CHECK AFTER POPUP CLOSE
===================================================== */

function runFinalChecks() {

  if (paymentFinished) {
    return;
  }


  if (!activeTxnid) {

    finishPopupClosed();

    return;
  }


  finalChecks++;


  checkPaymentStatus(
    activeTxnid
  );


  if (
    finalChecks <
    POPUP_FINAL_CHECKS
  ) {

    finalCheckTimer =
      setTimeout(
        runFinalChecks,
        3000
      );

  } else {

    finalCheckTimer =
      null;


    if (!paymentFinished) {

      finishPopupClosed();

    }

  }

}


/* =====================================================
   POPUP CLOSED FINAL RESULT
===================================================== */

function finishPopupClosed() {

  stopPaymentProcess();


  hideLoading();


  showMessage(
    "Payment window was closed before payment was confirmed.",
    "error"
  );


  setTimeout(
    function() {

      window.location.href =
        CUSTOM_DOMAIN +
        "/failed.html?reason=popup_closed";

    },
    1200
  );

}


/* =====================================================
   POLLING
===================================================== */

function startPolling(
  txnid
) {

  stopPolling();


  activeTxnid =
    txnid;


  pollingStarted =
    true;


  showLoading(
    "Waiting for Payment",
    "Please complete the payment in the PayU window."
  );


  /*
     Immediate check.
  */

  checkPaymentStatus(
    txnid
  );


  /*
     Every 3 seconds.
  */

  pollingTimer =
    setInterval(
      function() {

        if (paymentFinished) {
          return;
        }


        checkPaymentStatus(
          txnid
        );

      },
      POLL_INTERVAL
    );

}


/* =====================================================
   CHECK STATUS
===================================================== */

function checkPaymentStatus(
  txnid
) {

  callAppsScript(
    {
      options:
        "payment-status",

      txnid:
        txnid

    },

    function(result) {

      console.log(
        "PAYMENT STATUS:",
        result
      );


      if (
        !result ||
        !result.success
      ) {

        return;
      }


      const order =
        result.order;


      if (!order) {
        return;
      }


      const status =
        String(
          order.status || ""
        ).toUpperCase();


      console.log(
        "TXNID:",
        txnid,
        "STATUS:",
        status
      );


      /*
         SUCCESS
      */

      if (
        status === "SUCCESS"
      ) {

        paymentSuccess(
          txnid
        );

        return;
      }


      /*
         FAILED
      */

      if (
        status === "FAILED"
      ) {

        paymentFailed(
          txnid
        );

        return;
      }


      /*
         PENDING
      */

      showMessage(
        popupWasClosed
          ? "Checking payment status..."
          : "Payment processing...",
        "loading-text"
      );

    }
  );

}


/* =====================================================
   SUCCESS
===================================================== */

function paymentSuccess(
  txnid
) {

  if (paymentFinished) {
    return;
  }


  paymentFinished =
    true;


  console.log(
    "PAYMENT SUCCESS",
    txnid
  );


  stopPaymentProcess();


  showLoading(
    "Payment Successful",
    "Closing PayU and opening your download page..."
  );


  /*
     CLOSE PAYU POPUP
  */

  closePaymentWindow();


  /*
     Redirect parent checkout page.
  */

  setTimeout(
    function() {

      window.location.href =
        CUSTOM_DOMAIN +
        "/success.html?txnid=" +
        encodeURIComponent(
          txnid
        );

    },
    1000
  );

}


/* =====================================================
   FAILED
===================================================== */

function paymentFailed(
  txnid
) {

  if (paymentFinished) {
    return;
  }


  paymentFinished =
    true;


  console.log(
    "PAYMENT FAILED",
    txnid
  );


  stopPaymentProcess();


  showLoading(
    "Payment Failed",
    "Closing PayU payment window..."
  );


  /*
     CLOSE POPUP
  */

  closePaymentWindow();


  /*
     Redirect.
  */

  setTimeout(
    function() {

      window.location.href =
        CUSTOM_DOMAIN +
        "/failed.html?txnid=" +
        encodeURIComponent(
          txnid
        );

    },
    1000
  );

}


/* =====================================================
   PAYMENT TIMEOUT
===================================================== */

function startPaymentTimeout() {

  stopPaymentTimeout();


  timeoutTimer =
    setTimeout(
      function() {

        if (paymentFinished) {
          return;
        }


        console.log(
          "PAYMENT TIMEOUT"
        );


        showLoading(
          "Payment Verification Timeout",
          "Checking the final payment status..."
        );


        /*
           Stop normal polling.
        */

        stopPolling();


        /*
           Close PayU popup.
        */

        closePaymentWindow();


        /*
           One final server check.
        */

        if (activeTxnid) {

          checkPaymentStatus(
            activeTxnid
          );

        }


        /*
           Wait 3 seconds for final response.
        */

        setTimeout(
          function() {

            if (paymentFinished) {
              return;
            }


            paymentFinished =
              true;


            stopPaymentProcess();


            hideLoading();


            showMessage(
              "Payment could not be verified within the allowed time.",
              "error"
            );


            setTimeout(
              function() {

                window.location.href =
                  CUSTOM_DOMAIN +
                  "/failed.html?reason=timeout";

              },
              1000
            );

          },
          3000
        );

      },
      PAYMENT_TIMEOUT
    );

}


/* =====================================================
   STOP TIMEOUT
===================================================== */

function stopPaymentTimeout() {

  if (timeoutTimer) {

    clearTimeout(
      timeoutTimer
    );

  }


  timeoutTimer =
    null;

}


/* =====================================================
   STOP POLLING
===================================================== */

function stopPolling() {

  if (pollingTimer) {

    clearInterval(
      pollingTimer
    );

  }


  pollingTimer =
    null;


  pollingStarted =
    false;

}


/* =====================================================
   STOP POPUP MONITOR
===================================================== */

function stopPopupMonitor() {

  if (popupTimer) {

    clearInterval(
      popupTimer
    );

  }


  popupTimer =
    null;

}


/* =====================================================
   STOP FINAL CHECK
===================================================== */

function stopFinalChecks() {

  if (finalCheckTimer) {

    clearTimeout(
      finalCheckTimer
    );

  }


  finalCheckTimer =
    null;

}


/* =====================================================
   STOP EVERYTHING
===================================================== */

function stopPaymentProcess() {

  stopPolling();

  stopPopupMonitor();

  stopPaymentTimeout();

  stopFinalChecks();

}


/* =====================================================
   CLOSE POPUP
===================================================== */

function closePaymentWindow() {

  stopPopupMonitor();


  if (
    paymentWindow &&
    !paymentWindow.closed
  ) {

    try {

      paymentWindow.close();

    } catch (e) {

      console.log(
        "Popup close error:",
        e
      );

    }

  }


  paymentWindow =
    null;

}


/* =====================================================
   RESET PAYMENT
===================================================== */

function resetPayment() {

  stopPaymentProcess();


  paymentStarted =
    false;

  paymentFinished =
    false;

  activeTxnid =
    null;

  popupWasClosed =
    false;


  hideLoading();


  if (currentBook) {

    const amount =
      Number(
        currentBook.price || 0
      );


    payButton.disabled =
      false;


    payButton.textContent =
      "Proceed to Pay ₹" +
      amount.toFixed(2);

  } else {

    payButton.disabled =
      true;

    payButton.textContent =
      "Loading...";

  }

}


/* =====================================================
   PAGE LOAD
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    console.log(
      "Checkout loaded"
    );


    console.log(
      "Book ID:",
      bookId
    );


    loadBook();

  }
);


/* =====================================================
   PAGE CLOSE
===================================================== */

window.addEventListener(
  "beforeunload",
  function() {

    stopPaymentProcess();

  }
);

</script>

</body>
</html>
