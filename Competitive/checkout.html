```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Checkout</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #222;
}

.container {
  max-width: 800px;
  margin: 40px auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 14px;
  box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

h1 {
  text-align: center;
  margin-bottom: 25px;
}

#bookInfo {
  margin-bottom: 25px;
}

.book-info {
  display: flex;
  gap: 20px;
  align-items: center;
  padding: 20px;
  background: #f8f9fc;
  border-radius: 10px;
}

.book-info img {
  width: 120px;
  height: 160px;
  object-fit: cover;
  border-radius: 8px;
}

.book-info h2 {
  margin: 0 0 10px;
}

.price {
  font-size: 24px;
  font-weight: bold;
  margin: 10px 0;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 6px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 16px;
}

button {
  width: 100%;
  margin-top: 25px;
  padding: 15px;
  border: 0;
  border-radius: 8px;
  background: #0b63ce;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

#message {
  text-align: center;
  margin-top: 15px;
  color: #555;
}

.error {
  color: #c62828;
}

</style>

</head>


<body>

<div class="container">

  <div class="card">

    <h1>Checkout</h1>

    <div id="bookInfo">
      Loading book...
    </div>


    <form id="checkoutForm">

      <label for="name">
        Full Name
      </label>

      <input
        type="text"
        id="name"
        required
        autocomplete="name"
        placeholder="Enter your name"
      >


      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        required
        autocomplete="email"
        placeholder="Enter your email"
      >


      <label for="phone">
        Phone Number
      </label>

      <input
        type="tel"
        id="phone"
        required
        autocomplete="tel"
        placeholder="Enter phone number"
      >


      <button
        type="submit"
        id="payButton"
      >
        Proceed to Pay
      </button>

    </form>


    <div id="message"></div>

  </div>

</div>


<script>

// ============================================
// CONFIG
// ============================================

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyUfPEqa_av-Rz7VqI3Q7f9B8yt26IfKOAXTDhzRdPZMeMVsbZYx091UX7mbuaKZqf1Dw/exec";


// ============================================
// GET BOOK ID
// ============================================

const params =
  new URLSearchParams(
    window.location.search
  );

const bookId =
  params.get("id");


if (!bookId) {

  document.getElementById("bookInfo")
    .innerHTML =
      '<p class="error">Book ID is missing.</p>';

  document.getElementById("payButton")
    .disabled = true;

}


// ============================================
// LOAD BOOK USING JSONP
// ============================================

function loadBook() {

  if (!bookId) return;

  const callbackName =
    "bookCallback_" + Date.now();


  window[callbackName] =
    function(response) {

      try {

        if (!response || !response.success) {

          throw new Error(
            response?.message ||
            "Book not found"
          );

        }


        const book =
          response.book;


        document.getElementById("bookInfo")
          .innerHTML = `

          <div class="book-info">

            <img
              src="${escapeHtml(book.imageUrl)}"
              alt="${escapeHtml(book.title)}"
            >

            <div>

              <h2>
                ${escapeHtml(book.title)}
              </h2>

              <div class="price">
                ₹${Number(book.price).toFixed(2)}
              </div>

              <p>
                ${escapeHtml(book.category || "")}
              </p>

            </div>

          </div>

        `;


      } catch (error) {

        document.getElementById("bookInfo")
          .innerHTML =
            '<p class="error">' +
            escapeHtml(error.message) +
            '</p>';

        document.getElementById("payButton")
          .disabled = true;

      }


      delete window[callbackName];


      const oldScript =
        document.getElementById(callbackName);

      if (oldScript) {
        oldScript.remove();
      }

    };


  const script =
    document.createElement("script");


  script.id =
    callbackName;


  script.src =
    APPS_SCRIPT_URL +
    "?action=book" +
    "&id=" +
    encodeURIComponent(bookId) +
    "&callback=" +
    encodeURIComponent(callbackName);


  document.body.appendChild(script);

}


loadBook();


// ============================================
// CHECKOUT SUBMIT
// ============================================

document
  .getElementById("checkoutForm")
  .addEventListener(
    "submit",
    function(e) {

      e.preventDefault();


      const name =
        document
          .getElementById("name")
          .value
          .trim();


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const phone =
        document
          .getElementById("phone")
          .value
          .trim();


      if (!name) {

        alert("Please enter your name.");
        return;

      }


      if (!email) {

        alert("Please enter your email.");
        return;

      }


      if (!phone) {

        alert("Please enter your phone number.");
        return;

      }


      if (!bookId) {

        alert("Book ID is missing.");
        return;

      }


      const button =
        document.getElementById("payButton");


      const message =
        document.getElementById("message");


      button.disabled = true;

      button.innerText =
        "Opening Payment...";


      message.innerText =
        "Please wait...";


      // ========================================
      // OPEN PAY.HTML
      // ========================================
      //
      // Example:
      //
      // https://kashvika.website/Competitive/pay.html?id=102
      //
      // Customer information is passed to pay.html.
      //
      // ========================================

      const payUrl =
        "pay.html" +
        "?id=" +
        encodeURIComponent(bookId) +
        "&name=" +
        encodeURIComponent(name) +
        "&email=" +
        encodeURIComponent(email) +
        "&phone=" +
        encodeURIComponent(phone);


      window.location.href =
        payUrl;

    }
  );


// ============================================
// ESCAPE HTML
// ============================================

function escapeHtml(value) {

  return String(value || "")

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
