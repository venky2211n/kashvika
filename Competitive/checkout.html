<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Checkout</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    Arial,
    sans-serif;

  background:
    #f5f7fb;

  color:
    #222;

}

.container {

  max-width:
    600px;

  margin:
    50px auto;

  padding:
    25px;

  background:
    white;

  border-radius:
    15px;

  box-shadow:
    0 10px 35px
    rgba(0,0,0,.08);

}

h1 {

  margin-top:
    0;

}

.book {

  padding:
    15px;

  margin-bottom:
    20px;

  background:
    #f7f8fa;

  border-radius:
    10px;

}

.book-title {

  font-size:
    20px;

  font-weight:
    bold;

}

.price {

  margin-top:
    8px;

  font-size:
    24px;

  font-weight:
    bold;

}

label {

  display:
    block;

  margin-top:
    15px;

  margin-bottom:
    6px;

  font-weight:
    bold;

}

input {

  width:
    100%;

  padding:
    13px;

  border:
    1px solid #ddd;

  border-radius:
    8px;

  font-size:
    15px;

}

button {

  width:
    100%;

  margin-top:
    22px;

  padding:
    14px;

  border:
    0;

  border-radius:
    8px;

  background:
    #1463ff;

  color:
    white;

  font-size:
    16px;

  cursor:
    pointer;

}

button:disabled {

  opacity:
    .6;

  cursor:
    not-allowed;

}

#message {

  margin-top:
    15px;

  text-align:
    center;

}

</style>

</head>

<body>


<div class="container">

<h1>
Checkout
</h1>


<div
  id="bookInfo"
  class="book"
>
Loading book...
</div>


<form
  id="checkoutForm"
>


<label>
Name
</label>

<input
  id="name"
  required
  autocomplete="name"
>


<label>
Email
</label>

<input
  id="email"
  type="email"
  required
  autocomplete="email"
>


<label>
Phone
</label>

<input
  id="phone"
  type="tel"
  required
  autocomplete="tel"
>


<!-- <button
  id="payButton"
  type="submit"
>
Proceed to Pay
</button> -->

  <button
  type="button"
  onclick="startPayment()">
  Proceed to Pay
</button>


</form>


<div
  id="message"
></div>


</div>


<script>

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzAkSJIKHHUt1fUE762fdrKeRArwRlrVuyn7Qyz1Nls_SC9dBANG6Fp5JK_9ZNXeH4b9g/exec";


const CUSTOM_DOMAIN =
  "https://kashvika.website/Competitive";


let paymentWindow = null;

let pollingTimer = null;

let pollingStarted = false;


/****************************************************
 * JSONP
 ****************************************************/

function callAppsScript(params, callback) {

  const callbackName =
    "jsonp_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  params.callback =
    callbackName;


  const script =
    document.createElement("script");


  const query =
    new URLSearchParams(
      params
    ).toString();


  window[callbackName] =
    function(data) {

      try {

        callback(data);

      } finally {

        delete window[callbackName];

        script.remove();

      }

    };


  script.src =
    APPS_SCRIPT_URL +
    "?" +
    query;


  script.onerror =
    function() {

      delete window[callbackName];

      script.remove();

      callback({

        success: false,

        error:
          "Failed to connect to payment server"

      });

    };


  document
    .body
    .appendChild(script);

}


/****************************************************
 * START PAYMENT
 ****************************************************/

function startPayment() {

  const bookId =
    new URLSearchParams(
      window.location.search
    ).get("id");


  const name =
    document
      .getElementById("name")
      .value
      .trim();


  const email =
    document
      .getElementById("email")
      .value
      .trim();


  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  if (!name || !email || !phone) {

    alert(
      "Please enter name, email and phone."
    );

    return;

  }


  /*
   * IMPORTANT
   *
   * Open popup immediately from
   * the user's click.
   */
  paymentWindow =
    window.open(
      "",
      "PayUPaymentWindow",
      "width=520,height=760,scrollbars=yes,resizable=yes"
    );


  if (!paymentWindow) {

    alert(
      "Please allow popups for this website."
    );

    return;

  }


  paymentWindow.document.open();

  paymentWindow.document.write(
    "<html>" +
    "<body style='font-family:Arial;text-align:center;padding:40px'>" +
    "<h2>Preparing payment...</h2>" +
    "<p>Please wait...</p>" +
    "</body>" +
    "</html>"
  );

  paymentWindow.document.close();


  /*
   * Ask Apps Script to create payment
   */
  callAppsScript({

    options:
      "create-payment",

    id:
      bookId,

    name:
      name,

    email:
      email,

    phone:
      phone

  }, function(result) {


    if (!result.success) {

      if (
        paymentWindow &&
        !paymentWindow.closed
      ) {

        paymentWindow.close();

      }


      alert(
        result.error ||
        "Unable to create payment."
      );

      return;

    }


    /*
     * POST paymentData to PayU
     */
    submitToPayU(
      result.paymentUrl,
      result.paymentData
    );


    /*
     * START POLLING
     */
    startPaymentPolling(
      result.txnid
    );

  });

}


/****************************************************
 * POST TO PAYU
 ****************************************************/

function submitToPayU(
  paymentUrl,
  paymentData
) {

  if (
    !paymentWindow ||
    paymentWindow.closed
  ) {

    return;

  }


  const form =
    paymentWindow.document
      .createElement("form");


  form.method =
    "POST";


  form.action =
    paymentUrl;


  form.style.display =
    "none";


  Object.keys(
    paymentData
  ).forEach(function(key) {

    const input =
      paymentWindow.document
        .createElement("input");


    input.type =
      "hidden";


    input.name =
      key;


    input.value =
      paymentData[key];


    form.appendChild(
      input
    );

  });


  paymentWindow.document
    .body
    .appendChild(form);


  form.submit();

}


/****************************************************
 * POLLING
 ****************************************************/

function startPaymentPolling(
  txnid
) {

  if (pollingStarted) {

    return;

  }


  pollingStarted =
    true;


  let attempts = 0;


  /*
   * Check every 3 seconds
   */
  pollingTimer =
    setInterval(function() {

      attempts++;


      checkPaymentStatus(
        txnid
      );


      /*
       * Stop after 10 minutes
       *
       * 10 min / 3 sec
       * = 200 attempts
       */
      if (attempts >= 200) {

        clearInterval(
          pollingTimer
        );


        pollingTimer =
          null;


        pollingStarted =
          false;

      }

    }, 3000);


  /*
   * Check immediately
   */
  checkPaymentStatus(
    txnid
  );

}


/****************************************************
 * CHECK PAYMENT STATUS
 ****************************************************/

function checkPaymentStatus(
  txnid
) {

  callAppsScript({

    options:
      "payment-status",

    txnid:
      txnid

  }, function(result) {


    if (!result.success) {

      return;

    }


    const order =
      result.order;


    if (!order) {

      return;

    }


    /*
     * PAYMENT SUCCESS
     */
    if (
      String(
        order.status || ""
      ).toUpperCase() ===
      "SUCCESS"
    ) {

      paymentCompleted(
        txnid
      );

      return;

    }


    /*
     * PAYMENT FAILED
     */
    if (
      String(
        order.status || ""
      ).toUpperCase() ===
      "FAILED"
    ) {

      paymentFailed(
        txnid
      );

      return;

    }


    /*
     * PENDING
     *
     * Continue polling.
     */

  });

}


/****************************************************
 * PAYMENT SUCCESS
 ****************************************************/

function paymentCompleted(
  txnid
) {

  if (pollingTimer) {

    clearInterval(
      pollingTimer
    );

    pollingTimer =
      null;

  }


  pollingStarted =
    false;


  /*
   * CLOSE PAYU POPUP
   */
  if (
    paymentWindow &&
    !paymentWindow.closed
  ) {

    paymentWindow.close();

  }


  /*
   * OPEN CUSTOM DOMAIN SUCCESS PAGE
   */
  window.location.href =
    CUSTOM_DOMAIN +
    "/success.html?txnid=" +
    encodeURIComponent(
      txnid
    );

}


/****************************************************
 * PAYMENT FAILED
 ****************************************************/

function paymentFailed(
  txnid
) {

  if (pollingTimer) {

    clearInterval(
      pollingTimer
    );

    pollingTimer =
      null;

  }


  pollingStarted =
    false;


  /*
   * CLOSE PAYU POPUP
   */
  if (
    paymentWindow &&
    !paymentWindow.closed
  ) {

    paymentWindow.close();

  }


  /*
   * CUSTOM DOMAIN FAILED PAGE
   */
  window.location.href =
    CUSTOM_DOMAIN +
    "/failed.html?txnid=" +
    encodeURIComponent(
      txnid
    );

}

</script>
</body>

</html>
