```html
<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0"
  >

  <title>
    Checkout
  </title>


  <style>

    body {

      margin: 0;

      font-family:
        Arial,
        sans-serif;

      background:
        #f5f5f5;
    }


    .container {

      max-width:
        800px;

      margin:
        40px auto;

      padding:
        20px;
    }


    .card {

      background:
        white;

      padding:
        30px;

      border-radius:
        16px;

      box-shadow:
        0 10px 30px
        rgba(0,0,0,.08);
    }


    .book {

      display:
        flex;

      gap:
        20px;

      margin-bottom:
        30px;
    }


    .book img {

      width:
        120px;

      height:
        160px;

      object-fit:
        cover;

      border-radius:
        8px;
    }


    .price {

      font-size:
        24px;

      font-weight:
        bold;
    }


    .field {

      margin-bottom:
        18px;
    }


    label {

      display:
        block;

      margin-bottom:
        7px;

      font-weight:
        bold;
    }


    input {

      width:
        100%;

      padding:
        13px;

      border:
        1px solid #ccc;

      border-radius:
        8px;

      font-size:
        16px;
    }


    button {

      width:
        100%;

      padding:
        15px;

      border:
        0;

      border-radius:
        8px;

      background:
        #111;

      color:
        white;

      font-size:
        17px;

      font-weight:
        bold;

      cursor:
        pointer;
    }

  </style>

</head>


<body>


<div class="container">


<div class="card">


<div id="bookInfo">
  Loading book...
</div>


<form id="checkoutForm">


<div class="field">

<label>
  Full Name
</label>

<input
  id="name"
  type="text"
  required
  placeholder="Full name"
>

</div>


<div class="field">

<label>
  Email
</label>

<input
  id="email"
  type="email"
  required
  placeholder="Email address"
>

</div>


<div class="field">

<label>
  Phone
</label>

<input
  id="phone"
  type="tel"
  required
  placeholder="Phone number"
>

</div>


<button
  id="payButton"
  type="submit"
  disabled
>
  Proceed to Pay
</button>


</form>


</div>

</div>


<script>


const APPS_SCRIPT_URL =

  "https://script.google.com/macros/s/AKfycbxVFNWOBmK7fW_TRczOwQlMqkUot_LzjxcRidM-QhQhZWrgIgHgB1ymrIXIE1P0g5kLoA/exec";


const params =
  new URLSearchParams(
    window.location.search
  );


const BOOK_ID =
  params.get("id");


const bookInfo =
  document.getElementById(
    "bookInfo"
  );


const payButton =
  document.getElementById(
    "payButton"
  );


function escapeHtml(value) {

  return String(
    value == null
      ? ""
      : value
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );
}


/*
 * Load book.
 */
function loadBook() {

  if (!BOOK_ID) {

    bookInfo.innerHTML =
      "<p>Book ID missing.</p>";

    return;
  }


  const callbackName =
    "bookCallback_" +
    Date.now();


  window[callbackName] =
    function(response) {

      if (
        !response ||
        !response.success ||
        !response.book
      ) {

        bookInfo.innerHTML =
          "<p>Book not found.</p>";

        return;
      }


      const book =
        response.book;


      bookInfo.innerHTML = `

        <div class="book">

          <img
            src="${escapeHtml(
              book.imageUrl
            )}"
            alt="${escapeHtml(
              book.title
            )}"
          >

          <div>

            <h2>
              ${escapeHtml(
                book.title
              )}
            </h2>

            <div class="price">
              ₹${Number(
                book.price
              ).toFixed(2)}
            </div>

            <p>
              ${escapeHtml(
                book.category || ""
              )}
            </p>

          </div>

        </div>

      `;


      payButton.disabled =
        false;


      delete window[
        callbackName
      ];
    };


  const script =
    document.createElement(
      "script"
    );


  script.src =

    APPS_SCRIPT_URL +

    "?options=book" +

    "&id=" +

    encodeURIComponent(
      BOOK_ID
    ) +

    "&callback=" +

    encodeURIComponent(
      callbackName
    );


  document.body.appendChild(
    script
  );
}


loadBook();


/*
 * Proceed to Pay
 */
document
  .getElementById(
    "checkoutForm"
  )
  .addEventListener(
    "submit",
    function(e) {

      e.preventDefault();


      const name =
        document.getElementById(
          "name"
        ).value.trim();


      const email =
        document.getElementById(
          "email"
        ).value.trim();


      const phone =
        document.getElementById(
          "phone"
        ).value.trim();


      if (
        !name ||
        !email ||
        !phone
      ) {

        alert(
          "Please complete all fields."
        );

        return;
      }


      payButton.disabled =
        true;


      payButton.textContent =
        "Preparing Payment...";


      /*
       * IMPORTANT:
       *
       * This is the CUSTOM DOMAIN URL.
       */
      const payUrl =

        "pay.html" +

        "?id=" +

        encodeURIComponent(
          BOOK_ID
        ) +

        "&name=" +

        encodeURIComponent(
          name
        ) +

        "&email=" +

        encodeURIComponent(
          email
        ) +

        "&phone=" +

        encodeURIComponent(
          phone
        );


      window.location.href =
        payUrl;

    }
  );

</script>


</body>

</html>
```
