<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Checkout - eBook Store</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .checkout-box {
      background: #fff;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .book-section {
      display: flex;
      gap: 25px;
      padding-bottom: 25px;
      border-bottom: 1px solid #ddd;
      margin-bottom: 25px;
    }

    .book-image {
      width: 180px;
      height: 240px;
      object-fit: cover;
      border-radius: 8px;
      background: #eee;
    }

    .book-info {
      flex: 1;
    }

    .book-title {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .book-description {
      color: #666;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .category {
      display: inline-block;
      background: #eef2ff;
      color: #3949ab;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .price {
      font-size: 25px;
      font-weight: bold;
      color: #198754;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #3949ab;
    }

    #payButton {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #198754;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    #payButton:hover:not(:disabled) {
      background: #157347;
    }

    #payButton:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #message {
      text-align: center;
      margin-top: 20px;
      padding: 10px;
      min-height: 20px;
    }

    .loading {
      color: #555;
    }

    .error {
      color: #dc3545;
    }

    .success {
      color: #198754;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      text-decoration: none;
      color: #3949ab;
    }

    @media (max-width: 650px) {

      .container {
        margin: 15px auto;
        padding: 10px;
      }

      .checkout-box {
        padding: 20px;
      }

      .book-section {
        flex-direction: column;
      }

      .book-image {
        width: 150px;
        height: 200px;
        margin: auto;
      }

      .book-info {
        text-align: center;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="checkout-box">

    <h1>Checkout</h1>

    <!-- BOOK DETAILS -->

    <div class="book-section">

      <img
        id="bookImage"
        class="book-image"
        src=""
        alt="Book">

      <div class="book-info">

        <div id="bookTitle" class="book-title">
          Loading book...
        </div>

        <div id="bookCategory" class="category">
          Loading...
        </div>

        <div id="bookDescription" class="book-description">
          Please wait...
        </div>

        <div id="bookPrice" class="price">
          ₹
        </div>

      </div>

    </div>


    <!-- CUSTOMER FORM -->

    <form id="checkoutForm">

      <div class="form-group">

        <label for="name">
          Full Name
        </label>

        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your full name"
          required>

      </div>


      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          required>

      </div>


      <div class="form-group">

        <label for="phone">
          Phone Number
        </label>

        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="Enter your phone number"
          required>

      </div>


      <button
        type="submit"
        id="payButton"
        disabled>

        Loading...

      </button>

    </form>


    <div id="message"></div>


    <a
      href="./index.html"
      class="back">

      ← Back to Books

    </a>

  </div>

</div>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzAkSJIKHHUt1fUE762fdrKeRArwRlrVuyn7Qyz1Nls_SC9dBANG6Fp5JK_9ZNXeH4b9g/exec";


const CUSTOM_DOMAIN =
  "https://kashvika.website/Competitive";


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let currentBook = null;

let paymentWindow = null;

let pollingTimer = null;

let pollingStarted = false;

let paymentStarted = false;


/* =========================================================
   GET BOOK ID
========================================================= */

const urlParams =
  new URLSearchParams(window.location.search);

const bookId =
  urlParams.get("id");


/* =========================================================
   ELEMENTS
========================================================= */

const bookImage =
  document.getElementById("bookImage");

const bookTitle =
  document.getElementById("bookTitle");

const bookCategory =
  document.getElementById("bookCategory");

const bookDescription =
  document.getElementById("bookDescription");

const bookPrice =
  document.getElementById("bookPrice");

const checkoutForm =
  document.getElementById("checkoutForm");

const payButton =
  document.getElementById("payButton");

const message =
  document.getElementById("message");


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text, type) {

  message.textContent = text;

  message.className = type || "";

}


/* =========================================================
   JSONP CALL TO APPS SCRIPT
========================================================= */

function callAppsScript(params, callback) {

  const callbackName =
    "jsonp_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 100000);


  params.callback = callbackName;


  const script =
    document.createElement("script");


  const query =
    new URLSearchParams(params).toString();


  let finished = false;


  function cleanup() {

    if (finished) {
      return;
    }

    finished = true;


    try {
      delete window[callbackName];
    } catch (e) {
    }


    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

  }


  window[callbackName] =
    function(data) {

      cleanup();

      callback(data);

    };


  script.onerror =
    function() {

      cleanup();

      callback({
        success: false,
        error: "Failed to connect to Apps Script."
      });

    };


  script.src =
    APPS_SCRIPT_URL + "?" + query;


  document.body.appendChild(script);

}


/* =========================================================
   LOAD BOOK
========================================================= */

function loadBook() {

  if (!bookId) {

    bookTitle.textContent =
      "Book ID missing";

    bookDescription.textContent =
      "Please select a book again.";

    payButton.disabled = true;

    payButton.textContent =
      "Book Not Found";

    return;
  }


  showMessage(
    "Loading book details...",
    "loading"
  );


  callAppsScript(
    {
      options: "book-data",
      id: bookId
    },

    function(result) {

      console.log(
        "BOOK RESPONSE:",
        result
      );


      if (!result || !result.success) {

        bookTitle.textContent =
          "Unable to load book";

        bookDescription.textContent =
          result && result.error
            ? result.error
            : "Book not found.";

        payButton.disabled = true;

        payButton.textContent =
          "Unable to Continue";

        showMessage(
          result && result.error
            ? result.error
            : "Unable to load book.",
          "error"
        );

        return;
      }


      currentBook =
        result.book;


      bookTitle.textContent =
        currentBook.title || "eBook";


      bookCategory.textContent =
        currentBook.category || "eBook";


      bookDescription.textContent =
        currentBook.description || "";


      const amount =
        Number(currentBook.price || 0);


      bookPrice.textContent =
        "₹" + amount.toFixed(2);


      if (currentBook.imageUrl) {

        bookImage.src =
          currentBook.imageUrl;

      }


      /* ==========================================
         VERY IMPORTANT
         ENABLE PAY BUTTON
      ========================================== */

      payButton.disabled = false;

      payButton.textContent =
        "Proceed to Pay ₹" +
        amount.toFixed(2);


      showMessage(
        "",
        ""
      );

    }
  );

}


/* =========================================================
   FORM SUBMIT
========================================================= */

checkoutForm.addEventListener(
  "submit",
  function(event) {

    event.preventDefault();

    console.log(
      "PAY BUTTON CLICKED"
    );


    startPayment();

  }
);


/* =========================================================
   START PAYMENT
========================================================= */

function startPayment() {

  if (paymentStarted) {
    return;
  }


  if (!currentBook) {

    alert(
      "Book details are still loading. Please wait."
    );

    return;
  }


  const name =
    document.getElementById("name")
      .value
      .trim();


  const email =
    document.getElementById("email")
      .value
      .trim();


  const phone =
    document.getElementById("phone")
      .value
      .trim();


  if (!name) {

    alert(
      "Please enter your name."
    );

    return;
  }


  if (!email) {

    alert(
      "Please enter your email."
    );

    return;
  }


  if (!phone) {

    alert(
      "Please enter your phone number."
    );

    return;
  }


  /*
     Mark payment as started
  */

  paymentStarted = true;


  payButton.disabled = true;

  payButton.textContent =
    "Preparing Payment...";


  showMessage(
    "Preparing payment...",
    "loading"
  );


  /*
     IMPORTANT:
     Open popup INSIDE the button click.
     This prevents popup blockers.
  */

  paymentWindow =
    window.open(
      "",
      "PayUPaymentWindow",
      "width=520,height=760,scrollbars=yes,resizable=yes"
    );


  if (!paymentWindow) {

    paymentStarted = false;

    payButton.disabled = false;

    payButton.textContent =
      "Proceed to Pay ₹" +
      Number(currentBook.price).toFixed(2);


    showMessage(
      "Popup blocked. Please allow popups for this website.",
      "error"
    );

    return;
  }


  /*
     Temporary popup content
  */

  try {

    paymentWindow.document.open();

    paymentWindow.document.write(
      "<!DOCTYPE html>" +
      "<html>" +
      "<head>" +
      "<title>PayU Payment</title>" +
      "</head>" +
      "<body style='font-family:Arial;text-align:center;padding:40px'>" +
      "<h2>Preparing payment...</h2>" +
      "<p>Please wait.</p>" +
      "</body>" +
      "</html>"
    );

    paymentWindow.document.close();

  } catch (error) {

    console.error(error);

  }


  /*
     Create payment in Apps Script
  */

  callAppsScript(
    {
      options: "create-payment",

      id: currentBook.bookId,

      name: name,

      email: email,

      phone: phone

    },

    function(result) {

      console.log(
        "CREATE PAYMENT RESPONSE:",
        result
      );


      if (!result || !result.success) {

        if (
          paymentWindow &&
          !paymentWindow.closed
        ) {

          paymentWindow.close();

        }


        paymentStarted = false;

        payButton.disabled = false;

        payButton.textContent =
          "Proceed to Pay ₹" +
          Number(currentBook.price).toFixed(2);


        showMessage(
          result && result.error
            ? result.error
            : "Unable to create payment.",
          "error"
        );

        return;
      }


      /*
         Payment data received successfully
      */

      showMessage(
        "Opening PayU payment page...",
        "loading"
      );


      /*
         Submit PayU form inside popup
      */

      submitToPayU(
        result.paymentUrl,
        result.paymentData
      );


      /*
         Start checking Orders sheet
      */

      if (result.txnid) {

        startPaymentPolling(
          result.txnid
        );

      }

    }
  );

}


/* =========================================================
   SUBMIT PAYMENT TO PAYU
========================================================= */

function submitToPayU(
  paymentUrl,
  paymentData
) {

  if (
    !paymentWindow ||
    paymentWindow.closed
  ) {

    showMessage(
      "Payment window was closed.",
      "error"
    );

    paymentStarted = false;

    payButton.disabled = false;

    return;
  }


  try {

    const form =
      paymentWindow.document.createElement(
        "form"
      );


    form.method =
      "POST";


    form.action =
      paymentUrl;


    form.style.display =
      "none";


    Object.keys(paymentData || {})
      .forEach(
        function(key) {

          const input =
            paymentWindow.document.createElement(
              "input"
            );


          input.type =
            "hidden";


          input.name =
            key;


          input.value =
            paymentData[key];


          form.appendChild(
            input
          );

        }
      );


    paymentWindow.document.body.appendChild(
      form
    );


    form.submit();

  } catch (error) {

    console.error(
      "PayU submit error:",
      error
    );


    showMessage(
      "Unable to open PayU payment page.",
      "error"
    );


    paymentStarted = false;

    payButton.disabled = false;

  }

}


/* =========================================================
   START PAYMENT POLLING
========================================================= */

function startPaymentPolling(txnid) {

  if (pollingStarted) {
    return;
  }


  pollingStarted = true;


  let attempts = 0;


  pollingTimer =
    setInterval(
      function() {

        attempts++;


        checkPaymentStatus(
          txnid
        );


        /*
           200 attempts × 3 seconds
           = approximately 10 minutes
        */

        if (attempts >= 200) {

          clearInterval(
            pollingTimer
          );


          pollingTimer = null;

          pollingStarted = false;


          showMessage(
            "Payment verification timed out. Please check your payment status.",
            "error"
          );

        }

      },
      3000
    );


  /*
     Check immediately
  */

  checkPaymentStatus(
    txnid
  );

}


/* =========================================================
   CHECK PAYMENT STATUS
========================================================= */

function checkPaymentStatus(
  txnid
) {

  callAppsScript(
    {
      options: "payment-status",

      txnid: txnid

    },

    function(result) {

      console.log(
        "PAYMENT STATUS:",
        result
      );


      if (
        !result ||
        !result.success
      ) {

        return;
      }


      const order =
        result.order;


      if (!order) {
        return;
      }


      const status =
        String(
          order.status || ""
        ).toUpperCase();


      if (status === "SUCCESS") {

        paymentCompleted(
          txnid
        );

        return;
      }


      if (status === "FAILED") {

        paymentFailed(
          txnid
        );

        return;
      }


      /*
         PENDING
         Continue polling
      */

      showMessage(
        "Payment processing...",
        "loading"
      );

    }
  );

}


/* =========================================================
   PAYMENT SUCCESS
========================================================= */

function paymentCompleted(
  txnid
) {

  if (pollingTimer) {

    clearInterval(
      pollingTimer
    );

  }


  pollingTimer = null;

  pollingStarted = false;


  showMessage(
    "Payment successful. Redirecting...",
    "success"
  );


  /*
     Close PayU popup
  */

  if (
    paymentWindow &&
    !paymentWindow.closed
  ) {

    try {

      paymentWindow.close();

    } catch (e) {

    }

  }


  /*
     Redirect to custom domain
  */

  setTimeout(
    function() {

      window.location.href =
        CUSTOM_DOMAIN +
        "/success.html?txnid=" +
        encodeURIComponent(txnid);

    },
    500
  );

}


/* =========================================================
   PAYMENT FAILED
========================================================= */

function paymentFailed(
  txnid
) {

  if (pollingTimer) {

    clearInterval(
      pollingTimer
    );

  }


  pollingTimer = null;

  pollingStarted = false;


  showMessage(
    "Payment failed.",
    "error"
  );


  /*
     Close PayU popup
  */

  if (
    paymentWindow &&
    !paymentWindow.closed
  ) {

    try {

      paymentWindow.close();

    } catch (e) {

    }

  }


  /*
     Redirect to custom domain
  */

  setTimeout(
    function() {

      window.location.href =
        CUSTOM_DOMAIN +
        "/failed.html?txnid=" +
        encodeURIComponent(txnid);

    },
    700
  );

}


/* =========================================================
   PAGE LOAD
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    console.log(
      "Checkout page loaded"
    );

    console.log(
      "Book ID:",
      bookId
    );

    console.log(
      "Pay button:",
      payButton
    );


    loadBook();

  }
);

</script>

</body>
</html>
