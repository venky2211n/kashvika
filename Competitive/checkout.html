<script>

/* =====================================================
   PAYMENT CONFIG
===================================================== */

const PAYMENT_TIMEOUT_MS = 10 * 60 * 1000; // 10 minutes

const POPUP_CHECK_MS = 1000;               // check popup every 1 sec

const FINAL_STATUS_CHECKS = 10;            // 10 extra checks

const FINAL_STATUS_INTERVAL = 3000;        // every 3 sec


/* =====================================================
   PAYMENT VARIABLES
===================================================== */

let currentBook = null;

let paymentWindow = null;

let pollingTimer = null;

let popupCheckTimer = null;

let paymentTimeoutTimer = null;

let pollingStarted = false;

let paymentStarted = false;

let paymentFinished = false;

let popupClosedByUser = false;

let finalStatusChecks = 0;


/* =====================================================
   START PAYMENT
===================================================== */

function startPayment() {

  if (paymentStarted) {
    return;
  }

  if (!currentBook) {

    showMessage(
      "Book is still loading.",
      "error"
    );

    return;
  }


  const name =
    document
      .getElementById("name")
      .value
      .trim();

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  if (!name || !email || !phone) {

    showMessage(
      "Please enter all customer details.",
      "error"
    );

    return;
  }


  paymentStarted = true;

  paymentFinished = false;

  popupClosedByUser = false;

  finalStatusChecks = 0;


  payButton.disabled = true;

  payButton.textContent =
    "Preparing Payment...";


  showMessage(
    "Opening PayU payment window...",
    "loading"
  );


  /*
     OPEN POPUP IMMEDIATELY
     FROM USER CLICK
  */

  paymentWindow =
    window.open(
      "",
      "PayUPaymentWindow",
      "width=520,height=760,left=200,top=50,scrollbars=yes,resizable=yes"
    );


  if (!paymentWindow) {

    resetPaymentUI();

    showMessage(
      "Popup blocked. Please allow popups for this website.",
      "error"
    );

    return;
  }


  /*
     TEMPORARY POPUP PAGE
  */

  try {

    paymentWindow.document.open();

    paymentWindow.document.write(`
      <!DOCTYPE html>
      <html>
      <head>
        <title>PayU Payment</title>
      </head>

      <body style="
        font-family:Arial;
        text-align:center;
        padding:50px;
      ">

        <h2>Preparing Payment...</h2>

        <p>
          Please wait while we connect to PayU.
        </p>

      </body>
      </html>
    `);

    paymentWindow.document.close();

  } catch (e) {

    console.log(e);

  }


  /*
     START WATCHING POPUP
  */

  startPopupMonitor();


  /*
     CREATE PAYMENT
  */

  callAppsScript(
    {
      options: "create-payment",
      id: currentBook.bookId,
      name: name,
      email: email,
      phone: phone
    },

    function(result) {

      console.log(
        "CREATE PAYMENT:",
        result
      );


      if (
        !result ||
        !result.success
      ) {

        closePaymentWindow();

        resetPaymentUI();

        showMessage(
          result?.error ||
          "Unable to create payment.",
          "error"
        );

        return;
      }


      if (
        !result.txnid ||
        !result.paymentUrl ||
        !result.paymentData
      ) {

        closePaymentWindow();

        resetPaymentUI();

        showMessage(
          "Invalid payment response from server.",
          "error"
        );

        return;
      }


      /*
         SUBMIT PAYU FORM
      */

      submitPayU(
        result.paymentUrl,
        result.paymentData
      );


      /*
         START PAYMENT POLLING
      */

      startPolling(
        result.txnid
      );


      /*
         START HARD TIMEOUT
      */

      startPaymentTimeout(
        result.txnid
      );

    }
  );

}


/* =====================================================
   SUBMIT PAYU
===================================================== */

function submitPayU(
  paymentUrl,
  paymentData
) {

  if (
    !paymentWindow ||
    paymentWindow.closed
  ) {

    handlePopupClosed();

    return;
  }


  try {

    const form =
      paymentWindow.document
        .createElement("form");


    form.method = "POST";

    form.action = paymentUrl;

    form.style.display = "none";


    Object.keys(
      paymentData || {}
    ).forEach(
      function(key) {

        const input =
          paymentWindow.document
            .createElement("input");


        input.type = "hidden";

        input.name = key;

        input.value =
          paymentData[key];


        form.appendChild(
          input
        );

      }
    );


    paymentWindow.document.body
      .appendChild(form);


    form.submit();


  } catch (error) {

    console.error(
      "PayU submit error:",
      error
    );


    closePaymentWindow();

    resetPaymentUI();

    showMessage(
      "Unable to open PayU payment page.",
      "error"
    );

  }

}


/* =====================================================
   POPUP MONITOR
===================================================== */

function startPopupMonitor() {

  stopPopupMonitor();


  popupCheckTimer =
    setInterval(
      function() {

        /*
           Payment already finished.
        */

        if (paymentFinished) {

          stopPopupMonitor();

          return;
        }


        /*
           Popup manually closed.
        */

        if (
          paymentWindow &&
          paymentWindow.closed
        ) {

          console.log(
            "PAYU POPUP CLOSED"
          );


          stopPopupMonitor();


          handlePopupClosed();

        }

      },
      POPUP_CHECK_MS
    );

}


/* =====================================================
   STOP POPUP MONITOR
===================================================== */

function stopPopupMonitor() {

  if (popupCheckTimer) {

    clearInterval(
      popupCheckTimer
    );

  }


  popupCheckTimer = null;

}


/* =====================================================
   POPUP CLOSED
===================================================== */

function handlePopupClosed() {

  if (paymentFinished) {
    return;
  }


  popupClosedByUser = true;


  /*
     IMPORTANT:

     Do NOT immediately mark payment FAILED.

     PayU may have already received payment
     but Apps Script callback may arrive a little
     later.

     Continue checking payment status.
  */

  showMessage(
    "Payment window closed. Checking payment status...",
    "loading"
  );


  /*
     If polling has not started yet,
     there is nothing more we can safely do.
  */

  if (!pollingStarted) {

    stopPaymentProcess();


    showMessage(
      "Payment window was closed before payment could be verified.",
      "error"
    );

    return;
  }


  /*
     Give PayU callback some time.
  */

  finalStatusChecks = 0;


  runFinalStatusCheck();

}


/* =====================================================
   FINAL STATUS CHECK
===================================================== */

function runFinalStatusCheck() {

  if (paymentFinished) {
    return;
  }


  /*
     We need the txnid.

     It is stored on the polling object.
  */

  if (!window.activeTxnid) {

    stopPaymentProcess();

    showMessage(
      "Payment window was closed.",
      "error"
    );

    return;
  }


  finalStatusChecks++;


  checkPaymentStatus(
    window.activeTxnid
  );


  /*
     Continue checking for a short period.

     Normal polling is still running.
  */

  if (
    finalStatusChecks <
    FINAL_STATUS_CHECKS
  ) {

    setTimeout(
      runFinalStatusCheck,
      FINAL_STATUS_INTERVAL
    );

  } else {

    /*
       After approximately 30 seconds,
       if no SUCCESS/FAILED arrived,
       consider popup closure abandoned.
    */

    if (!paymentFinished) {

      stopPaymentProcess();


      closePaymentWindow();


      showMessage(
        "Payment window was closed before payment was confirmed.",
        "error"
      );


      /*
         Go to failed page only after
         verification window expires.
      */

      setTimeout(
        function() {

          window.location.href =
            CUSTOM_DOMAIN +
            "/failed.html?reason=popup_closed";

        },
        1200
      );

    }

  }

}


/* =====================================================
   START POLLING
===================================================== */

function startPolling(
  txnid
) {

  stopPolling();


  window.activeTxnid =
    txnid;


  pollingStarted = true;

  paymentFinished = false;


  showMessage(
    "Waiting for payment confirmation...",
    "loading"
  );


  /*
     Immediate check
  */

  checkPaymentStatus(
    txnid
  );


  /*
     Poll every 3 seconds
  */

  pollingTimer =
    setInterval(
      function() {

        if (paymentFinished) {
          return;
        }


        checkPaymentStatus(
          txnid
        );

      },
      3000
    );

}


/* =====================================================
   CHECK PAYMENT STATUS
===================================================== */

function checkPaymentStatus(
  txnid
) {

  callAppsScript(
    {
      options: "payment-status",
      txnid: txnid
    },

    function(result) {

      console.log(
        "PAYMENT STATUS:",
        result
      );


      if (
        !result ||
        !result.success
      ) {

        return;
      }


      const order =
        result.order;


      if (!order) {
        return;
      }


      const status =
        String(
          order.status || ""
        ).toUpperCase();


      console.log(
        "TXNID:",
        txnid,
        "STATUS:",
        status
      );


      /*
         SUCCESS
      */

      if (
        status === "SUCCESS"
      ) {

        paymentSuccess(
          txnid
        );

        return;
      }


      /*
         FAILED
      */

      if (
        status === "FAILED"
      ) {

        paymentFailed(
          txnid
        );

        return;
      }


      /*
         PENDING

         Continue polling.
      */

      if (!paymentFinished) {

        showMessage(
          popupClosedByUser
            ? "Checking payment status..."
            : "Payment processing...",
          "loading"
        );

      }

    }
  );

}


/* =====================================================
   PAYMENT TIMEOUT
===================================================== */

function startPaymentTimeout(
  txnid
) {

  stopPaymentTimeout();


  paymentTimeoutTimer =
    setTimeout(
      function() {

        if (paymentFinished) {
          return;
        }


        console.log(
          "PAYMENT TIMEOUT:",
          txnid
        );


        /*
           Stop normal polling temporarily.
        */

        stopPolling();


        showMessage(
          "Payment verification timed out. Please check your payment status.",
          "error"
        );


        /*
           Close PayU popup.
        */

        closePaymentWindow();


        /*
           Give the server one final status check
           before sending the customer away.
        */

        checkPaymentStatus(
          txnid
        );


        setTimeout(
          function() {

            if (paymentFinished) {
              return;
            }


            stopPaymentProcess();


            window.location.href =
              CUSTOM_DOMAIN +
              "/failed.html?reason=timeout";

          },
          3000
        );


      },
      PAYMENT_TIMEOUT_MS
    );

}


/* =====================================================
   STOP PAYMENT TIMEOUT
===================================================== */

function stopPaymentTimeout() {

  if (paymentTimeoutTimer) {

    clearTimeout(
      paymentTimeoutTimer
    );

  }


  paymentTimeoutTimer =
    null;

}


/* =====================================================
   PAYMENT SUCCESS
===================================================== */

function paymentSuccess(
  txnid
) {

  if (paymentFinished) {
    return;
  }


  paymentFinished = true;


  console.log(
    "PAYMENT SUCCESS:",
    txnid
  );


  stopPaymentProcess();


  showMessage(
    "Payment successful. Closing PayU...",
    "success"
  );


  /*
     CLOSE POPUP
  */

  closePaymentWindow();


  /*
     Redirect parent page only.
  */

  setTimeout(
    function() {

      window.location.href =
        CUSTOM_DOMAIN +
        "/success.html?txnid=" +
        encodeURIComponent(
          txnid
        );

    },
    800
  );

}


/* =====================================================
   PAYMENT FAILED
===================================================== */

function paymentFailed(
  txnid
) {

  if (paymentFinished) {
    return;
  }


  paymentFinished = true;


  console.log(
    "PAYMENT FAILED:",
    txnid
  );


  stopPaymentProcess();


  showMessage(
    "Payment failed. Closing PayU...",
    "error"
  );


  /*
     CLOSE POPUP
  */

  closePaymentWindow();


  /*
     Redirect parent page.
  */

  setTimeout(
    function() {

      window.location.href =
        CUSTOM_DOMAIN +
        "/failed.html?txnid=" +
        encodeURIComponent(
          txnid
        );

    },
    800
  );

}


/* =====================================================
   CLOSE PAYMENT WINDOW
===================================================== */

function closePaymentWindow() {

  stopPopupMonitor();


  if (
    paymentWindow &&
    !paymentWindow.closed
  ) {

    try {

      paymentWindow.close();

    } catch (e) {

      console.log(
        "Popup close error:",
        e
      );

    }

  }


  paymentWindow =
    null;

}


/* =====================================================
   STOP POLLING
===================================================== */

function stopPolling() {

  if (pollingTimer) {

    clearInterval(
      pollingTimer
    );

  }


  pollingTimer = null;

  pollingStarted = false;

}


/* =====================================================
   STOP EVERYTHING
===================================================== */

function stopPaymentProcess() {

  stopPolling();

  stopPopupMonitor();

  stopPaymentTimeout();


  window.activeTxnid =
    null;


  paymentStarted =
    false;

}


/* =====================================================
   RESET BUTTON
===================================================== */

function resetPaymentUI() {

  stopPaymentProcess();


  paymentStarted =
    false;


  paymentFinished =
    false;


  popupClosedByUser =
    false;


  if (currentBook) {

    payButton.disabled =
      false;


    payButton.textContent =
      "Proceed to Pay ₹" +
      Number(
        currentBook.price
      ).toFixed(2);

  } else {

    payButton.disabled =
      true;

    payButton.textContent =
      "Loading...";

  }

}


/* =====================================================
   PAGE EXIT
===================================================== */

window.addEventListener(
  "beforeunload",
  function() {

    stopPopupMonitor();

    stopPaymentTimeout();

    stopPolling();

  }
);

</script>
