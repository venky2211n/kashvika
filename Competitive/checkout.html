<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Checkout</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    Arial,
    sans-serif;

  background:
    #f5f7fb;

  color:
    #222;

}

.container {

  max-width:
    600px;

  margin:
    50px auto;

  padding:
    25px;

  background:
    white;

  border-radius:
    15px;

  box-shadow:
    0 10px 35px
    rgba(0,0,0,.08);

}

h1 {

  margin-top:
    0;

}

.book {

  padding:
    15px;

  margin-bottom:
    20px;

  background:
    #f7f8fa;

  border-radius:
    10px;

}

.book-title {

  font-size:
    20px;

  font-weight:
    bold;

}

.price {

  margin-top:
    8px;

  font-size:
    24px;

  font-weight:
    bold;

}

label {

  display:
    block;

  margin-top:
    15px;

  margin-bottom:
    6px;

  font-weight:
    bold;

}

input {

  width:
    100%;

  padding:
    13px;

  border:
    1px solid #ddd;

  border-radius:
    8px;

  font-size:
    15px;

}

button {

  width:
    100%;

  margin-top:
    22px;

  padding:
    14px;

  border:
    0;

  border-radius:
    8px;

  background:
    #1463ff;

  color:
    white;

  font-size:
    16px;

  cursor:
    pointer;

}

button:disabled {

  opacity:
    .6;

  cursor:
    not-allowed;

}

#message {

  margin-top:
    15px;

  text-align:
    center;

}

</style>

</head>

<body>


<div class="container">

<h1>
Checkout
</h1>


<div
  id="bookInfo"
  class="book"
>
Loading book...
</div>


<form
  id="checkoutForm"
>


<label>
Name
</label>

<input
  id="name"
  required
  autocomplete="name"
>


<label>
Email
</label>

<input
  id="email"
  type="email"
  required
  autocomplete="email"
>


<label>
Phone
</label>

<input
  id="phone"
  type="tel"
  required
  autocomplete="tel"
>


<button
  id="payButton"
  type="submit"
>
Proceed to Pay
</button>


</form>


<div
  id="message"
></div>


</div>


<script>


/****************************************************
 * CONFIG
 ****************************************************/

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzpOrhZAxH6BmxJndRwKkK-5_fcvvMg9dx-Hj2c2YeRd1gopBDLUKpjXSVZ5MXOUrBtcg/exec";


/*
 * Example:
 *
 * const APPS_SCRIPT_URL =
 * "https://script.google.com/macros/s/XXXXX/exec";
 */


/****************************************************
 * BOOK ID
 ****************************************************/

const params =
  new URLSearchParams(
    window.location.search
  );


const bookId =
  params.get("id");


if (!bookId) {

  document.getElementById(
    "bookInfo"
  ).textContent =
    "Book ID missing.";

}


/****************************************************
 * LOAD BOOK USING JSONP
 ****************************************************/

if (bookId) {

  loadBook();

}


function loadBook() {

  const callback =
    "bookCallback_" +
    Date.now();


  window[callback] =
    function(result) {

      try {

        if (
          !result.success
        ) {

          throw new Error(
            result.error ||
            "Book not found"
          );

        }


        const book =
          result.book;


        document.getElementById(
          "bookInfo"
        ).innerHTML = `

          <div class="book-title">
            ${escapeHtml(book.title)}
          </div>

          <div class="price">
            ₹${Number(book.price).toFixed(2)}
          </div>

        `;


      } finally {

        delete window[callback];

        script.remove();

      }

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    APPS_SCRIPT_URL +
    "?options=book-data" +
    "&id=" +
    encodeURIComponent(bookId) +
    "&callback=" +
    encodeURIComponent(callback);


  script.onerror =
    function() {

      document.getElementById(
        "bookInfo"
      ).textContent =
        "Unable to load book.";

      delete window[callback];

      script.remove();

    };


  document.body.appendChild(
    script
  );

}


/****************************************************
 * START CHECKOUT
 ****************************************************/

document
  .getElementById(
    "checkoutForm"
  )
  .addEventListener(
    "submit",
    startPayment
  );


function startPayment(e) {

  e.preventDefault();


  const button =
    document.getElementById(
      "payButton"
    );


  const message =
    document.getElementById(
      "message"
    );


  const name =
    document.getElementById(
      "name"
    ).value.trim();


  const email =
    document.getElementById(
      "email"
    ).value.trim();


  const phone =
    document.getElementById(
      "phone"
    ).value.trim();


  if (
    !name ||
    !email ||
    !phone
  ) {

    message.textContent =
      "Please enter all details.";

    return;

  }


  /*
   * IMPORTANT:
   *
   * Open popup NOW, synchronously
   * from the user's click.
   */
  const paymentWindow =
    window.open(
      "",
      "PayUPaymentWindow",
      "width=520," +
      "height=760," +
      "left=200," +
      "top=50," +
      "scrollbars=yes," +
      "resizable=yes"
    );


  if (!paymentWindow) {

    message.textContent =
      "Popup blocked. Please allow popups for this website.";

    return;

  }


  /*
   * Temporary popup content
   */
  paymentWindow.document.open();

  paymentWindow.document.write(`

    <!DOCTYPE html>

    <html>

    <head>

    <title>
      Preparing Payment
    </title>

    <style>

    body {
      font-family: Arial;
      text-align: center;
      padding-top: 100px;
    }

    </style>

    </head>

    <body>

    <h2>
      Preparing Payment...
    </h2>

    <p>
      Please wait.
    </p>

    </body>

    </html>

  `);

  paymentWindow.document.close();


  button.disabled =
    true;

  button.textContent =
    "Preparing Payment...";


  message.textContent =
    "Opening PayU payment window...";


  /*
   * Apps Script JSONP
   */
  createPayment(
    paymentWindow,
    name,
    email,
    phone,
    button,
    message
  );

}


/****************************************************
 * CREATE PAYMENT
 ****************************************************/

function createPayment(
  paymentWindow,
  name,
  email,
  phone,
  button,
  message
) {

  const callback =
    "paymentCallback_" +
    Date.now();


  window[callback] =
    function(result) {

      try {

        if (
          !result.success
        ) {

          throw new Error(
            result.error ||
            "Unable to create payment"
          );

        }


        /*
         * We now have:
         *
         * result.paymentUrl
         * result.paymentData
         */
        submitToPayU(
          paymentWindow,
          result.paymentUrl,
          result.paymentData
        );


        button.textContent =
          "Payment Window Opened";


        message.textContent =
          "Complete the payment in the PayU window.";


      } catch (err) {

        if (
          paymentWindow &&
          !paymentWindow.closed
        ) {

          paymentWindow.close();

        }


        button.disabled =
          false;


        button.textContent =
          "Proceed to Pay";


        message.textContent =
          err.message;


      } finally {

        delete window[callback];

        script.remove();

      }

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    APPS_SCRIPT_URL +
    "?options=create-payment" +
    "&id=" +
    encodeURIComponent(bookId) +
    "&name=" +
    encodeURIComponent(name) +
    "&email=" +
    encodeURIComponent(email) +
    "&phone=" +
    encodeURIComponent(phone) +
    "&callback=" +
    encodeURIComponent(callback);


  script.onerror =
    function() {

      if (
        paymentWindow &&
        !paymentWindow.closed
      ) {

        paymentWindow.close();

      }


      button.disabled =
        false;


      button.textContent =
        "Proceed to Pay";


      message.textContent =
        "Unable to contact payment server.";


      delete window[callback];

      script.remove();

    };


  document.body.appendChild(
    script
  );

}


/****************************************************
 * SUBMIT TO PAYU
 ****************************************************/

function submitToPayU(
  paymentWindow,
  paymentUrl,
  paymentData
) {

  const doc =
    paymentWindow.document;


  /*
   * Clear popup
   */
  doc.open();


  doc.write(`
    <!DOCTYPE html>
    <html>
    <head>
      <title>PayU Payment</title>
    </head>
    <body>
      <p style="
        font-family:Arial;
        text-align:center;
        margin-top:80px;
      ">
        Redirecting to PayU...
      </p>
    </body>
    </html>
  `);


  doc.close();


  /*
   * Create PayU form
   */
  const form =
    doc.createElement(
      "form"
    );


  form.method =
    "POST";


  form.action =
    paymentUrl;


  form.target =
    "_self";


  Object.keys(
    paymentData
  ).forEach(
    function(key) {

      const input =
        doc.createElement(
          "input"
        );


      input.type =
        "hidden";


      input.name =
        key;


      input.value =
        paymentData[key];


      form.appendChild(
        input
      );

    }
  );


  doc.body.appendChild(
    form
  );


  /*
   * Send customer to PayU
   */
  form.submit();

}


/****************************************************
 * ESCAPE HTML
 ****************************************************/

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>

</html>
