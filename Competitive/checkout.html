<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>5Checkout - Ebook Store</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#222;
}

.container{
  max-width:700px;
  margin:50px auto;
  padding:20px;
}

.card{
  background:white;
  padding:30px;
  border-radius:15px;
  box-shadow:0 5px 25px rgba(0,0,0,.08);
}

h1{
  margin-top:0;
}

.book-info{
  display:flex;
  gap:20px;
  align-items:center;
  margin-bottom:25px;
}

.book-info img{
  width:110px;
  height:140px;
  object-fit:cover;
  border-radius:8px;
}

.price{
  font-size:25px;
  font-weight:bold;
}

label{
  display:block;
  margin-top:15px;
  margin-bottom:6px;
  font-weight:bold;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:16px;
}

button{
  width:100%;
  margin-top:25px;
  padding:15px;
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-size:18px;
  cursor:pointer;
}

button:hover{
  background:#1d4ed8;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  margin-top:20px;
  text-align:center;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>Checkout</h1>

<div id="bookInfo">
Loading book...
</div>


<form id="checkoutForm">

<label>
Name
</label>

<input
  type="text"
  id="name"
  required
  autocomplete="name"
>


<label>
Email
</label>

<input
  type="email"
  id="email"
  required
  autocomplete="email"
>


<label>
Phone
</label>

<input
  type="tel"
  id="phone"
  required
  maxlength="10"
  pattern="[0-9]{10}"
  autocomplete="tel"
>


<button
  type="submit"
  id="payButton"
>
Proceed to Pay
</button>

</form>

<div
  class="message"
  id="message">
</div>

</div>

</div>


<script>


    
<script>

// ============================================
// CONFIG
// ============================================

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyy04gFqiWiClPFYdG6grJHw7CzETnu2jumOcvoHdynKEJl1SD495IVLMxqrvN-VTpo6Q/exec";

const CUSTOM_PAY_URL =
"https://kashvika.website/Competitive/pay";


// ============================================
// BOOK ID
// ============================================

const params =
  new URLSearchParams(
    window.location.search
  );

const bookId =
  params.get("id");


if (!bookId) {

  document.getElementById("bookInfo")
    .innerHTML =
      "<p>Book ID is missing.</p>";

  document.getElementById("payButton")
    .disabled = true;

}


// ============================================
// LOAD BOOK
// ============================================

function loadBook() {

  if (!bookId) return;

  const callbackName =
    "bookCallback_" +
    Date.now();

  window[callbackName] =
    function(response) {

      try {

        if (!response.success) {

          throw new Error(
            response.message ||
            "Book not found"
          );

        }


        const book =
          response.book;


        document.getElementById("bookInfo")
          .innerHTML = `

<div class="book-info">

  <img
    src="${escapeHtml(book.imageUrl)}"
    alt="${escapeHtml(book.title)}"
  >

  <div>

    <h2>
      ${escapeHtml(book.title)}
    </h2>

    <div class="price">
      ₹${Number(book.price).toFixed(2)}
    </div>

    <p>
      ${escapeHtml(book.category || "")}
    </p>

  </div>

</div>

`;


      } catch (error) {

        document.getElementById("bookInfo")
          .innerHTML =
            "<p>" +
            escapeHtml(error.message) +
            "</p>";

        document.getElementById("payButton")
          .disabled = true;

      }


      delete window[callbackName];

      document
        .getElementById(callbackName)
        ?.remove();

    };


  const script =
    document.createElement("script");


  script.id =
    callbackName;


  script.src =
    APPS_SCRIPT_URL +
    "?action=book" +
    "&id=" +
    encodeURIComponent(bookId) +
    "&callback=" +
    callbackName;


  document.body.appendChild(script);

}


// Load book immediately
loadBook();


// ============================================
// SUBMIT PAYMENT
// ============================================

document
  .getElementById("checkoutForm")
  .addEventListener(
    "submit",
    function(e) {

      e.preventDefault();


      // ----------------------------------------
      // CUSTOMER DETAILS
      // ----------------------------------------

      const name =
        document
          .getElementById("name")
          .value
          .trim();


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const phone =
        document
          .getElementById("phone")
          .value
          .trim();


      // ----------------------------------------
      // VALIDATION
      // ----------------------------------------

      if (!name) {

        alert("Please enter your name.");
        return;

      }


      if (!email) {

        alert("Please enter your email.");
        return;

      }


      if (!phone) {

        alert("Please enter your phone number.");
        return;

      }


      if (!bookId) {

        alert("Book ID is missing.");
        return;

      }


      // ----------------------------------------
      // BUTTON
      // ----------------------------------------

      const button =
        document
          .getElementById("payButton");


      const message =
        document
          .getElementById("message");


      button.disabled = true;

      button.innerText =
        "Opening Payment...";


      message.innerText =
        "Please wait...";


      // ========================================
      // CUSTOM DOMAIN PAYMENT URL
      // ========================================
      //
      // Example:
      //
      // https://kashvika.website/Competitive/pay
      //      ?id=102
      //      &name=Venkataramana
      //      &email=test@gmail.com
      //      &phone=9876543210
      //
      // ========================================

      const payUrl =
        CUSTOM_PAY_URL +
        "?id=" +
        encodeURIComponent(bookId) +
        "&name=" +
        encodeURIComponent(name) +
        "&email=" +
        encodeURIComponent(email) +
        "&phone=" +
        encodeURIComponent(phone);


      // ----------------------------------------
      // OPEN CUSTOM DOMAIN PAYMENT PAGE
      // ----------------------------------------

      window.location.href =
        payUrl;

    }
  );


// ============================================
// ESCAPE HTML
// ============================================

function escapeHtml(value) {

  return String(value || "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>
