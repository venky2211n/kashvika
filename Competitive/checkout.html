<script>

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzAkSJIKHHUt1fUE762fdrKeRArwRlrVuyn7Qyz1Nls_SC9dBANG6Fp5JK_9ZNXeH4b9g/exec";

const CUSTOM_DOMAIN =
  "https://kashvika.website/Competitive";


let currentBook = null;

let paymentWindow = null;

let pollingTimer = null;

let pollingStarted = false;

let paymentFinished = false;


/* =====================================================
   GET BOOK ID
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const bookId =
  params.get("id");


/* =====================================================
   JSONP
===================================================== */

function callAppsScript(params, callback) {

  const callbackName =
    "jsonp_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  params.callback =
    callbackName;


  const script =
    document.createElement("script");


  const query =
    new URLSearchParams(
      params
    ).toString();


  let finished = false;


  window[callbackName] =
    function(data) {

      if (finished) {
        return;
      }

      finished = true;


      try {

        callback(data);

      }

      catch(error) {

        console.error(
          "Callback error:",
          error
        );

      }


      try {

        delete window[callbackName];

      }

      catch(e) {

        window[callbackName] =
          undefined;

      }


      if (script.parentNode) {

        script.parentNode
          .removeChild(script);

      }

    };


  script.src =
    APPS_SCRIPT_URL +
    "?" +
    query;


  script.onerror =
    function() {

      if (finished) {
        return;
      }

      finished = true;


      try {

        delete window[callbackName];

      }

      catch(e) {

        window[callbackName] =
          undefined;

      }


      if (script.parentNode) {

        script.parentNode
          .removeChild(script);

      }


      callback({

        success: false,

        error:
          "Failed to connect to Apps Script"

      });

    };


  document
    .body
    .appendChild(script);

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(value || "")

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* =====================================================
   LOAD BOOK
===================================================== */

function loadBook() {

  const bookInfo =
    document.getElementById(
      "bookInfo"
    );


  const payButton =
    document.getElementById(
      "payButton"
    );


  if (!bookId) {

    bookInfo.innerHTML =
      '<div class="error">' +
      'Book ID is missing.' +
      '</div>';

    return;

  }


  bookInfo.innerHTML =
    '<div class="loading">' +
    'Fetching book details...' +
    '</div>';


  console.log(
    "Loading book:",
    bookId
  );


  callAppsScript({

    options:
      "book-data",

    id:
      bookId

  }, function(result) {


    console.log(
      "BOOK DATA RESPONSE:",
      result
    );


    if (
      !result ||
      result.success !== true
    ) {

      bookInfo.innerHTML =
        '<div class="error">' +

        escapeHtml(
          result &&
          result.error
            ? result.error
            : "Book not found"
        ) +

        '</div>';

      return;

    }


    if (!result.book) {

      bookInfo.innerHTML =
        '<div class="error">' +
        'Book data is empty.' +
        '</div>';

      return;

    }


    currentBook =
      result.book;


    /* ==========================================
       BOOK IMAGE
    ========================================== */

    let html = "";


    if (currentBook.imageUrl) {

      html += `

        <img
          src="${escapeHtml(
            currentBook.imageUrl
          )}"
          class="book-image"
          alt="${escapeHtml(
            currentBook.title
          )}"
        >

      `;

    }


    /* ==========================================
       TITLE
    ========================================== */

    html += `

      <div class="book-title">

        ${escapeHtml(
          currentBook.title
        )}

      </div>

    `;


    /* ==========================================
       CATEGORY
    ========================================== */

    if (currentBook.category) {

      html += `

        <div class="category">

          <span>

            ${escapeHtml(
              currentBook.category
            )}

          </span>

        </div>

      `;

    }


    /* ==========================================
       DESCRIPTION
    ========================================== */

    html += `

      <div class="book-description">

        ${escapeHtml(
          currentBook.description || ""
        )}

      </div>

    `;


    /* ==========================================
       PRICE
    ========================================== */

    html += `

      <div class="price">

        ₹${Number(
          currentBook.price || 0
        ).toFixed(2)}

      </div>

    `;


    bookInfo.innerHTML =
      html;


    /* ==========================================
       ENABLE BUTTON
    ========================================== */

    payButton.disabled =
      false;


    payButton.innerText =
      "Proceed to Pay ₹" +
      Number(
        currentBook.price || 0
      ).toFixed(2);


    console.log(
      "PAY BUTTON ENABLED"
    );

  });

}


/* =====================================================
   START PAYMENT
===================================================== */

function startPayment() {

  console.log(
    "startPayment() called"
  );


  const message =
    document.getElementById(
      "message"
    );


  if (!currentBook) {

    message.innerText =
      "Book details are not loaded yet.";

    return;

  }


  const name =
    document
      .getElementById("name")
      .value
      .trim();


  const email =
    document
      .getElementById("email")
      .value
      .trim();


  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  if (!name || !email || !phone) {

    message.innerText =
      "Please enter name, email and phone.";

    return;

  }


  /*
   * Open popup immediately.
   */

  paymentWindow =
    window.open(
      "",
      "PayUPaymentWindow",
      "width=520,height=760,scrollbars=yes,resizable=yes"
    );


  if (!paymentWindow) {

    message.innerText =
      "Popup blocked. Please allow popups.";

    return;

  }


  paymentWindow.document.open();


  paymentWindow.document.write(`

    <html>

      <head>

        <title>
          PayU Payment
        </title>

      </head>

      <body
        style="
          font-family:Arial;
          text-align:center;
          padding:40px;
        "
      >

        <h2>
          Preparing payment...
        </h2>

        <p>
          Please wait...
        </p>

      </body>

    </html>

  `);


  paymentWindow.document.close();


  message.innerText =
    "Creating payment...";


  /* ==========================================
     CREATE PAYMENT
  ========================================== */

  callAppsScript({

    options:
      "create-payment",

    id:
      bookId,

    name:
      name,

    email:
      email,

    phone:
      phone

  }, function(result) {


    console.log(
      "CREATE PAYMENT RESPONSE:",
      result
    );


    if (
      !result ||
      result.success !== true
    ) {

      if (
        paymentWindow &&
        !paymentWindow.closed
      ) {

        paymentWindow.close();

      }


      message.innerText =
        result &&
        result.error
          ? result.error
          : "Unable to create payment.";

      return;

    }


    /* ==========================================
       SEND TO PAYU
    ========================================== */

    submitToPayU(

      result.paymentUrl,

      result.paymentData

    );


    message.innerText =
      "Complete payment in the payment window.";


    /* ==========================================
       POLLING
    ========================================== */

    startPaymentPolling(
      result.txnid
    );

  });

}


/* =====================================================
   SUBMIT TO PAYU
===================================================== */

function submitToPayU(
  paymentUrl,
  paymentData
) {

  if (
    !paymentWindow ||
    paymentWindow.closed
  ) {

    return;

  }


  const form =
    paymentWindow.document
      .createElement("form");


  form.method =
    "POST";


  form.action =
    paymentUrl;


  form.style.display =
    "none";


  Object.keys(
    paymentData
  ).forEach(
    function(key) {

      const input =
        paymentWindow.document
          .createElement("input");


      input.type =
        "hidden";


      input.name =
        key;


      input.value =
        paymentData[key];


      form.appendChild(
        input
      );

    }
  );


  paymentWindow.document
    .body
    .appendChild(
      form
    );


  form.submit();

}


/* =====================================================
   START POLLING
===================================================== */

function startPaymentPolling(
  txnid
) {

  if (pollingStarted) {

    return;

  }


  pollingStarted =
    true;


  let attempts = 0;


  checkPaymentStatus(
    txnid
  );


  pollingTimer =
    setInterval(
      function() {

        attempts++;


        checkPaymentStatus(
          txnid
        );


        if (attempts >= 200) {

          clearInterval(
            pollingTimer
          );

          pollingTimer =
            null;

          pollingStarted =
            false;

          document
            .getElementById(
              "message"
            )
            .innerText =
              "Payment verification timed out.";

        }

      },
      3000
    );

}


/* =====================================================
   CHECK PAYMENT STATUS
===================================================== */

function checkPaymentStatus(
  txnid
) {

  if (paymentFinished) {

    return;

  }


  callAppsScript({

    options:
      "payment-status",

    txnid:
      txnid

  }, function(result) {


    console.log(
      "PAYMENT STATUS:",
      result
    );


    if (
      !result ||
      result.success !== true
    ) {

      return;

    }


    if (!result.order) {

      return;

    }


    const status =
      String(
        result.order.status || ""
      ).toUpperCase();


    if (
      status === "SUCCESS"
    ) {

      paymentCompleted(
        txnid
      );

      return;

    }


    if (
      status === "FAILED"
    ) {

      paymentFailed(
        txnid
      );

      return;

    }


    document
      .getElementById(
        "message"
      )
      .innerText =
        "Payment processing...";

  });

}


/* =====================================================
   SUCCESS
===================================================== */

function paymentCompleted(
  txnid
) {

  if (paymentFinished) {

    return;

  }


  paymentFinished =
    true;


  if (pollingTimer) {

    clearInterval(
      pollingTimer
    );

    pollingTimer =
      null;

  }


  pollingStarted =
    false;


  if (
    paymentWindow &&
    !paymentWindow.closed
  ) {

    paymentWindow.close();

  }


  window.location.href =
    CUSTOM_DOMAIN +
    "/success.html?txnid=" +
    encodeURIComponent(
      txnid
    );

}


/* =====================================================
   FAILED
===================================================== */

function paymentFailed(
  txnid
) {

  if (paymentFinished) {

    return;

  }


  paymentFinished =
    true;


  if (pollingTimer) {

    clearInterval(
      pollingTimer
    );

    pollingTimer =
      null;

  }


  pollingStarted =
    false;


  if (
    paymentWindow &&
    !paymentWindow.closed
  ) {

    paymentWindow.close();

  }


  window.location.href =
    CUSTOM_DOMAIN +
    "/failed.html?txnid=" +
    encodeURIComponent(
      txnid
    );

}


/* =====================================================
   LOAD BOOK
===================================================== */

loadBook();

</script>




</body>
</html>
