
<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0"
  >

  <title>
    Preparing Payment
  </title>


  <style>

    body {

      margin: 0;

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      font-family:
        Arial,
        sans-serif;

      background: #f5f5f5;
    }


    .box {

      width: 90%;

      max-width: 420px;

      background: white;

      padding: 35px;

      border-radius: 16px;

      text-align: center;

      box-shadow:
        0 10px 30px
        rgba(0,0,0,.08);
    }


    .loader {

      width: 45px;

      height: 45px;

      margin:
        0 auto 20px;

      border:
        4px solid #ddd;

      border-top-color:
        #111;

      border-radius: 50%;

      animation:
        spin 1s linear infinite;
    }


    @keyframes spin {

      to {
        transform:
          rotate(360deg);
      }

    }

  </style>

</head>


<body>


<div class="box">

  <div class="loader"></div>

  <h2>
    Preparing Payment
  </h2>

  <p>
    Please wait while we securely
    connect to PayU...
  </p>

</div>


<script>


/*
 * Apps Script deployed URL
 */
const APPS_SCRIPT_URL =

  "https://script.google.com/macros/s/AKfycbxVFNWOBmK7fW_TRczOwQlMqkUot_LzjxcRidM-QhQhZWrgIgHgB1ymrIXIE1P0g5kLoA/exec";


const params =
  new URLSearchParams(
    window.location.search
  );


const bookId =
  params.get("id");


const name =
  params.get("name");


const email =
  params.get("email");


const phone =
  params.get("phone");


/*
 * Validate.
 */
if (
  !bookId ||
  !name ||
  !email ||
  !phone
) {

  document.body.innerHTML = `

    <div class="box">

      <h2>
        Invalid Payment Request
      </h2>

      <p>
        Required information is missing.
      </p>

    </div>

  `;

}


/*
 * Send request to Apps Script.
 */
else {


  const form =
    document.createElement(
      "form"
    );


  form.method =
    "POST";


  form.action =
    APPS_SCRIPT_URL;


  form.target =
    "_self";


  function addHidden(
    name,
    value
  ) {

    const input =
      document.createElement(
        "input"
      );


    input.type =
      "hidden";


    input.name =
      name;


    input.value =
      value;


    form.appendChild(
      input
    );
  }


  addHidden(
    "action",
    "createPayment"
  );


  addHidden(
    "bookId",
    bookId
  );


  addHidden(
    "name",
    name
  );


  addHidden(
    "email",
    email
  );


  addHidden(
    "phone",
    phone
  );


  document.body.appendChild(
    form
  );


  form.submit();
}

</script>


</body>

</html>
```
