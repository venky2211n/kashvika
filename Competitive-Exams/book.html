
<!DOCTYPE html>
<html>

<head>

<title>ebook</title>

<style>

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

iframe {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  border: none;
}

</style>

</head>


<body>


<iframe id="myIframe"></iframe>


<script>

const params =
  new URLSearchParams(
    window.location.search
  );


const id =
  params.get("id");


if (!id) {

  document.body.innerHTML =
    "<h2>Book ID missing.</h2>";

} else {


  const APP_URL =
    "https://script.google.com/macros/s/AKfycbzvAAYgN18Hp_A6APX25qjX9bTwyh1IS7X71Fi_huEeuZ37_ALVx0Rgw7bGC71ydIPaFg/exec";


  const iframeUrl =

    APP_URL +

    "?options=book" +

    "&id=" +

    encodeURIComponent(id);


  document.getElementById(
    "myIframe"
  ).src =
    iframeUrl;

}

</script>


</body>

</html>
