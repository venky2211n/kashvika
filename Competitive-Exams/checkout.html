<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>1eBook Checkout</title>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    iframe {
      position: fixed;
      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      border: none;
    }

  </style>

</head>


<body>


<iframe
  id="myIframe"
  src="">
</iframe>


<script>

/* ==========================================
   READ ID FROM GITHUB URL
   ========================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const id =
  params.get("id");


/* ==========================================
   CHECK ID
   ========================================== */

if (!id) {

  document.body.innerHTML =
    "<h2 style='text-align:center;margin-top:50px'>" +
    "Book ID missing." +
    "</h2>";

} else {


  /* ========================================
     YOUR APPS SCRIPT DEPLOYMENT URL
     ======================================== */

  const APP_URL =
    "hhttps://script.google.com/macros/s/AKfycby065bMYR3i62RrnUGQNR71zk-qYOcPGaCqWrzVJejOXFcY9HQv3GY8uTIg-om7b1hkww/exec";


  /* ========================================
     CREATE APPS SCRIPT URL
     ======================================== */

  const iframeUrl =

    APP_URL +

    "?options=checkout" +

    "&id=" +

    encodeURIComponent(id);


  /* ========================================
     LOAD APPS SCRIPT INSIDE IFRAME
     ======================================== */

  document.getElementById(
    "myIframe"
  ).src = iframeUrl;

}

</script>


</body>

</html>
