



<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>70Payment Successful</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.10);
    }

    .success-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: #22c55e;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      margin: 10px 0;
      color: #16a34a;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    /* Loading */

    #loading {
      text-align: center;
      padding: 30px 10px;
    }

    .spinner {
      width: 35px;
      height: 35px;
      border: 4px solid #ddd;
      border-top: 4px solid #16a34a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    /* Error */

    #error {
      display: none;
      padding: 15px;
      margin-top: 20px;
      background: #fee2e2;
      color: #b91c1c;
      border-radius: 8px;
      text-align: center;
    }

    /* Order */

    #orderDetails {
      display: none;
    }

    .order-box {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 13px 15px;
      border-bottom: 1px solid #eee;
    }

    .row:last-child {
      border-bottom: none;
    }

    .label {
      color: #666;
      font-weight: 500;
    }

    .value {
      font-weight: 600;
      text-align: right;
      word-break: break-word;
    }

    .amount {
      color: #16a34a;
      font-size: 20px;
    }

    .status {
      color: #16a34a;
      font-weight: bold;
      text-transform: uppercase;
    }

    .download-btn {
      display: block;
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #16a34a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }

    .download-btn:hover {
      background: #15803d;
    }

    .home-btn {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
      color: #333;
      font-size: 15px;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }

    @media (max-width: 500px) {

      body {
        padding: 10px;
      }

      .container {
        margin: 15px auto;
        padding: 20px;
      }

      .row {
        flex-direction: column;
        gap: 5px;
      }

      .value {
        text-align: left;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <!-- ========================================= -->
  <!-- SUCCESS HEADER -->
  <!-- ========================================= -->

  <div class="success-icon">
    ✓
  </div>

  <h1>
    Payment Successful
  </h1>

  <div class="subtitle">
    Your payment has been received successfully.
  </div>


  <!-- ========================================= -->
  <!-- LOADING -->
  <!-- ========================================= -->

  <div id="loading">

    <div class="spinner"></div>

    <strong>
      Retrieving your order...
    </strong>

  </div>


  <!-- ========================================= -->
  <!-- ERROR -->
  <!-- ========================================= -->

  <div id="error"></div>


  <!-- ========================================= -->
  <!-- ORDER DETAILS -->
  <!-- ========================================= -->

  <div id="orderDetails">

    <div class="order-box">


      <div class="row">

        <div class="label">
          Transaction ID
        </div>

        <div class="value"
             id="txnid">
        </div>

      </div>


      <div class="row">

        <div class="label">
          Product
        </div>

        <div class="value"
             id="product">
        </div>

      </div>


      <div class="row">

        <div class="label">
          Book ID
        </div>

        <div class="value"
             id="bookId">
        </div>

      </div>


      <div class="row">

        <div class="label">
          Amount
        </div>

        <div class="value amount"
             id="amount">
        </div>

      </div>


      <div class="row">

        <div class="label">
          Customer Name
        </div>

        <div class="value"
             id="name">
        </div>

      </div>


      <div class="row">

        <div class="label">
          Email
        </div>

        <div class="value"
             id="email">
        </div>

      </div>


      <div class="row">

        <div class="label">
          Phone
        </div>

        <div class="value"
             id="phone">
        </div>

      </div>


      <div class="row">

        <div class="label">
          Payment Status
        </div>

        <div class="value status"
             id="status">
        </div>

      </div>


    </div>


    <!-- ========================================= -->
    <!-- DOWNLOAD -->
    <!-- ========================================= -->

    <a id="downloadButton"
       class="download-btn"
       href="#"
       style="display:none;">

      Download eBook

    </a>


    <!-- ========================================= -->
    <!-- HOME -->
    <!-- ========================================= -->

    <a
      class="home-btn"
      href="https://kashvika.website/ebooks/">

      Back to eBooks

    </a>

  </div>


</div>



<script>


// =====================================================
// APPS SCRIPT API URL
// =====================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbxebt5jmeiyT9uvbSEKJls3_zDwf5kU-FLv7dBOlXZA/exec";


// =====================================================
// GET TXNID FROM URL
// =====================================================

const urlParams =
  new URLSearchParams(
    window.location.search
  );

const txnid =
  urlParams.get("txnid");


// =====================================================
// ELEMENTS
// =====================================================

const loading =
  document.getElementById("loading");

const errorBox =
  document.getElementById("error");

const orderDetails =
  document.getElementById("orderDetails");


// =====================================================
// START
// =====================================================

if (!txnid) {

  showError(
    "Transaction ID is missing."
  );

} else {

  loadOrder();

}


// =====================================================
// LOAD ORDER
// =====================================================

function loadOrder() {


  // -----------------------------------------
  // JSONP CALLBACK NAME
  // -----------------------------------------

  const callbackName =
    "paymentOrder_" +
    Date.now();


  // -----------------------------------------
  // CALLBACK
  // -----------------------------------------

  window[callbackName] =
    function(data) {

      console.log(
        "Payment Order:",
        data
      );


      // Stop timeout

      clearTimeout(timeout);


      // Remove loading

      loading.style.display =
        "none";


      // ---------------------------------------
      // CHECK RESPONSE
      // ---------------------------------------

      if (
        !data ||
        data.success !== true
      ) {

        showError(
          data && data.message
            ? data.message
            : "Unable to retrieve order."
        );

        cleanup();

        return;
      }


      // ---------------------------------------
      // DISPLAY DATA
      // ---------------------------------------

      document.getElementById("txnid")
        .textContent =
          data.txnid || txnid;


      document.getElementById("product")
        .textContent =
          data.product || "";


      document.getElementById("bookId")
        .textContent =
          data.bookId || "";


      document.getElementById("amount")
        .textContent =
          "₹" +
          Number(data.amount || 0)
            .toLocaleString("en-IN");


      document.getElementById("name")
        .textContent =
          data.name || "";


      document.getElementById("email")
        .textContent =
          data.email || "";


      document.getElementById("phone")
        .textContent =
          data.phone || "";


      document.getElementById("status")
        .textContent =
          data.status || "SUCCESS";


      // ---------------------------------------
      // SHOW ORDER
      // ---------------------------------------

      orderDetails.style.display =
        "block";


      // ---------------------------------------
      // DOWNLOAD BUTTON
      // ---------------------------------------

      const downloadButton =
        document.getElementById(
          "downloadButton"
        );


      if (data.bookId) {

        downloadButton.href =
          "https://kashvika.website/ebooks/download.html?id=" +
          encodeURIComponent(
            data.bookId
          ) +
          "&txnid=" +
          encodeURIComponent(
            data.txnid
          );

        downloadButton.style.display =
          "block";
      }


      // ---------------------------------------
      // CLEANUP
      // ---------------------------------------

      cleanup();

    };


  // =================================================
  // JSONP URL
  // =================================================

  const apiUrl =
    API_URL +
    "?txnid=" +
    encodeURIComponent(txnid) +
    "&callback=" +
    encodeURIComponent(callbackName);


  console.log(
    "Calling API:",
    apiUrl
  );


  // =================================================
  // CREATE SCRIPT
  // =================================================

  const script =
    document.createElement("script");


  script.src =
    apiUrl;


  script.async =
    true;


  // =================================================
  // ERROR
  // =================================================

  script.onerror =
    function() {

      clearTimeout(timeout);

      loading.style.display =
        "none";

      showError(
        "Unable to connect to the payment server."
      );

      cleanup();

    };


  // =================================================
  // ADD SCRIPT
  // =================================================

  document.body.appendChild(
    script
  );


  // =================================================
  // 5 SECOND TIMEOUT
  // =================================================

  const timeout =
    setTimeout(
      function() {

        loading.style.display =
          "none";

        showError(
          "Payment server did not respond. Please refresh the page."
        );

        cleanup();

      },
      5000
    );


  // =================================================
  // CLEANUP FUNCTION
  // =================================================

  function cleanup() {

    delete window[callbackName];

    if (
      script &&
      script.parentNode
    ) {

      script.parentNode.removeChild(
        script
      );

    }

  }

}


// =====================================================
// ERROR FUNCTION
// =====================================================

function showError(message) {

  errorBox.textContent =
    message;

  errorBox.style.display =
    "block";

}

</script>


</body>

</html>
