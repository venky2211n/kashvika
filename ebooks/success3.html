


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>50Payment Successful - Kashvika</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 35px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.10);
    }

    .success-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #28a745;
      color: white;
      font-size: 42px;
      line-height: 70px;
      text-align: center;
    }

    h1 {
      text-align: center;
      color: #28a745;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #666;
    }

    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 15px;
      border: 4px solid #ddd;
      border-top: 4px solid #28a745;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    .order-details {
      display: none;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 13px 0;
      border-bottom: 1px solid #eee;
    }

    .row:last-child {
      border-bottom: none;
    }

    .label {
      font-weight: bold;
      color: #555;
    }

    .value {
      text-align: right;
      word-break: break-word;
    }

    .status {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      background: #d4edda;
      color: #155724;
      font-weight: bold;
    }

    .error {
      display: none;
      text-align: center;
      color: #721c24;
      background: #f8d7da;
      padding: 20px;
      border-radius: 8px;
    }

    .buttons {
      margin-top: 30px;
      text-align: center;
    }

    .btn {
      display: inline-block;
      padding: 12px 22px;
      margin: 5px;
      border-radius: 6px;
      text-decoration: none;
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 15px;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .home-btn {
      background: #343a40;
    }

    @media (max-width: 500px) {

      .container {
        margin: 20px auto;
      }

      .card {
        padding: 25px 18px;
      }

      .row {
        flex-direction: column;
        gap: 5px;
      }

      .value {
        text-align: left;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <!-- LOADING -->
      <div id="loading" class="loading">

        <div class="spinner"></div>

        <h3>Verifying Payment...</h3>

        <p>Please wait while we retrieve your order details.</p>

      </div>


      <!-- ERROR -->
      <div id="errorBox" class="error">

        <h2>Unable to Retrieve Order</h2>

        <p id="errorMessage"></p>

      </div>


      <!-- SUCCESS -->
      <div id="successContent" class="order-details">

        <div class="success-icon">
          ✓
        </div>

        <h1>Payment Successful</h1>

        <p class="subtitle">
          Thank you for your purchase!
        </p>


        <!-- ORDER INFORMATION -->

        <div>
  Transaction ID:
  <span id="txnid"></span>
</div>

<div>
  Product:
  <span id="product"></span>
</div>

<div>
  Amount:
  <span id="amount"></span>
</div>

<div>
  Name:
  <span id="name"></span>
</div>

<div>
  Email:
  <span id="email"></span>
</div>

<div>
  Phone:
  <span id="phone"></span>
</div>

<div>
  Status:
  <span id="status"></span>
</div>

<div id="error"></div>
        </div>


        <!-- BUTTONS -->

        <div class="buttons">

          <a
            href="https://kashvika.website/ebooks/"
            class="btn home-btn"
          >
            Back to eBooks
          </a>

        </div>

      </div>

    </div>

  </div>






<script>

// const params =
//   new URLSearchParams(
//     window.location.search
//   );

// const txnid =
//   params.get("txnid");


// const APP_URL =
//   "https://script.google.com/macros/s/AKfycbxbhmC6jXaqcn23WJ5NJ0Z0UCmM94C_iBjOT5IHG4qxbPdnYgqE_DKmnGQmYJlk5CFbsQ/exec";



  const API_URL =
  "https://script.google.com/macros/s/AKfycbz0TwL9xA6ZnOedNtmgXxj2pZ65Y78FXwi9-35MZ6XLx9X1aynYh38K8B7_SNPLwQJ66Q/exec";

  const params = new URLSearchParams(window.location.search);
const txnid = params.get("txnid");

if (!txnid) {
  showError("Transaction ID missing.");
} else {

  const apiUrl =
    API_URL +
    "?txnid=" +
    encodeURIComponent(txnid);

  fetch(apiUrl)
    .then(response => {

      if (!response.ok) {
        throw new Error(
          "HTTP error: " + response.status
        );
      }

      return response.json();
    })
    .then(data => {

      console.log("ORDER DATA:", data);

      if (!data.success) {
        throw new Error(
          data.message || "Order not found"
        );
      }

      // ---------------------------------
      // DISPLAY ORDER
      // ---------------------------------

      document.getElementById("txnid").textContent =
        data.txnid || "";

      document.getElementById("product").textContent =
        data.product || "";

      document.getElementById("amount").textContent =
        "₹" + (data.amount || "");

      document.getElementById("name").textContent =
        data.name || "";

      document.getElementById("email").textContent =
        data.email || "";

      document.getElementById("phone").textContent =
        data.phone || "";

      document.getElementById("status").textContent =
        data.status || "";

    })
    .catch(error => {

      console.error("ORDER ERROR:", error);

      showError(
        "Unable to retrieve order. " +
        error.message
      );
    });
}



  function showError(message) {

  document.getElementById("error").textContent =
    message;
}

</script>

</body>
</html>
