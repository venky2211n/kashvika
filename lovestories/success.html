<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>40Payment Successful</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px 20px;
      background: #f5f5f5;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,.1);
    }

    .success {
      font-size: 50px;
    }

    button {
      padding: 13px 25px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 20px;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
    }

  </style>

</head>

<body>

<div class="box">

  <div class="success">
    ✓
  </div>

  <h1>
    Payment Successful
  </h1>

  <p>
    Thank you for your purchase.
  </p>

  <p>
    Transaction ID:
  </p>

  <strong id="txnid"></strong>

  <br>

  <button
    id="downloadButton"
    disabled>

    Checking Payment...

  </button>

  <p id="message">
    Please wait...
  </p>

</div>


<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbzW10ZSw2rt_3dWP6tBMJH0N6lKYn5VKougKCuC4c0OWP6y6Z0Vq52ZCi95CULHAHkoxw/exec';


const params =
  new URLSearchParams(
    window.location.search
  );


const txnid =
  params.get('txnid');


document.getElementById(
  'txnid'
).innerText =
  txnid || '';


const button =
  document.getElementById(
    'downloadButton'
  );


const message =
  document.getElementById(
    'message'
  );


function jsonp(
  url,
  timeout = 20000
) {

  return new Promise(
    (resolve, reject) => {

      const callbackName =
        'jsonp_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          'script'
        );


      let timer;


      window[callbackName] =
        function(data) {

          cleanup();

          resolve(data);

        };


      function cleanup() {

        clearTimeout(timer);

        script.remove();

        delete window[
          callbackName
        ];

      }


      timer =
        setTimeout(
          function() {

            cleanup();

            reject(
              new Error(
                'Server timeout.'
              )
            );

          },
          timeout
        );


      script.src =
        url +
        '&callback=' +
        encodeURIComponent(
          callbackName
        );


      script.onerror =
        function() {

          cleanup();

          reject(
            new Error(
              'Unable to connect.'
            )
          );

        };


      document.body.appendChild(
        script
      );

    }
  );

}


function verifyPayment() {

  if (!txnid) {

    message.innerText =
      'Transaction ID missing.';

    button.disabled = true;

    return;

  }


  message.innerText =
    'Checking payment...';


  jsonp(

    API_URL +

    '?action=checkpayment' +

    '&txnid=' +

    encodeURIComponent(
      txnid
    )

  )

  .then(function(order) {

    console.log(
      'PAYMENT CHECK:',
      order
    );


    if (
      !order ||
      !order.success
    ) {

      throw new Error(
        'Order not found.'
      );

    }


    if (
      String(order.status)
        .trim()
        .toUpperCase()
      !== 'SUCCESS'
    ) {

      throw new Error(
        'Payment is not confirmed.'
      );

    }


    /*
     * PAYMENT CONFIRMED
     */

    message.innerText =
      'Payment confirmed. Your eBook is ready.';


    /*
     * Change button after confirmation
     */

    button.innerText =
      'Download eBook';


    button.disabled =
      false;


    button.onclick =
      function() {

        /*
         * Open your custom-domain
         * download.html
         *
         * Only txnid is required.
         */

        window.location.href =
          '/lovestories/download.html?txnid=' +
          encodeURIComponent(
            txnid
          );

      };

  })

  .catch(function(err) {

    console.error(err);


    button.disabled =
      true;


    message.innerText =
      err.message;

  });

}


verifyPayment();

</script>

</body>

</html>
