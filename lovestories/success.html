<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>Payment Successful</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px 20px;
      background: #f5f5f5;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow:
        0 5px 25px rgba(0,0,0,.1);
    }

    .success {
      font-size: 50px;
    }

    button {
      padding: 13px 25px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 20px;
    }

  </style>

</head>


<body>

<div class="box">

  <div class="success">
    ✓
  </div>

  <h1>
    Payment Successful
  </h1>

  <p>
    Thank you for your purchase.
  </p>

  <p>
    Transaction ID:
  </p>

  <strong
    id="txnid">
  </strong>


  <br>


  <button
    id="downloadButton"
    onclick="downloadBook()">

    Download eBook

  </button>


  <p id="message"></p>

</div>


<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbwTxwemIt-TRmzIJ4_88MRZqmZ4Hb56f9JKT9Un41Yq5TMSapSucVkEcz_VNI7mJvz0QQ/exec';


const params =
  new URLSearchParams(
    window.location.search
  );


const txnid =
  params.get('txnid');


document.getElementById(
  'txnid'
).innerText =
  txnid || '';


function jsonp(
  url,
  timeout = 20000
) {

  return new Promise(
    (resolve, reject) => {

      const callbackName =
        'jsonp_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          'script'
        );


      let timer;


      window[callbackName] =
        function(data) {

          cleanup();

          resolve(data);

        };


      function cleanup() {

        clearTimeout(timer);

        script.remove();

        delete window[
          callbackName
        ];
      }


      timer =
        setTimeout(
          function() {

            cleanup();

            reject(
              new Error(
                'Server timeout.'
              )
            );

          },
          timeout
        );


      script.src =
        url +
        '&callback=' +
        encodeURIComponent(
          callbackName
        );


      script.onerror =
        function() {

          cleanup();

          reject(
            new Error(
              'Unable to connect.'
            )
          );

        };


      document.body.appendChild(
        script
      );

    }
  );
}


function downloadBook() {

  if (!txnid) {

    document.getElementById(
      'message'
    ).innerText =
      'Transaction ID missing.';

    return;
  }


  document.getElementById(
    'message'
  ).innerText =
    'Checking payment...';


  /*
   * First check transaction.
   */

  jsonp(

    API_URL +

    '?action=checkpayment' +

    '&txnid=' +
    encodeURIComponent(
      txnid
    )

  )

  .then(function(order) {

    if (
      !order.success ||
      order.status !== 'SUCCESS'
    ) {

      throw new Error(
        'Payment is not confirmed.'
      );
    }


    /*
     * Redirect to download page.
     */

    window.location.href =
      'download.html?id=' +

      encodeURIComponent(
        order.bookId
      ) +

      '&txnid=' +

      encodeURIComponent(
        txnid
      );

  })

  .catch(function(err) {

    document.getElementById(
      'message'
    ).innerText =
      err.message;

  });
}

</script>

</body>

</html>
