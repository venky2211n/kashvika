<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>Checkout</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.10);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 25px;
    }

    .book {
      text-align: center;
      margin-bottom: 25px;
    }

    #bookImage {
      width: 180px;
      max-height: 250px;
      object-fit: cover;
      border-radius: 8px;
    }

    #bookTitle {
      margin-top: 15px;
      font-size: 22px;
      font-weight: bold;
    }

    #bookDescription {
      margin-top: 10px;
      color: #666;
      line-height: 1.5;
    }

    #bookPrice {
      margin-top: 15px;
      font-size: 25px;
      font-weight: bold;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #0070ba;
    }

    #paypal-button-container {
      margin-top: 25px;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
      line-height: 1.5;
      word-break: break-word;
    }

    .loading {
      text-align: center;
      padding: 30px;
    }

    .error {
      color: #c62828;
    }

    .success {
      color: #2e7d32;
    }

    .hidden {
      display: none;
    }

    .small {
      font-size: 13px;
      color: #777;
      text-align: center;
      margin-top: 20px;
    }

  </style>

</head>


<body>


<div class="container">

  <h1>Checkout</h1>


  <!-- LOADING -->

  <div
    id="loading"
    class="loading">

    Loading book...

  </div>


  <!-- CHECKOUT -->

  <div
    id="checkoutContent"
    class="hidden">


    <!-- BOOK -->

    <div class="book">

      <img
        id="bookImage"
        src=""
        alt="Book cover">

      <div
        id="bookTitle">
      </div>

      <div
        id="bookDescription">
      </div>

      <div
        id="bookPrice">
      </div>

    </div>


    <!-- CUSTOMER DETAILS -->

    <label for="name">
      Full Name
    </label>

    <input
      id="name"
      type="text"
      autocomplete="name"
      placeholder="Enter your full name">


    <label for="email">
      Email
    </label>

    <input
      id="email"
      type="email"
      autocomplete="email"
      placeholder="Enter your email">


    <label for="phone">
      Mobile Number
    </label>

    <input
      id="phone"
      type="tel"
      autocomplete="tel"
      placeholder="Enter your mobile number">


    <!-- PAYPAL -->

    <div
      id="paypal-button-container">
    </div>


    <!-- MESSAGE -->

    <div
      id="message">
    </div>


    <div class="small">
      Secure payment powered by PayPal
    </div>


  </div>

</div>



<script>


/****************************************************
 * CONFIGURATION
 ****************************************************/


/*
 * YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL
 *
 * Example:
 *
 * https://script.google.com/macros/s/XXXXXXXX/exec
 */

// const API_URL =
//   'YOUR_APPS_SCRIPT_WEB_APP_URL';



// /*
//  * YOUR PAYPAL SANDBOX CLIENT ID
//  *
//  * IMPORTANT:
//  *
//  * Client ID can be placed here.
//  *
//  * Client Secret MUST NOT be placed here.
//  */

// const PAYPAL_CLIENT_ID =
//   'YOUR_PAYPAL_SANDBOX_CLIENT_ID';

  const API_URL =
  'https://script.google.com/macros/s/AKfycbwTxwemIt-TRmzIJ4_88MRZqmZ4Hb56f9JKT9Un41Yq5TMSapSucVkEcz_VNI7mJvz0QQ/exec';


const PAYPAL_CLIENT_ID =
  'AXo3MDuy224WwNfHDZusHjW9cenuT9qI7Vh4_h_BIMb_0Ah1p5MlTafo3ZwIV67CBlrYdKbHKOiH05yQ';

/****************************************************
 * GET BOOK ID
 *
 * GitHub URL:
 *
 * checkout.html?id=101
 ****************************************************/


const urlParams =
  new URLSearchParams(
    window.location.search
  );


const bookId =
  urlParams.get('id');


console.log(
  'Book ID:',
  bookId
);



if (!bookId) {

  showError(
    'Book ID missing.'
  );

  throw new Error(
    'Book ID missing'
  );

}



/****************************************************
 * START
 ****************************************************/


loadBook();



/****************************************************
 * LOAD BOOK
 ****************************************************/


async function loadBook() {

  try {

    showMessage(
      'Loading book...'
    );


    const result =
      await apiCall(
        'checkbook',
        {

          bookId:
            bookId

        }
      );


    console.log(
      'CHECKBOOK RESULT:',
      result
    );


    if (
      !result ||
      !result.success
    ) {

      throw new Error(

        result &&
        result.error

          ? result.error

          : 'Book not found.'

      );

    }


    /*
     * Display book
     */

    document.getElementById(
      'bookTitle'
    ).textContent =
      result.product || '';


    document.getElementById(
      'bookDescription'
    ).textContent =
      result.description || '';


    document.getElementById(
      'bookPrice'
    ).textContent =
      (result.currency || '') +
      ' ' +
      (result.amount || '');


    /*
     * Image
     */

    const image =
      document.getElementById(
        'bookImage'
      );


    if (result.imageUrl) {

      image.src =
        result.imageUrl;

      image.style.display =
        'inline-block';

    }

    else {

      image.style.display =
        'none';

    }


    /*
     * Show checkout
     */

    document.getElementById(
      'loading'
    ).classList.add(
      'hidden'
    );


    document.getElementById(
      'checkoutContent'
    ).classList.remove(
      'hidden'
    );


    /*
     * Load PayPal
     */

    loadPayPal();

  }

  catch (error) {

    console.error(
      'LOAD BOOK ERROR:',
      error
    );


    showError(
      error.message
    );

  }

}



/****************************************************
 * LOAD PAYPAL SDK
 ****************************************************/


function loadPayPal() {


  /*
   * Validate Client ID
   */

  if (
    !PAYPAL_CLIENT_ID ||
    PAYPAL_CLIENT_ID ===
    'YOUR_PAYPAL_SANDBOX_CLIENT_ID'
  ) {

    showError(
      'PayPal Client ID is missing.'
    );

    return;

  }


  /*
   * Prevent duplicate SDK
   */

  if (
    document.getElementById(
      'paypal-sdk'
    )
  ) {

    renderPayPal();

    return;

  }


  const script =
    document.createElement(
      'script'
    );


  script.id =
    'paypal-sdk';


  script.src =
    'https://www.paypal.com/sdk/js' +

    '?client-id=' +
    encodeURIComponent(
      PAYPAL_CLIENT_ID
    ) +

    '&currency=USD' +

    '&intent=capture';


  script.onload =
    function() {

      console.log(
        'PayPal SDK loaded.'
      );


      renderPayPal();

    };


  script.onerror =
    function() {

      showError(
        'Unable to load PayPal SDK.'
      );

    };


  document.head.appendChild(
    script
  );

}



/****************************************************
 * RENDER PAYPAL
 ****************************************************/


function renderPayPal() {


  if (
    typeof paypal ===
    'undefined'
  ) {

    showError(
      'PayPal SDK is not available.'
    );

    return;

  }


  paypal.Buttons({


    /************************************************
     * CREATE PAYPAL ORDER
     ************************************************/

    createOrder:
      async function() {

        try {


          const name =
            document
              .getElementById(
                'name'
              )
              .value
              .trim();


          const email =
            document
              .getElementById(
                'email'
              )
              .value
              .trim();


          const phone =
            document
              .getElementById(
                'phone'
              )
              .value
              .trim();


          /*
           * Validate name
           */

          if (!name) {

            showError(
              'Please enter your full name.'
            );

            throw new Error(
              'Name is required.'
            );

          }


          /*
           * Validate email
           */

          if (!email) {

            showError(
              'Please enter your email.'
            );

            throw new Error(
              'Email is required.'
            );

          }


          if (
            !isValidEmail(
              email
            )
          ) {

            showError(
              'Please enter a valid email.'
            );

            throw new Error(
              'Invalid email.'
            );

          }


          /*
           * Validate phone
           */

          if (!phone) {

            showError(
              'Please enter your mobile number.'
            );

            throw new Error(
              'Phone is required.'
            );

          }


          showMessage(
            'Creating PayPal order...'
          );


          /*
           * Call Apps Script
           */

          const result =
            await apiCall(
              'createpaypal',
              {

                bookId:
                  bookId,

                name:
                  name,

                email:
                  email,

                phone:
                  phone

              }
            );


          console.log(
            'CREATE PAYPAL RESULT:',
            result
          );


          /*
           * Check result
           */

          if (
            !result ||
            !result.success
          ) {

            const errorMessage =
              result &&
              result.error

                ? result.error

                : 'PayPal create order failed.';


            showError(
              errorMessage
            );


            throw new Error(
              errorMessage
            );

          }


          /*
           * PayPal order ID required
           */

          if (!result.orderID) {

            showError(
              'PayPal order ID was not returned.'
            );


            throw new Error(
              'PayPal order ID missing.'
            );

          }


          /*
           * Save transaction
           */

          sessionStorage.setItem(
            'txnid',
            result.txnid || ''
          );


          sessionStorage.setItem(
            'paypalOrderID',
            result.orderID
          );


          /*
           * Give order ID to PayPal
           */

          return result.orderID;

        }

        catch (error) {

          console.error(
            'CREATE ORDER ERROR:',
            error
          );


          /*
           * PayPal requires the
           * Promise to reject.
           */

          throw error;

        }

      },


    /************************************************
     * PAYMENT APPROVED
     ************************************************/

    onApprove:
      async function(
        data
      ) {

        try {


          const txnid =
            sessionStorage.getItem(
              'txnid'
            );


          if (!txnid) {

            throw new Error(
              'Transaction ID missing.'
            );

          }


          showMessage(
            'Payment approved. Capturing payment...'
          );


          /*
           * Capture through Apps Script
           */

          const result =
            await apiCall(
              'capturepaypal',
              {

                txnid:
                  txnid,

                orderID:
                  data.orderID

              }
            );


          console.log(
            'CAPTURE RESULT:',
            result
          );


          /*
           * Check capture
           */

          if (
            !result ||
            !result.success
          ) {

            const errorMessage =
              result &&
              result.error

                ? result.error

                : 'PayPal capture failed.';


            showError(
              errorMessage
            );


            return;

          }


          /*
           * Successful payment
           */

          showSuccess(
            'Payment successful. Redirecting...'
          );


          /*
           * GitHub success page
           *
           * Example:
           *
           * /lovestories/success.html?txnid=TXN123
           */

          setTimeout(
            function() {

              window.location.href =
                'success.html?txnid=' +
                encodeURIComponent(
                  txnid
                );

            },
            500
          );


        }

        catch (error) {

          console.error(
            'CAPTURE ERROR:',
            error
          );


          showError(
            'Payment capture error: ' +
            error.message
          );

        }

      },


    /************************************************
     * CANCEL
     ************************************************/

    onCancel:
      function(data) {

        console.log(
          'PAYPAL CANCELLED:',
          data
        );


        showMessage(
          'Payment cancelled.'
        );

      },


    /************************************************
     * PAYPAL ERROR
     ************************************************/

    onError:
      function(error) {

        console.error(
          'PAYPAL ERROR:',
          error
        );


        let message =
          'PayPal payment error.';


        if (
          error &&
          error.message
        ) {

          message +=
            ' ' +
            error.message;

        }


        showError(
          message
        );

      }


  }).render(
    '#paypal-button-container'
  );

}



/****************************************************
 * JSONP API CALL
 *
 * GitHub Pages
 *      ↓
 * Apps Script
 ****************************************************/


function apiCall(
  action,
  params
) {


  return new Promise(
    function(resolve, reject) {


      /*
       * Unique callback name
       */

      const callbackName =
        'paypalCallback_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 1000000
        );


      /*
       * Script element
       */

      const script =
        document.createElement(
          'script'
        );


      let finished =
        false;


      /*
       * Timeout
       */

      const timeout =
        setTimeout(
          function() {


            if (finished)
              return;


            finished =
              true;


            delete window[
              callbackName
            ];


            script.remove();


            reject(
              new Error(
                'Apps Script request timed out.'
              )
            );


          },
          30000
        );


      /*
       * Callback
       */

      window[
        callbackName
      ] =
        function(result) {


          if (finished)
            return;


          finished =
            true;


          clearTimeout(
            timeout
          );


          delete window[
            callbackName
          ];


          script.remove();


          resolve(
            result
          );

        };


      /*
       * Build URL
       */

      const query =
        new URLSearchParams();


      query.set(
        'action',
        action
      );


      query.set(
        'callback',
        callbackName
      );


      Object.keys(
        params || {}
      ).forEach(
        function(key) {


          const value =
            params[key];


          if (
            value !== undefined &&
            value !== null
          ) {

            query.set(
              key,
              value
            );

          }

        }
      );


      /*
       * Apps Script URL
       */

      script.src =
        API_URL +
        '?' +
        query.toString();


      /*
       * Network error
       */

      script.onerror =
        function() {


          if (finished)
            return;


          finished =
            true;


          clearTimeout(
            timeout
          );


          delete window[
            callbackName
          ];


          script.remove();


          reject(
            new Error(
              'Could not connect to Apps Script.'
            )
          );

        };


      /*
       * Start request
       */

      document.body.appendChild(
        script
      );

    }
  );

}



/****************************************************
 * EMAIL VALIDATION
 ****************************************************/


function isValidEmail(
  email
) {

  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
    .test(email);

}



/****************************************************
 * SHOW MESSAGE
 ****************************************************/


function showMessage(
  message
) {


  const element =
    document.getElementById(
      'message'
    );


  element.className =
    '';


  element.textContent =
    message;

}



/****************************************************
 * SHOW SUCCESS
 ****************************************************/


function showSuccess(
  message
) {


  const element =
    document.getElementById(
      'message'
    );


  element.className =
    'success';


  element.textContent =
    message;

}



/****************************************************
 * SHOW ERROR
 ****************************************************/


function showError(
  message
) {


  const loading =
    document.getElementById(
      'loading'
    );


  if (loading) {

    loading.classList.add(
      'hidden'
    );

  }


  const content =
    document.getElementById(
      'checkoutContent'
    );


  if (content) {

    content.classList.remove(
      'hidden'
    );

  }


  const element =
    document.getElementById(
      'message'
    );


  if (element) {

    element.className =
      'error';


    element.textContent =
      message;

  }

}


</script>


</body>

</html>
