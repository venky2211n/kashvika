










<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>Checkout</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .checkout-container {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,.10);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .book {
      text-align: center;
      margin-bottom: 25px;
    }

    .book img {
      max-width: 180px;
      max-height: 240px;
      border-radius: 8px;
      object-fit: cover;
    }

    .book-title {
      font-size: 22px;
      font-weight: bold;
      margin-top: 15px;
    }

    .book-description {
      margin-top: 10px;
      color: #666;
      line-height: 1.5;
    }

    .price {
      margin-top: 15px;
      font-size: 24px;
      font-weight: bold;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    #paypal-button-container {
      margin-top: 25px;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }

    .loading {
      text-align: center;
      padding: 30px;
    }

    .error {
      color: #c62828;
    }

    .success {
      color: #2e7d32;
    }

    .hidden {
      display: none;
    }

  </style>

</head>


<body>


<div class="checkout-container">

  <h1>Checkout</h1>


  <!-- BOOK INFORMATION -->

  <div id="loading" class="loading">
    Loading book...
  </div>


  <div id="checkoutContent" class="hidden">


    <div class="book">

      <img
        id="bookImage"
        src=""
        alt="Book">

      <div
        id="bookTitle"
        class="book-title">
      </div>

      <div
        id="bookDescription"
        class="book-description">
      </div>

      <div
        id="bookPrice"
        class="price">
      </div>

    </div>


    <!-- CUSTOMER DETAILS -->

    <label for="name">
      Full Name
    </label>

    <input
      id="name"
      type="text"
      placeholder="Enter your full name"
      autocomplete="name">


    <label for="email">
      Email
    </label>

    <input
      id="email"
      type="email"
      placeholder="Enter your email"
      autocomplete="email">


    <label for="phone">
      Mobile Number
    </label>

    <input
      id="phone"
      type="tel"
      placeholder="Enter your mobile number"
      autocomplete="tel">


    <!-- PAYPAL -->

    <div
      id="paypal-button-container">
    </div>


    <div id="message"></div>


  </div>

</div>



<script>


/****************************************************
 * CONFIGURATION
 ****************************************************/


// // YOUR GOOGLE APPS SCRIPT WEB APP URL
// const API_URL =
//   'YOUR_APPS_SCRIPT_WEB_APP_URL';


// // YOUR PAYPAL SANDBOX CLIENT ID
// const PAYPAL_CLIENT_ID =
//   'YOUR_PAYPAL_SANDBOX_CLIENT_ID';


  const API_URL =
  'https://script.google.com/macros/s/AKfycbwTxwemIt-TRmzIJ4_88MRZqmZ4Hb56f9JKT9Un41Yq5TMSapSucVkEcz_VNI7mJvz0QQ/exec';


const PAYPAL_CLIENT_ID =
  'AXo3MDuy224WwNfHDZusHjW9cenuT9qI7Vh4_h_BIMb_0Ah1p5MlTafo3ZwIV67CBlrYdKbHKOiH05yQ';



/****************************************************
 * GET BOOK ID FROM URL
 *
 * checkout.html?id=101
 ****************************************************/


const urlParams =
  new URLSearchParams(
    window.location.search
  );


const bookId =
  urlParams.get('id');


if (!bookId) {

  showError(
    'Book ID missing.'
  );

  throw new Error(
    'Book ID missing'
  );
}



/****************************************************
 * LOAD BOOK
 ****************************************************/


loadBook();



async function loadBook() {

  try {

    showMessage(
      'Loading book...'
    );


    const result =
      await apiCall(
        'checkbook',
        {
          bookId: bookId
        }
      );


    console.log(
      'BOOK RESULT:',
      result
    );


    if (
      !result ||
      !result.success
    ) {

      throw new Error(
        result &&
        result.error
          ? result.error
          : 'Book not found.'
      );

    }


    displayBook(
      result
    );


    document
      .getElementById(
        'loading'
      )
      .classList
      .add('hidden');


    document
      .getElementById(
        'checkoutContent'
      )
      .classList
      .remove('hidden');


    loadPayPal();

  }

  catch (error) {

    console.error(
      'BOOK ERROR:',
      error
    );


    showError(
      error.message
    );

  }

}



/****************************************************
 * DISPLAY BOOK
 ****************************************************/


function displayBook(book) {


  document.getElementById(
    'bookTitle'
  ).textContent =
    book.product || '';


  document.getElementById(
    'bookDescription'
  ).textContent =
    book.description || '';


  document.getElementById(
    'bookPrice'
  ).textContent =
    book.currency +
    ' ' +
    book.amount;


  const image =
    document.getElementById(
      'bookImage'
    );


  if (book.imageUrl) {

    image.src =
      book.imageUrl;

    image.style.display =
      'inline-block';

  }

  else {

    image.style.display =
      'none';

  }

}



/****************************************************
 * LOAD PAYPAL SDK
 ****************************************************/


function loadPayPal() {


  if (
    document.getElementById(
      'paypal-sdk'
    )
  ) {

    renderPayPal();

    return;

  }


  const script =
    document.createElement(
      'script'
    );


  script.id =
    'paypal-sdk';


  script.src =
    'https://www.paypal.com/sdk/js' +
    '?client-id=' +
    encodeURIComponent(
      PAYPAL_CLIENT_ID
    ) +
    '&currency=USD' +
    '&intent=capture';


  script.onload =
    function() {

      console.log(
        'PayPal SDK loaded'
      );


      renderPayPal();

    };


  script.onerror =
    function() {

      showError(
        'Unable to load PayPal.'
      );

    };


  document.head.appendChild(
    script
  );

}



/****************************************************
 * PAYPAL BUTTONS
 ****************************************************/


function renderPayPal() {


  paypal.Buttons({


    /************************************************
     * CREATE ORDER
     ************************************************/

    createOrder:
      async function() {


        const name =
          document
            .getElementById(
              'name'
            )
            .value
            .trim();


        const email =
          document
            .getElementById(
              'email'
            )
            .value
            .trim();


        const phone =
          document
            .getElementById(
              'phone'
            )
            .value
            .trim();


        if (!name) {

          showError(
            'Please enter your name.'
          );

          throw new Error(
            'Name required'
          );

        }


        if (!email) {

          showError(
            'Please enter your email.'
          );

          throw new Error(
            'Email required'
          );

        }


        if (!isValidEmail(email)) {

          showError(
            'Please enter a valid email.'
          );

          throw new Error(
            'Invalid email'
          );

        }


        if (!phone) {

          showError(
            'Please enter your mobile number.'
          );

          throw new Error(
            'Phone required'
          );

        }


        showMessage(
          'Creating PayPal order...'
        );


        const result =
          await apiCall(
            'createpaypal',
            {

              bookId:
                bookId,

              name:
                name,

              email:
                email,

              phone:
                phone

            }
          );


        console.log(
          'CREATE PAYPAL RESULT:',
          result
        );


        if (
          !result ||
          !result.success
        ) {

          throw new Error(
            result &&
            result.error
              ? result.error
              : 'Unable to create PayPal order.'
          );

        }


        if (!result.orderID) {

          throw new Error(
            'PayPal order ID was not returned.'
          );

        }


        /*
         * Save transaction ID
         */

        sessionStorage.setItem(
          'txnid',
          result.txnid || ''
        );


        sessionStorage.setItem(
          'paypalOrderID',
          result.orderID
        );


        return result.orderID;

      },


    /************************************************
     * PAYMENT APPROVED
     ************************************************/

    onApprove:
      async function(
        data,
        actions
      ) {


        const txnid =
          sessionStorage.getItem(
            'txnid'
          );


        showMessage(
          'Payment approved. Processing...'
        );


        try {


          const result =
            await apiCall(
              'capturepaypal',
              {

                txnid:
                  txnid,

                orderID:
                  data.orderID

              }
            );


          console.log(
            'CAPTURE RESULT:',
            result
          );


          if (
            !result ||
            !result.success
          ) {

            throw new Error(
              result &&
              result.error
                ? result.error
                : 'Payment capture failed.'
            );

          }


          /*
           * Payment successful
           */

          showSuccess(
            'Payment successful. Redirecting...'
          );


          /*
           * GitHub success page
           *
           * Example:
           * /lovestories/success.html?txnid=TXN123
           */

          window.location.href =
            'success.html?txnid=' +
            encodeURIComponent(
              txnid
            );

        }

        catch (error) {

          console.error(
            'CAPTURE ERROR:',
            error
          );


          showError(
            'Payment capture error: ' +
            error.message
          );

        }

      },


    /************************************************
     * CANCEL
     ************************************************/

    onCancel:
      function(data) {

        console.log(
          'PayPal cancelled:',
          data
        );


        showMessage(
          'Payment cancelled.'
        );

      },


    /************************************************
     * PAYPAL ERROR
     ************************************************/

    onError:
      function(error) {

        console.error(
          'PAYPAL ERROR:',
          error
        );


        showError(
          'PayPal payment error: ' +
          (
            error &&
            error.message
              ? error.message
              : 'Unknown error'
          )
        );

      }

  }).render(
    '#paypal-button-container'
  );

}



/****************************************************
 * JSONP API CALL
 *
 * GitHub Pages
 *      ↓
 * Google Apps Script
 ****************************************************/


function apiCall(
  action,
  params
) {


  return new Promise(
    function(resolve, reject) {


      const callbackName =
        'jsonpCallback_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          'script'
        );


      let finished =
        false;


      /*
       * Timeout
       */

      const timer =
        setTimeout(
          function() {

            if (finished)
              return;


            finished = true;


            delete window[
              callbackName
            ];


            script.remove();


            reject(
              new Error(
                'Apps Script request timed out.'
              )
            );

          },
          30000
        );


      /*
       * JSONP callback
       */

      window[
        callbackName
      ] =
        function(result) {


          if (finished)
            return;


          finished = true;


          clearTimeout(
            timer
          );


          delete window[
            callbackName
          ];


          script.remove();


          resolve(
            result
          );

        };


      /*
       * Build URL
       */

      const query =
        new URLSearchParams();


      query.set(
        'action',
        action
      );


      query.set(
        'callback',
        callbackName
      );


      Object.keys(
        params || {}
      ).forEach(
        function(key) {

          const value =
            params[key];


          if (
            value !== undefined &&
            value !== null
          ) {

            query.set(
              key,
              value
            );

          }

        }
      );


      script.src =
        API_URL +
        '?' +
        query.toString();


      script.onerror =
        function() {


          if (finished)
            return;


          finished = true;


          clearTimeout(
            timer
          );


          delete window[
            callbackName
          ];


          script.remove();


          reject(
            new Error(
              'Could not connect to Apps Script.'
            )
          );

        };


      document.body.appendChild(
        script
      );

    }
  );

}



/****************************************************
 * EMAIL VALIDATION
 ****************************************************/


function isValidEmail(
  email
) {

  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
    .test(email);

}



/****************************************************
 * MESSAGE FUNCTIONS
 ****************************************************/


function showMessage(
  message
) {

  const element =
    document.getElementById(
      'message'
    );


  element.className =
    '';


  element.textContent =
    message;

}



function showSuccess(
  message
) {

  const element =
    document.getElementById(
      'message'
    );


  element.className =
    'success';


  element.textContent =
    message;

}



function showError(
  message
) {

  const loading =
    document.getElementById(
      'loading'
    );


  if (loading) {

    loading.classList
      .add('hidden');

  }


  const content =
    document.getElementById(
      'checkoutContent'
    );


  if (content) {

    content.classList
      .remove('hidden');

  }


  const element =
    document.getElementById(
      'message'
    );


  if (element) {

    element.className =
      'error';


    element.textContent =
      message;

  }

}

</script>

</body>
</html>
