function jsonp(
  url,
  timeout = 20000
) {

  return new Promise(
    (resolve, reject) => {

      const callbackName =
        'jsonp_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          'script'
        );


      let timer;


      window[callbackName] =
        function(data) {

          cleanup();

          resolve(data);

        };


      function cleanup() {

        clearTimeout(timer);

        script.remove();

        delete window[
          callbackName
        ];
      }


      timer =
        setTimeout(
          function() {

            cleanup();

            reject(
              new Error(
                'Server timeout.'
              )
            );

          },
          timeout
        );


      script.src =
        url +
        '&callback=' +
        encodeURIComponent(
          callbackName
        );


      script.onerror =
        function() {

          cleanup();

          reject(
            new Error(
              'Unable to connect.'
            )
          );

        };


      document.body.appendChild(
        script
      );

    }
  );
}


function prepareDownload() {

  if (!bookId || !txnid) {

    throw new Error(
      'Invalid download link.'
    );
  }


  const url =
    API_URL +

    '?action=download' +

    '&id=' +
    encodeURIComponent(
      bookId
    ) +

    '&txnid=' +
    encodeURIComponent(
      txnid
    );

      if (!result.success) {

        throw new Error(
          result.error ||
          'Download unavailable.'
        );
      }


      document.getElementById(
        'message'
      ).innerText =
        result.fileName;


      const link =
        document.getElementById(
          'downloadLink'
        );


      link.href =
        result.downloadUrl;


      link.download =
        result.fileName;


      link.style.display =
        'inline-block';

    })

    .catch(function(err) {

      document.getElementById(
        'message'
      ).innerText =
        err.message;

    });

}


prepareDownload();

</script>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>80eBook Download</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px 20px;
      background: #f5f5f5;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 35px;
      border-radius: 12px;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }

    button {
      padding: 14px 28px;
      font-size: 17px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>eBook Download</h2>

  <div id="message">
    Verifying payment...
  </div>

  <div id="downloadArea"></div>

</div>


<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbxIhGptH4YTukkyG85DYe-lR_2QltxrLN_arRxSMUnv1fUOnAKgrUr2syUtSDF_5N0J9w/exec';


const txnid =
  new URLSearchParams(
    window.location.search
  ).get('txnid');


if (!txnid) {

  showError(
    'Transaction ID missing.'
  );

} else {

  checkPayment();

}


function checkPayment() {

  const callbackName =
    'download_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() * 100000
    );


  const script =
    document.createElement('script');


  window[callbackName] =
    function(result) {

      console.log(
        'SERVER RESULT:',
        result
      );


      delete window[callbackName];

      script.remove();


      if (
        !result ||
        result.success !== true
      ) {

        showError(
          result &&
          result.error
            ? result.error
            : 'Payment is not confirmed.'
        );

        return;

      }


      document.getElementById(
        'message'
      ).innerHTML =

        '<div class="success">' +
        '<h3>Payment Confirmed ✓</h3>' +
        '<p>' +
        result.product +
        '</p>' +
        '</div>';


      const button =
        document.createElement(
          'button'
        );


      button.innerText =
        'Download eBook';


      button.onclick =
        function() {

          window.location.href =
            result.downloadUrl;

        };


      document.getElementById(
        'downloadArea'
      ).appendChild(button);

    };


  const url =
    API_URL +
    '?action=checkdownload' +
    '&txnid=' +
    encodeURIComponent(txnid) +
    '&callback=' +
    encodeURIComponent(callbackName);


  console.log(
    'REQUEST:',
    url
  );


  script.src =
    url;


  script.onerror =
    function() {

      delete window[callbackName];

      script.remove();

      showError(
        'Unable to connect to payment server.'
      );

    };


  document.body.appendChild(
    script
  );


  setTimeout(
    function() {

      if (
        window[callbackName]
      ) {

        delete window[callbackName];

        script.remove();

        showError(
          'Payment server did not respond.'
        );

      }

    },
    20000
  );

}


function showError(message) {

  document.getElementById(
    'message'
  ).innerHTML =

    '<div class="error">' +
    '<h3>Download unavailable</h3>' +
    '<p>' +
    message +
    '</p>' +
    '</div>';

}

</script>

</body>
</html>
