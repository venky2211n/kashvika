<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>Download eBook</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px 20px;
    }

    .box {
      max-width: 500px;
      margin: auto;
    }

    button {
      padding: 14px 25px;
      font-size: 16px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

  </style>

</head>


<body>


<div class="box">

  <h1>
    Preparing your eBook...
  </h1>


  <p id="message">
    Please wait...
  </p>


  <a
    id="downloadLink"
    style="display:none;">

    Download eBook

  </a>

</div>


<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbwSqr3ELAmy-hRRrztOJaNkk3IUNouVliNEj5lP77GO2Oi_mmtV1tWILqsYohL_FXCDZg/exec';


const params =
  new URLSearchParams(
    window.location.search
  );


const bookId =
  params.get('id');


const txnid =
  params.get('txnid');


function jsonp(
  url,
  timeout = 20000
) {

  return new Promise(
    (resolve, reject) => {

      const callbackName =
        'jsonp_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          'script'
        );


      let timer;


      window[callbackName] =
        function(data) {

          cleanup();

          resolve(data);

        };


      function cleanup() {

        clearTimeout(timer);

        script.remove();

        delete window[
          callbackName
        ];
      }


      timer =
        setTimeout(
          function() {

            cleanup();

            reject(
              new Error(
                'Server timeout.'
              )
            );

          },
          timeout
        );


      script.src =
        url +
        '&callback=' +
        encodeURIComponent(
          callbackName
        );


      script.onerror =
        function() {

          cleanup();

          reject(
            new Error(
              'Unable to connect.'
            )
          );

        };


      document.body.appendChild(
        script
      );

    }
  );
}


function prepareDownload() {

  if (!bookId || !txnid) {

    throw new Error(
      'Invalid download link.'
    );
  }


  const url =
    API_URL +

    '?action=download' +

    '&id=' +
    encodeURIComponent(
      bookId
    ) +

    '&txnid=' +
    encodeURIComponent(
      txnid
    );


  jsonp(url)

    .then(function(result) {

      if (!result.success) {

        throw new Error(
          result.error ||
          'Download unavailable.'
        );
      }


      document.getElementById(
        'message'
      ).innerText =
        result.fileName;


      const link =
        document.getElementById(
          'downloadLink'
        );


      link.href =
        result.downloadUrl;


      link.download =
        result.fileName;


      link.style.display =
        'inline-block';

    })

    .catch(function(err) {

      document.getElementById(
        'message'
      ).innerText =
        err.message;

    });

}


prepareDownload();

</script>


</body>

</html>
