<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Download eBook</title>

<style>

body {
  margin: 0;
  padding: 30px 20px;
  font-family: Arial, sans-serif;
  background: #f4f5f7;
}

.container {
  max-width: 600px;
  margin: 50px auto;
}

.card {
  background: white;
  padding: 35px;
  border-radius: 14px;
  text-align: center;
  box-shadow:
    0 5px 25px rgba(0,0,0,.10);
}

.icon {
  font-size: 55px;
}

button {
  width: 100%;
  margin-top: 25px;
  padding: 15px;
  border: 0;
  border-radius: 8px;
  background: #111;
  color: white;
  font-size: 17px;
  cursor: pointer;
}

#error {
  color: red;
}

</style>

</head>


<body>


<div class="container">

<div class="card">


<div class="icon">
📚
</div>


<h1>
eBook Download
</h1>


<p id="status">
Checking your payment...
</p>


<p id="error"></p>


<button
id="downloadButton"
style="display:none"
onclick="startDownload()">

Download eBook

</button>


</div>

</div>

<script>

const API_URL =
'https://script.google.com/macros/s/AKfycbzlUW6v54TKv7pu02GUaRomct3EcD4rI6C9_3dMqE_2-WNBGUb1aDCDu5PRz4CRF4Z2CA/exec';

const params =
new URLSearchParams(window.location.search);

const bookId =
params.get('id');

const txnid =
params.get('txnid');


function jsonp(url) {

    return new Promise(function(resolve, reject) {

        const callbackName =
            'callback_' +
            Date.now();

        const script =
            document.createElement('script');

        const timeout =
            setTimeout(function() {

                cleanup();

                reject(
                    new Error('Server timeout')
                );

            }, 20000);


        function cleanup() {

            clearTimeout(timeout);

            delete window[callbackName];

            script.remove();

        }


        window[callbackName] =
            function(data) {

                cleanup();

                resolve(data);

            };


        script.onerror =
            function() {

                cleanup();

                reject(
                    new Error(
                        'Unable to connect to server'
                    )
                );

            };


        script.src =
            url +
            '&callback=' +
            encodeURIComponent(
                callbackName
            );


        document.body.appendChild(script);

    });

}


async function verifyAndDownload() {

    try {

        if (!bookId) {
            throw new Error('Book ID missing.');
        }

        if (!txnid) {
            throw new Error('Transaction ID missing.');
        }


        /*
         * BACKGROUND VERIFICATION
         */

        const result =
            await jsonp(

                API_URL +

                '?options=checkpayment' +

                '&id=' +
                encodeURIComponent(bookId) +

                '&txnid=' +
                encodeURIComponent(txnid)

            );


        if (!result.success) {

            throw new Error(
                result.error ||
                'Order not found.'
            );

        }


        /*
         * VERIFY BOOK
         */

        if (
            String(result.bookId) !==
            String(bookId)
        ) {

            throw new Error(
                'Book ID does not match.'
            );

        }


        /*
         * VERIFY PAYMENT
         */

        if (
            String(result.status).toUpperCase() !==
            'SUCCESS'
        ) {

            throw new Error(
                'Payment is not confirmed.'
            );

        }


        /*
         * FILE ID FROM ORDERS COLUMN K
         */

        const fileId =
            String(
                result.fileId || ''
            ).trim();


        if (!fileId) {

            throw new Error(
                'File ID is missing.'
            );

        }


        /*
         * DOWNLOAD URL
         */

        const downloadUrl =

            'https://drive.google.com/uc' +

            '?export=download' +

            '&id=' +
            encodeURIComponent(fileId);


        /*
         * HIDDEN IFRAME
         *
         * NO NEW TAB
         * NO NEW WINDOW
         * NO PAGE REDIRECT
         */

        const iframe =
            document.createElement('iframe');

        iframe.style.display =
            'none';

        iframe.style.width =
            '1px';

        iframe.style.height =
            '1px';

        iframe.src =
            downloadUrl;


        document.body.appendChild(
            iframe
        );


        /*
         * KEEP download.html OPEN
         */

        document.getElementById(
            'status'
        ).innerText =
            'Your eBook download has started.';


    } catch (error) {

        document.getElementById(
            'status'
        ).innerText =
            'Download unavailable.';

        document.getElementById(
            'error'
        ).innerText =
            error.message;

    }

}


verifyAndDownload();

</script>

</body>

</html>
