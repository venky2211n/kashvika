<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Checkout - KASHVIKA eBooks</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 5px 25px rgba(0,0,0,.10);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      font-size: 28px;
    }

    .book {
      background: #f7f8fa;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .book-title {
      font-size: 20px;
      font-weight: bold;
    }

    .price {
      margin-top: 8px;
      font-size: 22px;
      font-weight: bold;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #007bff;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: 0;
      border-radius: 8px;
      background: #007bff;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #005fc7;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 7px;
      display: none;
    }

    .error {
      background: #ffe5e5;
      color: #b00000;
    }

    .loading {
      text-align: center;
      display: none;
      margin-top: 20px;
    }

    .spinner {
      width: 35px;
      height: 35px;
      border: 4px solid #ddd;
      border-top: 4px solid #007bff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: auto;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    .secure {
      margin-top: 20px;
      text-align: center;
      color: #666;
      font-size: 13px;
    }

  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>eBook Checkout</h1>

    <div class="book">

      <div id="bookTitle"
           class="book-title">
        Loading book...
      </div>

      <div id="bookPrice"
           class="price">
      </div>

    </div>


    <label for="name">
      Full Name
    </label>

    <input
      type="text"
      id="name"
      placeholder="Enter your full name"
      autocomplete="name"
    >


    <label for="email">
      Email Address
    </label>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      autocomplete="email"
    >


    <label for="phone">
      Mobile Number
    </label>

    <input
      type="tel"
      id="phone"
      placeholder="Enter mobile number"
      autocomplete="tel"
    >


    <button
      id="payButton"
      onclick="proceedToPayment()">

      Proceed to Pay

    </button>


    <div id="loading"
         class="loading">

      <div class="spinner"></div>

      <p>
        Creating secure payment...
      </p>

    </div>


    <div id="error"
         class="message error">
    </div>


    <div class="secure">
      🔒 Secure payment powered by Instamojo
    </div>

  </div>

</div>


<script>

  /*
   * YOUR GOOGLE APPS SCRIPT WEB APP URL
   *
   * Example:
   *
   * https://script.google.com/macros/s/XXXXXXXXXXXX/exec
   */

  const API_URL =
    "YOUR_APPS_SCRIPT_EXEC_URL";


  /*
   * Get Book ID from:
   *
   * checkout.html?id=101
   */

  const params =
    new URLSearchParams(window.location.search);

  const bookId =
    params.get("id");


  /*
   * Load book information
   */

  async function loadBook() {

    if (!bookId) {

      showError(
        "Book ID is missing."
      );

      return;
    }


    try {

      const url =
        API_URL +
        "?options=book&id=" +
        encodeURIComponent(bookId);


      const response =
        await fetch(url, {
          method: "GET"
        });


      const result =
        await response.json();


      if (!result.success) {

        showError(
          result.error ||
          "Unable to load book."
        );

        return;
      }


      document.getElementById(
        "bookTitle"
      ).textContent =
        result.title;


      document.getElementById(
        "bookPrice"
      ).textContent =
        "₹" + result.price;

    }

    catch (error) {

      console.error(error);

      showError(
        "Unable to connect to the server."
      );

    }

  }


  /*
   * Start payment
   */

  async function proceedToPayment() {

    hideError();


    const name =
      document
        .getElementById("name")
        .value
        .trim();


    const email =
      document
        .getElementById("email")
        .value
        .trim();


    const phone =
      document
        .getElementById("phone")
        .value
        .trim();


    /*
     * Validation
     */

    if (!name) {

      showError(
        "Please enter your full name."
      );

      return;
    }


    if (!email) {

      showError(
        "Please enter your email address."
      );

      return;
    }


    if (!isValidEmail(email)) {

      showError(
        "Please enter a valid email address."
      );

      return;
    }


    if (!phone) {

      showError(
        "Please enter your mobile number."
      );

      return;
    }


    const cleanPhone =
      phone.replace(/\D/g, "");


    if (
      cleanPhone.length < 10
    ) {

      showError(
        "Please enter a valid mobile number."
      );

      return;
    }


    /*
     * Disable button
     */

    const button =
      document.getElementById(
        "payButton"
      );

    button.disabled = true;

    document.getElementById(
      "loading"
    ).style.display = "block";


    try {

      /*
       * Send POST to Apps Script
       */

      const formData =
        new URLSearchParams();

      formData.append(
        "options",
        "createpayment"
      );

      formData.append(
        "bookId",
        bookId
      );

      formData.append(
        "name",
        name
      );

      formData.append(
        "email",
        email
      );

      formData.append(
        "phone",
        cleanPhone
      );


      const response =
        await fetch(
          API_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/x-www-form-urlencoded"
            },

            body: formData.toString()
          }
        );


      const result =
        await response.json();


      console.log(
        "Payment response:",
        result
      );


      if (
        !result.success ||
        !result.paymentUrl
      ) {

        throw new Error(
          result.error ||
          "Unable to create payment."
        );
      }


      /*
       * Save transaction ID locally.
       *
       * Useful if browser returns to
       * success.html.
       */

      localStorage.setItem(
        "ebook_txnid",
        result.txnid
      );


      localStorage.setItem(
        "ebook_book_id",
        bookId
      );


      /*
       * Send customer to Instamojo
       */

      window.location.href =
        result.paymentUrl;

    }

    catch (error) {

      console.error(error);

      showError(
        error.message ||
        "Unable to connect to payment server."
      );


      button.disabled = false;

      document.getElementById(
        "loading"
      ).style.display = "none";

    }

  }


  function isValidEmail(email) {

    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
      .test(email);

  }


  function showError(message) {

    const box =
      document.getElementById(
        "error"
      );

    box.textContent = message;

    box.style.display = "block";

  }


  function hideError() {

    document.getElementById(
      "error"
    ).style.display = "none";

  }


  /*
   * Start
   */

  loadBook();

</script>

</body>
</html>
