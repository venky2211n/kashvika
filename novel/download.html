<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Download eBook - KASHVIKA</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,.10);
    }

    .icon {
      font-size: 60px;
      margin-bottom: 15px;
    }

    h1 {
      margin-top: 0;
    }

    .book {
      margin: 20px 0;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
    }

    .book-title {
      font-size: 20px;
      font-weight: bold;
    }

    .txn {
      margin-top: 10px;
      font-family: monospace;
      word-break: break-all;
      color: #666;
    }

    .download-button {
      display: none;
      margin-top: 25px;
    }

    .download-button a {
      display: block;
      padding: 16px;
      background: #16803c;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
    }

    .download-button a:hover {
      background: #10642e;
    }

    .error {
      color: #c00000;
      margin-top: 20px;
    }

    .spinner {
      width: 45px;
      height: 45px;
      border: 5px solid #ddd;
      border-top: 5px solid #007bff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {

      100% {
        transform: rotate(360deg);
      }

    }

  </style>

</head>


<body>

<div class="container">

  <div class="card">

    <div
      id="icon"
      class="icon">

      📚

    </div>


    <h1 id="title">

      Verifying Download

    </h1>


    <div
      id="spinner"
      class="spinner">
    </div>


    <div
      id="book"
      class="book"
      style="display:none">

      <div
        id="bookTitle"
        class="book-title">
      </div>

      <div
        id="txnid"
        class="txn">
      </div>

    </div>


    <p
      id="message">

      Please wait while we verify your purchase...

    </p>


    <div
      id="downloadBox"
      class="download-button">

      <a
        id="downloadLink"
        href="#"
        target="_blank">

        📥 Download eBook

      </a>

    </div>


    <div
      id="error"
      class="error">
    </div>

  </div>

</div>


<script>

  /*
   * Apps Script Web App
   */

  const API_URL =
    "YOUR_APPS_SCRIPT_EXEC_URL";


  /*
   * URL:
   *
   * download.html?id=101&txnid=TXN123
   */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const bookId =
    params.get("id");


  const txnid =
    params.get("txnid");


  /*
   * Verify order
   */

  async function verifyDownload() {

    if (!bookId) {

      showError(
        "Book ID is missing."
      );

      return;
    }


    if (!txnid) {

      showError(
        "Transaction ID is missing."
      );

      return;
    }


    try {

      const url =
        API_URL +
        "?options=download" +
        "&id=" +
        encodeURIComponent(bookId) +
        "&txnid=" +
        encodeURIComponent(txnid);


      const response =
        await fetch(
          url,
          {
            method: "GET",
            cache: "no-store"
          }
        );


      const result =
        await response.json();


      console.log(
        "Download verification:",
        result
      );


      if (
        !result.success
      ) {

        showError(
          result.error ||
          "Download is not available."
        );

        return;
      }


      /*
       * IMPORTANT:
       *
       * Apps Script should return
       * downloadUrl only after verifying:
       *
       * 1. transaction exists
       * 2. status = SUCCESS
       * 3. Book ID matches
       * 4. File ID exists
       */

      document.getElementById(
        "spinner"
      ).style.display =
        "none";


      document.getElementById(
        "icon"
      ).textContent =
        "✅";


      document.getElementById(
        "title"
      ).textContent =
        "Your eBook is Ready";


      document.getElementById(
        "message"
      ).textContent =
        "Your payment has been verified successfully.";


      document.getElementById(
        "book"
      ).style.display =
        "block";


      document.getElementById(
        "bookTitle"
      ).textContent =
        result.product ||
        "eBook";


      document.getElementById(
        "txnid"
      ).textContent =
        "Transaction: " + txnid;


      /*
       * Download URL supplied by Apps Script
       */

      document.getElementById(
        "downloadLink"
      ).href =
        result.downloadUrl;


      document.getElementById(
        "downloadBox"
      ).style.display =
        "block";

    }

    catch (error) {

      console.error(error);

      showError(
        "Unable to verify your purchase."
      );

    }

  }


  function showError(
    message
  ) {

    document.getElementById(
      "spinner"
    ).style.display =
      "none";


    document.getElementById(
      "icon"
    ).textContent =
      "❌";


    document.getElementById(
      "title"
    ).textContent =
      "Download Unavailable";


    document.getElementById(
      "message"
    ).textContent =
      "";


    document.getElementById(
      "error"
    ).textContent =
      message;

  }


  /*
   * Start verification
   */

  verifyDownload();

</script>

</body>
</html>
