<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Payment Status - KASHVIKA eBooks</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,.10);
    }

    .icon {
      font-size: 60px;
      margin-bottom: 15px;
    }

    .waiting {
      color: #555;
    }

    .success {
      color: #16803c;
    }

    .failed {
      color: #c00000;
    }

    h1 {
      margin-top: 0;
    }

    .txn {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 7px;
      word-break: break-all;
      margin: 20px 0;
      font-family: monospace;
    }

    .spinner {
      width: 45px;
      height: 45px;
      border: 5px solid #ddd;
      border-top: 5px solid #007bff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {

      100% {
        transform: rotate(360deg);
      }

    }

    .download {
      display: none;
      margin-top: 25px;
    }

    .download a {
      display: block;
      padding: 15px;
      background: #16803c;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
    }

    .download a:hover {
      background: #10642e;
    }

    .message {
      margin-top: 15px;
      color: #666;
    }

    .retry {
      margin-top: 20px;
    }

    .retry button {
      padding: 10px 20px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

  </style>

</head>


<body>

<div class="container">

  <div class="card">

    <div
      id="icon"
      class="icon">
      ⏳
    </div>


    <h1 id="title"
        class="waiting">

      Checking Payment...

    </h1>


    <div class="txn">

      Transaction ID:

      <br>

      <strong id="txnid">
        Loading...
      </strong>

    </div>


    <div
      id="spinner"
      class="spinner">
    </div>


    <p
      id="message"
      class="message">

      We are confirming your payment.
      Please wait...

    </p>


    <div
      id="downloadBox"
      class="download">

      <a
        id="downloadButton"
        href="#">

        📥 Download eBook

      </a>

    </div>


    <div
      id="retry"
      class="retry"
      style="display:none">

      <button onclick="checkPayment()">

        Check Again

      </button>

    </div>

  </div>

</div>


<script>

  /*
   * Google Apps Script Web App URL
   */

  const API_URL =
    "YOUR_APPS_SCRIPT_EXEC_URL";


  /*
   * Read transaction ID
   *
   * success.html?txnid=TXN123
   */

  const params =
    new URLSearchParams(
      window.location.search
    );


  let txnid =
    params.get("txnid");


  /*
   * If URL doesn't contain txnid,
   * try localStorage.
   */

  if (!txnid) {

    txnid =
      localStorage.getItem(
        "ebook_txnid"
      );

  }


  document.getElementById(
    "txnid"
  ).textContent =
    txnid || "Not available";


  let attempts = 0;

  const MAX_ATTEMPTS = 60;

  let timer = null;


  /*
   * Check payment
   */

  async function checkPayment() {

    if (!txnid) {

      showFailed(
        "Transaction ID is missing."
      );

      return;
    }


    attempts++;


    try {

      const url =
        API_URL +
        "?options=checkpayment" +
        "&txnid=" +
        encodeURIComponent(txnid);


      const response =
        await fetch(
          url,
          {
            method: "GET",
            cache: "no-store"
          }
        );


      const result =
        await response.json();


      console.log(
        "Payment status:",
        result
      );


      if (
        result.success &&
        String(result.status)
          .toUpperCase() ===
        "SUCCESS"
      ) {

        paymentSuccessful(
          result
        );

        return;
      }


      if (
        result.status &&
        (
          String(result.status)
            .toUpperCase() ===
          "FAILED"
          ||
          String(result.status)
            .toUpperCase() ===
          "FAILURE"
        )
      ) {

        showFailed(
          "Payment was not successful."
        );

        return;
      }


      /*
       * Still pending
       */

      if (
        attempts >= MAX_ATTEMPTS
      ) {

        showPendingTimeout();

        return;
      }


      document.getElementById(
        "message"
      ).textContent =
        "Payment confirmation is still being processed. Checking again...";


      timer =
        setTimeout(
          checkPayment,
          2000
        );

    }

    catch (error) {

      console.error(error);


      if (
        attempts >= MAX_ATTEMPTS
      ) {

        showFailed(
          "Unable to verify payment."
        );

        return;
      }


      timer =
        setTimeout(
          checkPayment,
          3000
        );

    }

  }


  /*
   * Payment successful
   */

  function paymentSuccessful(
    order
  ) {

    clearTimeout(timer);


    document.getElementById(
      "spinner"
    ).style.display =
      "none";


    document.getElementById(
      "icon"
    ).textContent =
      "✅";


    const title =
      document.getElementById(
        "title"
      );

    title.textContent =
      "Payment Successful";

    title.className =
      "success";


    document.getElementById(
      "message"
    ).textContent =
      "Your eBook is ready for download.";


    /*
     * Build secure download page URL
     */

    let bookId =
      order.bookId;


    const downloadUrl =
      "https://kashvika.website/ebooks/download.html" +
      "?id=" +
      encodeURIComponent(bookId) +
      "&txnid=" +
      encodeURIComponent(txnid);


    document.getElementById(
      "downloadButton"
    ).href =
      downloadUrl;


    document.getElementById(
      "downloadBox"
    ).style.display =
      "block";


    /*
     * Save useful information
     */

    localStorage.setItem(
      "ebook_payment_success",
      "true"
    );

    localStorage.setItem(
      "ebook_book_id",
      bookId
    );

  }


  /*
   * Failed payment
   */

  function showFailed(
    message
  ) {

    clearTimeout(timer);


    document.getElementById(
      "spinner"
    ).style.display =
      "none";


    document.getElementById(
      "icon"
    ).textContent =
      "❌";


    const title =
      document.getElementById(
        "title"
      );

    title.textContent =
      "Payment Failed";

    title.className =
      "failed";


    document.getElementById(
      "message"
    ).textContent =
      message;


    document.getElementById(
      "retry"
    ).style.display =
      "block";

  }


  /*
   * Too much waiting
   */

  function showPendingTimeout() {

    clearTimeout(timer);


    document.getElementById(
      "spinner"
    ).style.display =
      "none";


    document.getElementById(
      "icon"
    ).textContent =
      "⏳";


    document.getElementById(
      "title"
    ).textContent =
      "Payment Confirmation Pending";


    document.getElementById(
      "message"
    ).textContent =
      "Your payment may still be processing. Please check again shortly.";


    document.getElementById(
      "retry"
    ).style.display =
      "block";

  }


  /*
   * Start immediately
   */

  if (txnid) {

    checkPayment();

  }
  else {

    showFailed(
      "Transaction ID was not received."
    );

  }

</script>

</body>
</html>
